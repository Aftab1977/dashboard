<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImproveID Workspace — Workstream Timeline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root, [data-theme="dark"]{
    --ink:#0D1316;
    --panel:#141B1F;
    --panel-raised:#1B2328;
    --panel-hi:#212A2F;
    --line:#2A353B;
    --line-soft:#1E2830;
    --paper:#EDE8DC;
    --paper-dim:#8F988F;
    --paper-faint:#5B6560;
    --green:#33A85C;
    --green-soft:#132A1C;
    --green-glow:rgba(51,168,92,.38);
    --red:#DD5147;
    --red-soft:#331A17;
    --red-glow:rgba(221,81,71,.4);
    --amber:#E0AC3F;
    --amber-soft:#2E2410;
    --amber-border:rgba(224,172,63,.4);
    --amber-glow:rgba(224,172,63,.35);
    --blocker:#CC5500;
    --blocker-soft:#2E1B0A;
    --blocker-border:rgba(204,85,0,.4);
    --blocker-glow:rgba(204,85,0,.35);
    --card-shadow:none;
    --f-display:'Barlow Condensed',sans-serif;
    --f-body:'Space Grotesk',sans-serif;
    --f-mono:'JetBrains Mono',monospace;
  }
  [data-theme="light"]{
    --ink:#E9EBF2;
    --panel:#FFFFFF;
    --panel-raised:#F7F8FC;
    --panel-hi:#EEF0F7;
    --line:#E3E5EE;
    --line-soft:#ECEDF4;
    --paper:#1D2029;
    --paper-dim:#6B7280;
    --paper-faint:#9CA3AF;
    /* Green & red stay identical to Dark — these are status colors (green = done/
       closed, red = pending/delayed), not decorative, so they don't change per theme. */
    --green:#33A85C;
    --green-soft:#E6F6EC;
    --green-glow:rgba(51,168,92,.22);
    --red:#DD5147;
    --red-soft:#FCEAE8;
    --red-glow:rgba(221,81,71,.22);
    --amber:#3066CE;
    --amber-soft:#EBF1FB;
    --amber-border:rgba(48,102,206,.35);
    --amber-glow:rgba(48,102,206,.3);
    /* Blockers get their own dedicated dark-orange, identical across themes — like
       green/red, this is a status color carrying real meaning, not decoration. */
    --blocker:#CC5500;
    --blocker-soft:#FBEDE3;
    --blocker-border:rgba(204,85,0,.35);
    --blocker-glow:rgba(204,85,0,.3);
    --card-shadow:0 1px 3px rgba(30,35,60,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--f-body);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(51,168,92,.05), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(221,81,71,.05), transparent 35%);
  }
  ::selection{background:var(--amber);color:var(--ink);}
  a{color:inherit;}
  button{font-family:var(--f-body);cursor:pointer;}
  input,select,textarea{font-family:var(--f-body);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }

  /* ---------- layout shell ---------- */
  #app{display:flex;min-height:100vh;}
  .navrail{
    width:76px;flex:0 0 76px;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    padding:18px 0;gap:6px;position:sticky;top:0;height:100vh;
  }
  .navrail .brand{
    width:38px;height:38px;border-radius:8px;
    background:conic-gradient(from 220deg, var(--green), var(--amber), var(--red), var(--green));
    margin-bottom:22px;position:relative;
  }
  .brand::after{content:"";position:absolute;inset:5px;background:var(--panel);border-radius:5px;}
  .navbtn{
    width:52px;height:52px;border-radius:10px;border:1px solid transparent;
    background:transparent;color:var(--paper-dim);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;font-family:var(--f-body);font-weight:600;transition:all .15s ease;
  }
  .navbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .navbtn:hover{color:var(--paper);background:var(--panel-raised);}
  .navbtn.active{color:var(--ink);background:var(--paper);}
  [data-theme="light"] .navbtn.active{color:#fff;background:var(--amber);}
  .navrail .spacer{flex:1;}
  .navbtn.logout{color:var(--red);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:1px solid var(--line);
    background:rgba(20,27,31,.6);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:5;
  }
  .topbar-accent-btn{padding:6px 14px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-border);box-shadow:0 0 10px -4px var(--amber-glow);font-weight:600;}
  .crumb{font-family:var(--f-mono);font-size:12px;color:var(--paper-dim);letter-spacing:.03em;}
  .crumb b{color:var(--paper);font-weight:600;}
  .today-display{font-size:12px;font-weight:600;color:var(--amber);letter-spacing:.03em;padding:6px 14px;border:1px solid var(--amber-border);background:var(--amber-soft);border-radius:14px;box-shadow:0 0 12px -4px var(--amber-glow);text-align:center;line-height:1.3;}
  .today-time{font-size:10px;font-weight:500;color:var(--amber);opacity:.85;letter-spacing:.06em;}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--paper-dim);}
  .who .avatar{
    width:28px;height:28px;border-radius:50%;background:var(--panel-hi);
    display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);
    font-size:11px;color:var(--paper);border:1px solid var(--line);
  }
  /* Light theme: the topbar itself becomes the dominant blue, so everything sitting
     inside it needs to switch to a light-on-blue treatment instead of its normal
     colors — otherwise the blue-on-blue elements (Go Back, the date pill) would
     disappear into the new background. */
  [data-theme="light"] .topbar{background:var(--amber);border-bottom:none;}
  [data-theme="light"] .crumb{color:rgba(255,255,255,.8);}
  [data-theme="light"] .crumb b{color:#fff;}
  [data-theme="light"] .topbar-accent-btn{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);box-shadow:none;}
  [data-theme="light"] .today-display{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);box-shadow:none;}
  [data-theme="light"] .today-time{color:rgba(255,255,255,.85);}
  [data-theme="light"] .who{color:rgba(255,255,255,.9);}
  [data-theme="light"] .who .avatar{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.35);}
  .content{padding:28px;max-width:1240px;width:100%;margin:0 auto;flex:1;}

  /* ---------- typography ---------- */
  h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.01em;}
  .eyebrow{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--paper-faint);margin:0 0 6px;
  }
  .page-title{font-size:38px;line-height:1.05;}
  .section-title{font-size:22px;margin-bottom:14px;}
  .muted{color:var(--paper-dim);}
  .mono{font-family:var(--f-mono);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel-raised);color:var(--paper);
    font-size:13px;font-weight:600;transition:all .15s ease;
  }
  .btn:hover{background:var(--panel-hi);border-color:var(--paper-faint);}
  .btn-primary{background:var(--paper);color:var(--ink);border-color:var(--paper);}
  .btn-primary:hover{background:#fff;}
  [data-theme="light"] .btn-primary{background:var(--amber);color:#fff;border-color:var(--amber);}
  [data-theme="light"] .btn-primary:hover{background:#2857BB;}
  .btn-danger{background:var(--red-soft);color:var(--red);border-color:rgba(221,81,71,.35);}
  .btn-danger:hover{background:rgba(221,81,71,.22);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--paper-dim);}
  .btn-ghost:hover{color:var(--paper);background:var(--panel-raised);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- cards & grids ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--card-shadow);}
  .grid{display:grid;gap:16px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr;}}

  /* ---------- status pills / badges ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
    font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  }
  .pill-green{background:var(--green-soft);color:var(--green);}
  .pill-red{background:var(--red-soft);color:var(--red);}
  .pill-amber{background:var(--amber-soft);color:var(--amber);}
  .pill-blocker{background:var(--blocker-soft);color:var(--blocker);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .dot.pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .pill-blink{animation:pillBlink 1.6s ease-in-out infinite;}
  @keyframes pillBlink{0%,100%{opacity:1;}50%{opacity:.4;}}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
  .cal-dow{font-size:10px;color:var(--paper-faint);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px;}
  .cal-day{aspect-ratio:1;border-radius:6px;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);border:1px solid var(--line-soft);}
  .cal-day.blank{background:transparent;border:none;}
  .cal-day.weekend{border-style:dashed;}
  .cal-day.weekend:not(.closed):not(.current):not(.future){background:rgba(255,255,255,.025);color:var(--paper-faint);}
  .cal-day.closed{background:rgba(230,159,90,.22);color:#E6A560;border-color:rgba(230,159,90,.45);}
  .cal-day.current{background:rgba(232,214,107,.22);color:#E8D66B;border-color:rgba(232,214,107,.45);font-weight:700;}
  .cal-day.future{background:rgba(126,182,224,.2);color:#7EB6E0;border-color:rgba(126,182,224,.42);}
  .cal-day.free{background:rgba(143,214,158,.18);color:#8FD69E;border-color:rgba(143,214,158,.38);}
  .cal-day.admin-toggle{cursor:pointer;}
  .cal-day.admin-toggle:hover{outline:1px solid var(--paper-dim);outline-offset:1px;}

  /* ---------- portfolio cards ---------- */
  .proj-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
    cursor:pointer;transition:all .15s ease;position:relative;overflow:hidden;box-shadow:var(--card-shadow);
  }
  .proj-card:hover{border-color:var(--paper-faint);transform:translateY(-2px);}
  .proj-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  }
  .proj-card.status-green::before{background:var(--green);box-shadow:0 0 14px var(--green-glow);}
  .proj-card.status-red::before{background:var(--red);box-shadow:0 0 14px var(--red-glow);}
  .proj-card .pname{font-family:var(--f-display);font-size:24px;margin:2px 0 12px;}
  .proj-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--paper-dim);margin-top:14px;}
  .bar-track{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:12px;}
  .bar-fill{height:100%;background:var(--green);border-radius:99px;}
  .bar-fill.red{background:var(--red);}

  /* ---------- hero ---------- */
  .hero{
    border-radius:16px;border:1px solid var(--line);background:var(--panel);
    padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    position:relative;overflow:hidden;flex-wrap:wrap;
  }
  .hero.status-red{border-color:rgba(221,81,71,.4);box-shadow:0 0 0 1px rgba(221,81,71,.12) inset, 0 18px 50px -24px var(--red-glow);}
  .hero.status-green{border-color:rgba(51,168,92,.35);box-shadow:0 0 0 1px rgba(51,168,92,.1) inset, 0 18px 50px -24px var(--green-glow);}
  .hero-metrics{display:flex;gap:36px;flex-wrap:wrap;}
  .metric .eyebrow{margin-bottom:8px;}
  .metric .val{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1;}
  .metric .val.red{color:var(--red);}
  .metric .val.green{color:var(--green);}
  .metric .sub{font-size:11px;color:var(--paper-faint);margin-top:6px;font-family:var(--f-mono);}

  /* ---------- handoff rail (signature element) ---------- */
  .rail-wrap{overflow-x:auto;padding-bottom:6px;}

  .chain-row{display:flex;align-items:center;gap:0;margin:22px 0;min-width:max-content;}
  .chain-label{
    width:150px;flex:0 0 150px;font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);
    padding-right:14px;text-align:right;line-height:1.4;
  }
  .chain-label .tag{display:block;color:var(--paper-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .chain-track{display:flex;align-items:center;}
  .rail-node{
    position:relative;border-radius:9px;border:1.5px solid var(--line);
    background:var(--panel-raised);padding:10px 14px;min-width:96px;max-width:190px;
    display:flex;flex-direction:column;gap:3px;
  }
  .rail-att-badge{position:absolute;top:6px;right:8px;font-size:11px;line-height:1;cursor:default;}
  .rail-node .nt{font-size:12px;font-weight:600;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:162px;}
  .rail-node .nd{font-family:var(--f-mono);font-size:10px;color:var(--paper-dim);}
  .rail-node .nu{font-size:9.5px;color:var(--paper);line-height:1.3;margin-top:1px;}
  .rail-node.green{border-color:var(--green);box-shadow:0 0 0 1px rgba(51,168,92,.15) inset;}
  .rail-node.green .nd{color:var(--green);}
  .rail-node.red{border-color:var(--red);box-shadow:0 0 12px -2px var(--red-glow);}
  .rail-node.red .nd{color:var(--red);}
  .rail-node.amber{border-color:var(--amber);}
  .rail-node.amber .nd{color:var(--amber);}
  .rail-connector{width:26px;height:2px;background:var(--line);position:relative;flex:0 0 26px;}
  .rail-connector::after{
    content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);
    border:4px solid transparent;border-left-color:var(--line);
  }
  .chain-total{
    flex:0 0 auto;margin-left:14px;font-family:var(--f-mono);font-size:11px;color:var(--paper-faint);
    padding-left:14px;border-left:1px solid var(--line-soft);white-space:nowrap;
  }
  .chain-total b{color:var(--paper);font-size:13px;}
  .chain-row.critical .chain-label{color:var(--paper);}
  .chain-row.critical .chain-label .tag{color:var(--amber);}
  .chain-row.critical .chain-total b{color:var(--amber);}

  /* ---------- donut / gauges ---------- */
  .donut-big{
    width:168px;height:168px;border-radius:50%;position:relative;flex:0 0 168px;
  }
  .donut-big .hole{
    position:absolute;inset:16px;background:var(--panel);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .donut-big .hole .pct{font-family:var(--f-mono);font-size:28px;font-weight:700;}
  .donut-big .hole .lbl{font-size:10px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;flex:1;}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--panel-raised);border:1px solid var(--line-soft);}
  .gauge-ring{width:64px;height:64px;border-radius:50%;position:relative;}
  .gauge-ring .hole{position:absolute;inset:8px;background:var(--panel-raised);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:600;}
  .gauge .gname{font-size:12px;font-weight:600;text-align:center;}
  .gauge .gfrac{font-family:var(--f-mono);font-size:10px;color:var(--paper-dim);}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--paper-faint);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;
  }
  tbody td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover{background:var(--panel-raised);}
  .task-title{font-weight:600;}
  .task-title-link{cursor:pointer;width:fit-content;}
  .task-title-link:hover{text-decoration:underline;color:var(--paper);}
  .task-desc{color:var(--paper-dim);font-size:11px;margin-top:2px;max-width:280px;}
  .date-pair{font-family:var(--f-mono);font-size:11px;}
  .date-pair .orig{color:var(--paper-dim);}
  .date-pair .ext{color:var(--red);text-decoration:none;}
  .date-pair .strike{text-decoration:line-through;color:var(--paper-faint);}

  /* ---------- forms & modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,9,10,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px;
  }
  .modal h3{font-size:22px;margin-bottom:4px;}
  .modal .modal-sub{color:var(--paper-dim);font-size:12px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-faint);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:7px;
    padding:9px 11px;color:var(--paper);font-size:13px;
  }
  .field textarea{resize:vertical;min-height:64px;font-family:var(--f-body);}
  .field input:disabled{opacity:.5;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .hint{font-size:11px;color:var(--paper-faint);margin-top:4px;}
  .credential-box{
    background:var(--ink);border:1px dashed var(--paper-faint);border-radius:8px;padding:14px;
    font-family:var(--f-mono);font-size:13px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;
  }

  /* ---------- login ---------- */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;width:100%;}
  .login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;}
  .login-logo{max-width:264px;max-height:86px;width:auto;height:auto;object-fit:contain;margin:0 auto 18px;display:block;}
  .login-title{font-family:var(--f-display);font-size:30px;margin-bottom:2px;text-align:center;}
  .login-error{color:var(--red);font-size:12px;margin-top:8px;font-family:var(--f-mono);min-height:14px;}

  /* ---------- admin tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 4px;margin-right:18px;background:none;border:none;color:var(--paper-dim);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--paper);border-bottom-color:var(--amber);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--paper-faint);}
  .empty-state .et{font-family:var(--f-display);font-size:20px;color:var(--paper-dim);margin-bottom:6px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters select{background:var(--panel-raised);border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:8px 10px;font-size:12px;font-family:var(--f-body);}

  .stat-strip{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}

function sandboxSafeFetch(url, options){

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

// browser's own timezone — delay tracking should be consistent for everyone.
function todayISO(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  return new Date(Date.now() + IST_OFFSET_MS).toISOString().slice(0,10);
}
// Current time in IST, 24-hour HH:MM — purely for display, not used in any date math.
function nowTimeIST(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  const d = new Date(Date.now() + IST_OFFSET_MS);
  return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}
// A combined IST date+time stamp, e.g. "2026-07-20T22:03", for recording exactly
// when something was last touched (used by the task update-history chart).
function nowDateTimeIST(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  const d = new Date(Date.now() + IST_OFFSET_MS);
  const date = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  const time = `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
  return `${date}T${time}`;
}

  if(n>3 && n<21) return 'th';
  switch(n%10){ case 1: return 'st'; case 2: return 'nd'; case 3: return 'rd'; default: return 'th'; }

  if(!iso) return '';

  const d = new Date(datePart+'T00:00:00');
  const day = d.getDate();
  const month = d.toLocaleDateString('en-US',{month:'short'});
  return `${timePart} ${day}${ordinalSuffix(day)} ${month} ${d.getFullYear()}`;

  const d = new Date(iso+'T00:00:00');

//     this is live, no button needed, and once it's happened it stays true even
//     after the task later closes (admins can always amend the record via "Amend timeline").
function isTaskDelayed(t){
  if(t.deadlineDisabled) return false;
  if(t.extended) return true;
  if(t.status==='closed'){
    return !!(t.closedDate && t.originalEndDate && t.closedDate > t.originalEndDate);
  }
  return !!(t.originalEndDate && todayISO() > t.originalEndDate);
}
// The date a task's current duration should be measured against: its agreed/extended
// end date, but if it's still open and that date has already passed, the gap keeps
// growing with each day (today, IST) until it's closed or extended — then it freezes.
function effectiveEndDate(t){
  if(!t.endDate) return t.endDate;
  if(t.status==='closed'){
    return (t.closedDate && t.closedDate > t.endDate) ? t.closedDate : t.endDate;
  }
  const today = todayISO();
  return (today > t.endDate) ? today : t.endDate;
}

function blockedTeamsForProject(projectId){
  const ids = new Set();
  projectTasks(projectId).forEach(t=>{ if(t.blockedByTeamId) ids.add(t.blockedByTeamId); });
  return Array.from(ids).map(id => (state.teams.find(tm=>tm.id===id) || {}).name || 'Unknown team');
}
// Same as above, but paired with the reason given for each blocked task — used to
// build a hover tooltip so people can see WHY without opening the task.
function blockedDetailForProject(projectId){
  return projectTasks(projectId)
    .filter(t=>t.blockedByTeamId)
    .map(t=>{
      const blockerName = t.blockedByUserId ? entityName('user', t.blockedByUserId) : null;
      return `${entityName(t.assignedType,t.assignedId)}${blockerName?' (blocked by '+blockerName+')':''}: ${t.blockerReason || 'no reason given'}`;
    })
    .join(' | ');
}

// Which teams/individuals actually have a delayed task in this project — used to
// show "DELAYED 5D BY <who>" so it's obvious at a glance who to go ask.
function delayResponsibleNames(projectId){
  const names = new Set();
  projectTasks(projectId).forEach(t=>{ if(isTaskDelayed(t)) names.add(entityName(t.assignedType,t.assignedId)); });
  return Array.from(names);
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('storage timeout')), ms))
  ]);
}

function isValidState(s){
  return s && Array.isArray(s.users) && Array.isArray(s.teams) && Array.isArray(s.projects) && Array.isArray(s.tasks) && s.users.length > 0;
}
// A rough measure of "how much real content is in here" — used to decide whether a
// legacy storage bucket has more genuine data than what's currently active, without
// needing to understand exactly what changed.
function stateRichness(s){
  if(!isValidState(s)) return -1;
  return s.users.length + s.teams.length + s.projects.length + s.tasks.length;
}
// Data saved before the Feature/Knowledge tree existed won't have featureNodes at
// all — add the six root Features in that case so nothing breaks and nothing already
// saved is touched.
function normalizeState(s){
  if(!s) return s;
  if(!Array.isArray(s.featureNodes) || s.featureNodes.length===0){
    s.featureNodes = [
      {id:'feat_summary', name:'Summary - Daily & Weekly', nodeType:'feature', parentId:null, systemView:null, order:0, contentItems:[], description:''},
      {id:'feat_ai_agent', name:'AI Agent', nodeType:'feature', parentId:null, systemView:null, order:0.5, contentItems:[], description:''},
      {id:'feat_workstream', name:'Workstream', nodeType:'feature', parentId:null, systemView:'portfolio', order:1, contentItems:[], description:''},
      {id:'feat_assignments', name:'Active Assignments', nodeType:'feature', parentId:null, systemView:'assignments', order:2, contentItems:[], description:''},
      {id:'feat_reports', name:'Reports', nodeType:'feature', parentId:null, systemView:'reports', order:3, contentItems:[], description:''},
      {id:'feat_kr', name:'Repository', nodeType:'feature', parentId:null, systemView:null, order:4, contentItems:[], description:''},
      {id:'feat_fai', name:'FAI — Frequently Asked Information', nodeType:'feature', parentId:null, systemView:null, order:5, contentItems:[], description:''},
      {id:'feat_hr', name:'HR', nodeType:'feature', parentId:null, systemView:null, order:6, contentItems:[], description:''},
      {id:'h_attendance_v3', name:'Attendance', nodeType:'heading', parentId:'feat_hr', order:1, contentItems:[], description:'', specialView:'attendance'},
      {id:'h_appraisal', name:'Appraisal', nodeType:'heading', parentId:'feat_hr', order:2, contentItems:[], description:'', specialView:'appraisal'},
      {id:'h_policies', name:'Policies', nodeType:'heading', parentId:'feat_hr', order:3, contentItems:[], description:'', specialView:null},
    ];
  } else {
    // migrate feature nodes already saved by an earlier version of this app
    s.featureNodes.forEach(n=>{
      if(typeof n.description !== 'string') n.description = '';
      if(n.id==='feat_kr' && n.name==='Knowledge Repository') n.name = 'Repository'; // rename, but only if never customized
      // Any Heading literally named "Attendance" automatically becomes the attendance
      // sheet view when opened — no extra setup step needed.
      if(n.nodeType==='heading' && (n.name||'').trim().toLowerCase()==='attendance' && !n.specialView){
        n.specialView = 'attendance';
      }
      // Same for "Appraisal" — becomes the appraisal sheet view automatically.
      if(n.nodeType==='heading' && (n.name||'').trim().toLowerCase()==='appraisal' && !n.specialView){
        n.specialView = 'appraisal';
      }
    });
    // One-time addition: an "Appraisal" heading under HR, requested directly rather
    // than through the (now removed) in-app creation buttons. Keyed by a stable id so
    // this only ever runs once — if it's later renamed or deleted, it won't come back.
    if(!s.featureNodes.some(n=>n.id==='h_appraisal') && s.featureNodes.some(n=>n.id==='feat_hr')){
      const hrKids = s.featureNodes.filter(n=>n.parentId==='feat_hr');
      const nextOrder = hrKids.length ? Math.max(...hrKids.map(n=>n.order||0))+1 : 1;
      s.featureNodes.push({id:'h_appraisal', name:'Appraisal', nodeType:'heading', parentId:'feat_hr', order:nextOrder, contentItems:[], description:'', specialView:'appraisal'});
    }
    // One-time removal: both "Attendance" and "Staff Attendance" headings under HR,
    // and anything nested under them, at the user's explicit request to start over.
    // Also clears the underlying attendance records (P/L/WFH/NS marks) for a genuinely
    // clean slate. Keyed by a flag so this only ever runs once — recreating either
    // heading afterward (manually, or via a future prompt here) won't be undone by this.
    if(!s._removedAttendanceHeadingsV2 && s.featureNodes.some(n=>n.id==='feat_hr')){
      const namesToRemove = ['attendance','staff attendance'];
      const toRemove = s.featureNodes.filter(n=>n.nodeType==='heading' && n.parentId==='feat_hr' && namesToRemove.includes((n.name||'').trim().toLowerCase()));
      toRemove.forEach(n=>{
        const removeIds = new Set([n.id]);
        let changed = true;
        while(changed){
          changed = false;
          s.featureNodes.forEach(x=>{ if(x.parentId && removeIds.has(x.parentId) && !removeIds.has(x.id)){ removeIds.add(x.id); changed = true; } });
        }
        s.featureNodes = s.featureNodes.filter(x=>!removeIds.has(x.id));
      });
      s.attendance = {};
      s._removedAttendanceHeadingsV2 = true;
    }
    // One-time addition: a fresh "Attendance" heading under HR (new stable id, so it
    // doesn't conflict with the removal migration above), wired straight to the
    // attendance sheet view.
    if(!s.featureNodes.some(n=>n.id==='h_attendance_v3') && s.featureNodes.some(n=>n.id==='feat_hr')){
      const hrKidsAtt = s.featureNodes.filter(n=>n.parentId==='feat_hr');
      const nextOrderAtt = hrKidsAtt.length ? Math.max(...hrKidsAtt.map(n=>n.order||0))+1 : 1;
      s.featureNodes.push({id:'h_attendance_v3', name:'Attendance', nodeType:'heading', parentId:'feat_hr', order:nextOrderAtt, contentItems:[], description:'', specialView:'attendance'});
    }
    // One-time addition: a plain "Policies" heading under HR.
    if(!s.featureNodes.some(n=>n.id==='h_policies') && s.featureNodes.some(n=>n.id==='feat_hr')){
      const hrKids4 = s.featureNodes.filter(n=>n.parentId==='feat_hr');
      const nextOrder4 = hrKids4.length ? Math.max(...hrKids4.map(n=>n.order||0))+1 : 1;
      s.featureNodes.push({id:'h_policies', name:'Policies', nodeType:'heading', parentId:'feat_hr', order:nextOrder4, contentItems:[], description:'', specialView:null});
    }
    // One-time addition: the Summary module, placed above Workstream via order 0.
    if(!s.featureNodes.some(n=>n.id==='feat_summary')){
      s.featureNodes.push({id:'feat_summary', name:'Summary - Daily & Weekly', nodeType:'feature', parentId:null, systemView:null, order:0, contentItems:[], description:''});
    }
    // One-time addition: the AI Agent. Unlike Summary, this deliberately does NOT
    // get auto-granted to anyone below — access is admin-controlled from the start.
    if(!s.featureNodes.some(n=>n.id==='feat_ai_agent')){
      s.featureNodes.push({id:'feat_ai_agent', name:'AI Agent', nodeType:'feature', parentId:null, systemView:null, order:0.5, contentItems:[], description:''});
    }
  }
  // Give everyone the new Summary module specifically — the general Access grandfather
  // migration below only ever runs once, so a brand new module added afterward would
  // otherwise be invisible to everyone until an admin manually ticks it.
  if(!s._summaryModuleGranted && Array.isArray(s.users)){
    if(!s.userAccess) s.userAccess = {};
    s.users.forEach(u=>{
      if(u.role==='admin') return;
      if(!s.userAccess[u.id]) s.userAccess[u.id] = [];
      if(!s.userAccess[u.id].includes('feat_summary')) s.userAccess[u.id].push('feat_summary');
    });
    s._summaryModuleGranted = true;
  }
  if(!s.dailySnapshots || typeof s.dailySnapshots !== 'object' || Array.isArray(s.dailySnapshots)) s.dailySnapshots = {};
  if(!s.dailySummaries || typeof s.dailySummaries !== 'object' || Array.isArray(s.dailySummaries)) s.dailySummaries = {};
  if(!s.weeklySummaries || typeof s.weeklySummaries !== 'object' || Array.isArray(s.weeklySummaries)) s.weeklySummaries = {};
  if(!s.summaryShownLog || typeof s.summaryShownLog !== 'object' || Array.isArray(s.summaryShownLog)) s.summaryShownLog = {};
  if(!s.attendance || typeof s.attendance !== 'object' || Array.isArray(s.attendance)) s.attendance = {};
  if(!s.appraisal || typeof s.appraisal !== 'object' || Array.isArray(s.appraisal)) s.appraisal = {};
  if(!s.settings || typeof s.settings !== 'object') s.settings = {};
  if(typeof s.settings.maxUploadMB !== 'number') s.settings.maxUploadMB = 250;
  if(!s.userAccess || typeof s.userAccess !== 'object' || Array.isArray(s.userAccess)) s.userAccess = {};
  if(Array.isArray(s.projects)) s.projects.forEach(p=>{ if(!Array.isArray(p.contentItems)) p.contentItems = []; });
  // One-time only: the Access feature didn't exist before, so nobody had any grants yet.
  // Give every current non-admin user access to everything that exists right now, so
  // their visibility doesn't collapse to nothing the moment this ships. Anything
  // created after this point still defaults to hidden for everyone, as intended.
  if(!s._userAccessGrandfathered && Array.isArray(s.users) && Array.isArray(s.featureNodes)){
    const allNodeIds = s.featureNodes.map(n=>n.id);
    s.users.forEach(u=>{
      if(u.role!=='admin' && !s.userAccess[u.id]) s.userAccess[u.id] = allNodeIds.slice();
    });
    s._userAccessGrandfathered = true;
  }
  // Tasks saved before the per-task checklist toggle existed relied entirely on the
  // workstream's own setting — carry that over as their starting value so closing
  // behavior doesn't silently change for anything already in progress.
  if(Array.isArray(s.tasks) && Array.isArray(s.projects)){
    s.tasks.forEach(t=>{
      if(typeof t.checklistRequired !== 'boolean'){
        const proj = s.projects.find(p=>p.id===t.projectId);
        t.checklistRequired = !!(proj && proj.requireChecklist);
      }
    });
  }
  return s;
}

// Manually triggered from Admin — lets the admin explicitly check the old "personal"
// storage bucket for data stranded there by an earlier version of this app, and choose
// whether to load it in. This never runs silently; the admin always sees the comparison
// and decides.
async function checkForLegacyData(){
  const btn = document.getElementById('recoverLegacyBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
  let legacyState = null;
  try{
    const legacyRes = await withTimeout(window.storage.get(STORAGE_KEY, false), 5000);
    legacyState = legacyRes && legacyRes.value ? JSON.parse(legacyRes.value) : null;
  }catch(e){ legacyState = null; }
  if(btn){ btn.disabled = false; btn.textContent = 'Check for legacy data'; }

  if(!isValidState(legacyState)){
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-backdrop" data-backdrop>
        <div class="modal">
          <h3>No legacy data found</h3>
          <div class="modal-sub">Nothing usable was found in the older storage location.</div>
          <div class="modal-actions"><button class="btn btn-primary" data-close>OK</button></div>
        </div>
      </div>`;
    bindModalClose();
    return;
  }

  const currentCounts = `${state.users.length} users, ${state.teams.length} teams, ${state.projects.length} workstreams, ${state.tasks.length} tasks`;
  const legacyCounts = `${legacyState.users.length} users, ${legacyState.teams.length} teams, ${legacyState.projects.length} workstreams, ${legacyState.tasks.length} tasks`;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Legacy data found</h3>
        <div class="modal-sub">Compare before deciding — loading legacy data replaces what's currently active.</div>
        <div class="field"><label>Currently active</label><div class="hint">${currentCounts}</div></div>
        <div class="field"><label>Found in legacy storage</label><div class="hint">${legacyCounts}</div></div>
        <div class="hint">This does not merge the two — it replaces the active data with the legacy set. If you need both combined, tell me what's in each and I can help reconcile it manually.</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-danger" id="loadLegacyBtn">Load legacy data instead</button>
        </div>
      </div>
    </div>`;
  bindModalClose();
  document.getElementById('loadLegacyBtn').addEventListener('click', async ()=>{
    state = normalizeState(legacyState);
    await persist();
    closeModal();
    render();
  });
}

// Best-effort background reconciliation with any previously saved data. Runs after the first
// render, with a short budget, and only touches the UI if the person hasn't started using it yet.
async function reconcileWithStorage(){
  if(!HAS_STORAGE) return;
  const stillOnFreshLogin = ()=> ui.view==='login' && !session.userId;
  let stateFetchFailed = false;

  try{
    const [stateSettled, sessionSettled] = await withTimeout(Promise.allSettled([
      storageAdapter.get(STORAGE_KEY),
      (sessionAdapter ? sessionAdapter.get(SESSION_KEY) : Promise.resolve(null)),
    ]), 4000);

    let stateRes = null;
    if(stateSettled.status === 'fulfilled'){
      stateRes = stateSettled.value;
    } else {
      // The fetch itself failed (timeout, network, RLS, anything) — this is NOT the
      // same thing as "nothing has ever been saved here." Treating a failed fetch as
      // "empty" is exactly what let this app overwrite real Supabase data with fresh
      // seed data in the past. From here on, a failed fetch always means "we don't
      // know what's there" — never "there's nothing there."
      stateFetchFailed = true;
      console.error('Fetching saved state failed:', stateSettled.reason);
    }
    const sessionRes = (sessionSettled && sessionSettled.status === 'fulfilled') ? sessionSettled.value : null;

    let parsedState = stateRes && stateRes.value ? JSON.parse(stateRes.value) : null;
    const parsedSession = sessionRes && sessionRes.value ? JSON.parse(sessionRes.value) : null;

    // One-time migration: earlier versions of this app saved the shared app data under
    // Claude's "personal" storage bucket instead of "shared". Compare RICHNESS, not just
    // validity — a brief window existed where the new shared bucket could have been
    // seeded with fresh demo data before this migration existed, which would otherwise
    // permanently mask real legacy data sitting in the old bucket.
    if(HAS_CLAUDE_STORAGE && !supaClient){
      try{
        const legacyRes = await withTimeout(window.storage.get(STORAGE_KEY, false), 4000);
        const legacyState = legacyRes && legacyRes.value ? JSON.parse(legacyRes.value) : null;
        if(isValidState(legacyState) && stateRichness(legacyState) > stateRichness(parsedState)){
          parsedState = legacyState;
        }
      }catch(e){ /* no legacy data to recover, that's fine */ }
    }

    if(isValidState(parsedState) && stillOnFreshLogin()){
      try{
        state = normalizeState(parsedState);
      }catch(normErr){
        // A bug in a migration must never cost real data — fall back to the raw,
        // un-migrated (but real) state rather than silently leaving the stale seed
        // data in memory. Surface it so it's never silently invisible, on whichever
        // screen actually ends up showing (login, if no session to resume; the app
        // shell, if there is).
        console.error('normalizeState failed — using raw saved data as a fallback:', normErr);
        state = parsedState;
        const migrationMsg = 'A data-migration step hit an error and was skipped: ' + describeError(normErr) + '. Your saved data is still intact — this only means the newest features may not show correctly until this is fixed.';
        ui.migrationError = migrationMsg;
        ui.loginError = migrationMsg;
      }
      if(parsedSession && typeof parsedSession==='object' && parsedSession.userId && state.users.find(u=>u.id===parsedSession.userId)){
        session = parsedSession;
        ui.view = 'home';
        try{
          runSummaryEngine();
          checkAndShowSummaryPopup();
        }catch(summaryErr){
          // Never let a bug in the newer Summary feature block the rest of the app
          // from loading and showing real data.
          console.error('Summary engine failed (non-fatal):', summaryErr);
        }
        loadAiConversationHistory(session.userId); // this path (session restored on page load/refresh) was missing this call entirely
      }
      render();
      persist(); // ensures a migrated legacy state gets written into the shared bucket right away
    } else if(!isValidState(parsedState) && !stateFetchFailed){
      // Only safe to treat this as "genuinely nothing saved yet" when the fetch itself
      // definitely succeeded and found no row — never when the fetch failed, since a
      // failure tells us nothing about whether real data exists.
      persist();
    } else if(stateFetchFailed){
      // The fetch failed — do NOT touch Supabase. Show an error and leave whatever is
      // there completely alone; refreshing (once connectivity is fine) will find it.
      const msg = 'Could not load your saved data this time. Nothing was changed or overwritten — refresh to try again.';
      ui.saveError = msg;
      ui.loginError = msg;
      render();
    }
  }catch(e){
    // Storage never responded in time, or something else unexpected failed. The seed
    // data already on screen keeps the app usable, but the person needs to know their
    // real data didn't load — silence here is exactly what made past incidents
    // confusing ("where did my data go?") instead of obviously "still loading/retry".
    console.error('reconcileWithStorage failed:', e);
    const msg = 'Could not load your saved data (' + describeError(e) + '). What you see now may be starter/demo content, not your real data. Try refreshing — if this keeps happening, your data is very likely still safe in Supabase, just not reachable from this page load.';
    ui.saveError = msg;
    ui.loginError = ui.loginError || msg;
    render();
  }
}

function describeError(e){
  if(!e) return 'unknown error';
  if(typeof e === 'string') return e;
  const parts = [e.message, e.details, e.hint, e.code].filter(Boolean);
  return parts.length ? parts.join(' | ') : JSON.stringify(e);
}

// Every persist() call is chained after the previous one, so saves always land in the
// order they were made — rapid successive edits (like adding three headings quickly)
// used to be able to finish out of order over the network, letting an earlier, staler
// write overwrite a later, more complete one. Chaining removes that race entirely.
let persistChain = Promise.resolve();
function persist(){
  persistChain = persistChain.then(async ()=>{
    if(!HAS_STORAGE) return;
    try{
      await storageAdapter.set(STORAGE_KEY, JSON.stringify(state));
      if(ui.saveError){ ui.saveError = null; render(); }
    }
    catch(e){
      const msg = describeError(e);
      console.error('save failed:', msg);
      ui.saveError = msg;
      render();
    }
  });
  return persistChain;
}
async function persistSession(){
  if(!sessionAdapter) return;
  try{ await sessionAdapter.set(SESSION_KEY, JSON.stringify(session)); }
  catch(e){ /* ignore */ }
}

function currentUser(){ return state.users.find(u=>u.id===session.userId) || null; }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

// null = unrestricted (sees everything). Otherwise an array of project ids the
// current user is allowed to see: admins see everything, viewers see whatever
// the admin assigned them ('all' or a specific list), and regular members only
// see projects where they (or their team) actually have a task assigned.
function accessibleProjectIds(){
  const u = currentUser();
  if(!u) return [];
  if(u.role==='admin') return null;
  if(u.role==='viewer'){
    if(u.viewerProjectIds==='all') return null;
    return Array.isArray(u.viewerProjectIds) ? u.viewerProjectIds : [];
  }
  const ids = new Set();
  state.tasks.forEach(t=>{
    if((t.assignedType==='user' && t.assignedId===u.id) || (t.assignedType==='team' && t.assignedId===u.teamId)){
      ids.add(t.projectId);
    }
    if(t.blockedByUserId===u.id) ids.add(t.projectId);
  });
  state.projects.forEach(p=>{
    if(Array.isArray(p.taggedUserIds) && p.taggedUserIds.includes(u.id)) ids.add(p.id);
  });
  return Array.from(ids);
}
function visibleProjects(){
  const ids = accessibleProjectIds();
  return ids===null ? state.projects : state.projects.filter(p=>ids.includes(p.id));
}
function canAccessProject(projectId){
  const ids = accessibleProjectIds();
  return ids===null || ids.includes(projectId);
}
function isTaggedToProject(projectId){
  const u = currentUser();
  const p = state.projects.find(x=>x.id===projectId);
  if(!u || !p) return false;
  return Array.isArray(p.taggedUserIds) && p.taggedUserIds.includes(u.id);
}
// Admins and members can always see Active Assignments (members are limited to their
// own row there — see renderAssignments). Viewers only get it if an admin switched it on.
function canSeeAssignmentsPage(){
  const u = currentUser();
  if(!u) return false;
  if(u.role==='admin' || u.role==='member') return true;
  if(u.role==='viewer') return !!u.viewerCanSeeAssignments;
  return false;
}
// Once a task is closed, only admins can open/edit it again — everyone else loses
// access at that point, even if it was originally assigned to them.
function canEditTask(t){
  const cu = currentUser();
  if(isAdmin()) return true;
  if(!cu || cu.role==='viewer') return false;
  const isAssignedToMe = (t.assignedType==='user' && t.assignedId===cu.id) || (t.assignedType==='team' && t.assignedId===cu.teamId);
  return isAssignedToMe && t.status!=='closed';
}

function projectTasks(projectId){ return state.tasks.filter(t=>t.projectId===projectId); }

function taskDuration(t, useCurrent){
  const end = useCurrent ? effectiveEndDate(t) : t.originalEndDate;
  if(!t.startDate || !end) return 0;
  return Math.max(daysBetween(t.startDate, end), 0);
}

function buildChains(tasks){
  const roots = tasks.filter(t=>!t.predecessorId);
  return roots.map(root=>{
    const chain = [root];
    let cur = root;
    while(true){
      const next = tasks.find(t=>t.predecessorId===cur.id);
      if(!next) break;
      chain.push(next); cur = next;
    }
    return chain;
  });
}

function chainSum(chain, useCurrent){
  return chain.reduce((sum,t)=> sum + taskDuration(t, useCurrent), 0);
}

function projectTimeline(projectId){
  const tasks = projectTasks(projectId);
  if(tasks.length === 0){
    return { chains:[], originalTotal:0, currentTotal:0, delay:0, isRed:false, criticalIndex:-1, originalDeadline:null, currentDeadline:null };
  }
  const chains = buildChains(tasks);
  const origSums = chains.map(c=>chainSum(c,false));
  const curSums = chains.map(c=>chainSum(c,true));
  const originalTotal = Math.max(...origSums, 0);
  const currentTotal = Math.max(...curSums, 0);
  const delay = currentTotal - originalTotal;
  const isRed = tasks.some(t=>isTaskDelayed(t));
  const criticalIndex = curSums.indexOf(Math.max(...curSums));
  // The deadline shown on the dashboard should be the actual latest task date on record,
  // not an assumed project-start-plus-duration figure — this always matches what's on the tasks.
  const originalDeadline = tasks.reduce((max,t)=> (t.originalEndDate && (!max || t.originalEndDate > max)) ? t.originalEndDate : max, null);
  const currentDeadline = tasks.reduce((max,t)=> { const e = effectiveEndDate(t); return (e && (!max || e > max)) ? e : max; }, null);
  return { chains, origSums, curSums, originalTotal, currentTotal, delay, isRed, criticalIndex, originalDeadline, currentDeadline };
}

function taskStatusColor(t){
  if(isTaskDelayed(t)) return 'red';
  if(t.status==='closed') return 'green';
  return 'amber';
}

// A WhatsApp click-to-chat link — opens WhatsApp with a pre-filled message. If no
// phone is given, still opens WhatsApp letting the person pick who to send it to.
function waLink(phone, text){
  const digits = (phone||'').replace(/[^0-9]/g,'');
  const encodedText = text ? 'text='+encodeURIComponent(text) : '';
  return digits ? `https://wa.me/${digits}${encodedText?'?'+encodedText:''}` : `https://wa.me/${encodedText?'?'+encodedText:''}`;
}
function entityName(assignedType, assignedId){
  if(assignedType==='team'){ const tm = state.teams.find(x=>x.id===assignedId); return tm ? tm.name : 'Unassigned'; }
  const u = state.users.find(x=>x.id===assignedId);
  if(!u) return 'Unassigned';
  const tm = u.teamId ? state.teams.find(x=>x.id===u.teamId) : null;
  return tm ? `${u.username}-${tm.name}` : u.name;
}

function progressByEntity(projectId){
  const tasks = projectTasks(projectId);
  const map = {};
  tasks.forEach(t=>{
    const key = t.assignedType+':'+t.assignedId;
    if(!map[key]) map[key] = { key, type:t.assignedType, id:t.assignedId, name:entityName(t.assignedType,t.assignedId), total:0, closed:0, closedOnTime:0, closedDelayed:0, delayDays:0, red:false };
    map[key].total++;
    if(t.status==='closed'){
      map[key].closed++;
      if(isTaskDelayed(t)){
        map[key].closedDelayed++;
        map[key].delayDays += Math.max(daysBetween(t.originalEndDate, effectiveEndDate(t)), 0);
      } else {
        map[key].closedOnTime++;
      }
    }
    if(isTaskDelayed(t)) map[key].red = true;
  });
  return Object.values(map);
}

function taskDerivedStatus(t){
  const delayed = isTaskDelayed(t);
  if(t.status==='closed') return delayed ? 'closed-late' : 'closed-on-time';
  return delayed ? 'open-delayed' : 'open-on-track';
}

// The circuit-brain icon markup, shared between the idle bubble and the "thinking"
// state while waiting on a response. Full inline markup (not <use>) deliberately —
// referencing shared defs via <use> doesn't reliably carry CSS-driven color/animation
// across all browsers, confirmed the hard way while designing this.
// A small, focused markdown renderer for AI Agent messages — handles tables and
// bold text specifically, since those are what the AI actually produces for
// structured data like the employee directory. Not a full markdown implementation
// on purpose; just enough to make the two things that matter here readable.
function renderMarkdownLite(text){
  const escaped = (text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = escaped.split('\n');
  let html = '';
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    // A markdown table: a header row, a separator row (|---|---|), then data rows —
    // all lines starting and containing at least one pipe.
    if(line.trim().startsWith('|') && lines[i+1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      const headerCells = line.split('|').map(c=>c.trim()).filter((c,idx,arr)=> !(idx===0&&c==='') && !(idx===arr.length-1&&c===''));
      let tableRows = `<tr>${headerCells.map(c=>`<th>${applyInlineMd(c)}</th>`).join('')}</tr>`;
      i += 2; // skip header + separator
      while(i < lines.length && lines[i].trim().startsWith('|')){
        const cells = lines[i].split('|').map(c=>c.trim()).filter((c,idx,arr)=> !(idx===0&&c==='') && !(idx===arr.length-1&&c===''));
        tableRows += `<tr>${cells.map(c=>`<td>${applyInlineMd(c)}</td>`).join('')}</tr>`;
        i++;
      }
      html += `<table class="ai-msg-table">${tableRows}</table>`;
      continue;
    }
    html += (html ? '<br>' : '') + applyInlineMd(line);
    i++;
  }
  return html;
}
function applyInlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

// Loads this person's previously-saved AI Agent conversation, if any, so it's there
// the moment they open the panel rather than starting blank every time they log in.
// Fire-and-forget by design — never blocks or breaks login if it fails.
async function loadAiConversationHistory(userId){
  aiAgentMessages = []; // always start clean — never inherit whatever was here before, even if a fetch fails or finds nothing
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ai_conversations?user_id=eq.${userId}&select=messages`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer '+SUPABASE_ANON_KEY },
    });
    const rows = await res.json();
    if(Array.isArray(rows) && rows[0] && Array.isArray(rows[0].messages)){
      const cutoff = Date.now() - AI_HISTORY_RETENTION_DAYS*24*60*60*1000;
      // A message saved before timestamps existed has no 'at' field — treated as
      // past the cutoff, so it doesn't linger indefinitely just because it predates
      // this feature.
      aiAgentMessages = rows[0].messages.filter(m=> m.at && new Date(m.at).getTime() >= cutoff);
      renderAiAgentWidget();
    }
  }catch(e){ /* best-effort — a fresh, empty conversation is a fine fallback */ }
}

// Describes whatever the person is currently looking at, in a form both readable
// for a UI indicator and useful to hand to the backend as extra context — so asking
// "why is this delayed" while viewing a specific workstream doesn't require naming it.
function currentAiAgentContext(){
  if(ui.view==='project' && ui.projectId){
    const p = state.projects.find(x=>x.id===ui.projectId);

  }

  if(ui.view==='assignments') return { label: 'Viewing: Active Assignments' };
  if(ui.view==='reports') return { label: 'Viewing: Reports' };
  if(ui.view==='home') return { label: 'Viewing: Focus Area' };

async function submitAiAgentQuestion(){
  const input = document.getElementById('aiPanelInput');
  if(!input) return;
  const question = input.value.trim();
  if(!question || aiAgentThinking) return;
  const cu = currentUser();
  if(!cu) return;
  // Capture prior turns before adding this new question, so the backend can use them
  // for multi-turn memory — errors aren't real conversation turns, so they're excluded.
  const history = aiAgentMessages.filter(m=>m.role==='user' || m.role==='assistant');
  aiAgentMessages.push({role:'user', text:question, at: new Date().toISOString()});
  aiAgentThinking = true;
  renderAiAgentWidget();
  const newInput = document.getElementById('aiPanelInput');
  if(newInput) newInput.value = '';
  try{
    const res = await fetch(AI_AGENT_FUNCTION_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify({ question, userId: cu.id, history, pageContext: currentAiAgentContext() }),
    });
    const data = await res.json();
    if(data.error){
      aiAgentMessages.push({role:'error', text:data.error, at: new Date().toISOString()});
    } else {
      aiAgentMessages.push({role:'assistant', text:data.answer || 'No response received.', at: new Date().toISOString()});
    }
  } catch(e){
    aiAgentMessages.push({role:'error', text:'Could not reach the AI Agent — check your connection and try again. (If you are viewing this through a Claude preview link rather than your real published site, outbound calls like this are expected to fail there.)', at: new Date().toISOString()});
  }
  aiAgentThinking = false;
  renderAiAgentWidget();
}

// All descendant node IDs under a given node, recursively — used so that landing on a
// Heading found by name shows everything underneath it expanded, not just one level.
// Splits a query into individual words and checks that every one of them appears
// somewhere in the haystack, in any order, not necessarily adjacent — so "figma
// wallet" matches "...Figma...JCE Wallet Mobile App..." even though those two words
// aren't next to each other in the original text.
function queryTerms(query){
  return query.trim().toLowerCase().split(/\s+/).filter(Boolean);
}
function matchesAllTerms(haystack, terms){
  if(!terms.length) return false;
  const h = haystack.toLowerCase();
  return terms.every(term => h.includes(term));
}

function allDescendantNodeIds(nodeId){
  const ids = [];
  featureChildren(nodeId).forEach(child=>{
    ids.push(child.id);
    ids.push(...allDescendantNodeIds(child.id));
  });
  return ids;
}

// Full Workspace Search — covers everything that's genuinely text-based and within
// the searching user's own access: workstream names, task text, Repository/FAI/Policies
// content (full text for Text/Link, title-only for Image/Document/Video since their
// contents aren't extracted), workstream-level content, and Daily/Weekly Summaries.
function searchWorkspace(query){
  const terms = queryTerms(query);
  if(!terms.length) return [];
  const visibleProjIds = new Set(visibleProjects().map(p=>p.id));

  // Keyed by the exact displayed path — when a Heading's own name matches AND a
  // content item living directly inside it (with no title of its own) produces the
  // identical path, they're the same effective destination and should show once, not
  // twice. Whichever result actually has a destination to show (a URL) wins.
  const resultMap = new Map();
  function addResult(r){
    const existing = resultMap.get(r.label);
    if(!existing || (r.url && !existing.url)) resultMap.set(r.label, r);
  }

  visibleProjects().forEach(p=>{
    if(matchesAllTerms(p.name, terms)){
      addResult({type:'Workstream', label:p.name, go:()=>{ ui.projectId=p.id; ui.view='project'; render(); }});
    }
  });

  // Module / Heading / Sub Heading names themselves — landing on one expands
  // everything nested underneath it (its own content and every descendant), so
  // whatever the person was looking for is immediately visible.
  state.featureNodes.forEach(node=>{
    if(!canSeeNode(node.id)) return;
    if(!matchesAllTerms(node.name, terms)) return;
    const typeLabel = node.nodeType==='feature' ? 'Module' : node.nodeType==='heading' ? 'Heading' : 'Sub Heading';
    const pathStr = featureNodePath(node.id).map(n=>n.name).join('>');
    addResult({type:typeLabel, label:pathStr, go:()=>{
      ui.expandNodeIds = [node.id, ...allDescendantNodeIds(node.id)];
      if(node.systemView){ ui.view = node.systemView; }
      else { ui.view='feature'; ui.featureNodeId=node.id; }
      render();
    }});
  });

  state.tasks.forEach(t=>{
    if(!visibleProjIds.has(t.projectId)) return;
    const haystack = [t.title, t.description, t.reason, t.blockerReason].filter(Boolean).join(' ');
    if(matchesAllTerms(haystack, terms)){
      const proj = state.projects.find(p=>p.id===t.projectId);
      addResult({type:'Task', label:(t.title||'Untitled task')+(proj?'>'+proj.name:''), go:()=>{ ui.projectId=t.projectId; ui.view='project'; render(); openTaskDetailsModal(t.id); }});
    }
  });

  // Content items match on the combination of their own text AND the path they live
  // under — so a term like "figma" (only present in the ancestor Heading's name) can
  // combine with a term like "wallet" (only present in the item's own title).
  state.featureNodes.forEach(node=>{
    if(!canSeeNode(node.id)) return;
    const pathStr = featureNodePath(node.id).map(n=>n.name).join('>');
    (node.contentItems||[]).forEach(item=>{
      const haystack = [pathStr, item.title, item.fileName, item.type==='text'?item.text:'', item.type==='link'?item.url:''].filter(Boolean).join(' ');
      if(matchesAllTerms(haystack, terms)){
        const fullLabel = item.title ? `${pathStr}>${item.title}` : pathStr;
        const ancestorIds = featureNodePath(node.id).map(n=>n.id);
        addResult({type:'Content', label:fullLabel, url: (item.type==='link'?item.url:null), go:()=>{
          ui.expandNodeIds = ancestorIds;
          ui.view='feature'; ui.featureNodeId=node.id;
          render();
          openContentItemPreviewModal(node.id, item.id);
        }});
      }
    });
  });

  visibleProjects().forEach(p=>{
    (p.contentItems||[]).forEach(item=>{
      const haystack = [p.name, item.title, item.fileName, item.type==='text'?item.text:''].filter(Boolean).join(' ');
      if(matchesAllTerms(haystack, terms)){
        const fullLabel2 = item.title ? `Workstream>${p.name}>${item.title}` : `Workstream>${p.name}`;
        addResult({type:'Workstream content', label:fullLabel2, url:(item.type==='link'?item.url:null), go:()=>{ ui.projectId=p.id; ui.view='project'; render(); openProjectContentPreviewModal(p.id, item.id); }});
      }
    });
  });

  searchAllSummaries(query).forEach(r=>{
    const label = r.kind==='daily' ? `${r.workstream.title}>${fmtDate(r.date)} (daily summary)` : `${r.workstream.title}>week of ${fmtDate(r.weekStart)} (weekly summary)`;
    addResult({type:'Summary', label, go:()=>{
      if(r.kind==='daily') openSummaryPopup('daily', state.dailySummaries[r.date]);
      else openSummaryPopup('weekly', state.weeklySummaries[r.weekStart]);
    }});
  });

  return Array.from(resultMap.values());
}

function renderPortfolio(){
  const allProjects = visibleProjects();
  const today0 = todayISO();
  let summaries = allProjects.map(p=>{
    const tl = projectTimeline(p.id);
    const tasks = projectTasks(p.id);
    const closed = tasks.filter(t=>t.status==='closed').length;
    const pct = tasks.length ? Math.round(closed/tasks.length*100) : 0;
    const isClosedProject = tasks.length>0 && closed===tasks.length;
    const isFutureProject = p.startDate > today0;
    return { p, tl, tasks, closed, pct, isClosedProject, isFutureProject };
  });

  const filter = ui.portfolioFilter || 'open';
  const filtered = summaries.filter(s=>{
    if(filter==='all') return true;
    if(filter==='closed') return s.isClosedProject;
    if(filter==='future') return s.isFutureProject;
    return !s.isClosedProject && !s.isFutureProject; // 'open' — default
  });

  const onTrack = filtered.filter(s=>!s.tl.isRed).length;
  const delayed = filtered.filter(s=>s.tl.isRed).length;
  const tasksTracked = filtered.reduce((sum,s)=>sum+s.tasks.length, 0);

/* ============================== FEATURE TREE (Knowledge system) ============================== */

function featureChildren(parentId){
  return state.featureNodes.filter(n=>n.parentId===parentId).sort((a,b)=>(a.order||0)-(b.order||0));
}
function featureNode(id){ return state.featureNodes.find(n=>n.id===id); }
function featureNodePath(id){
  const path=[]; let cur=featureNode(id);
  while(cur){ path.unshift(cur); cur = cur.parentId ? featureNode(cur.parentId) : null; }
  return path;
}
// A node is explicitly granted if it's in this user's own access list.
function hasDirectNodeAccess(userId, nodeId){
  const arr = (state.userAccess && state.userAccess[userId]) || [];
  return arr.includes(nodeId);
}
// A node should be visible if it's directly granted, OR if something granted lives
// underneath it — otherwise a granted Sub Heading would be unreachable because its
// parent Module/Feature/Heading was never itself ticked.
function hasNodeAccessOrDescendant(userId, nodeId){
  if(hasDirectNodeAccess(userId, nodeId)) return true;
  return featureChildren(nodeId).some(child => hasNodeAccessOrDescendant(userId, child.id));
}
// The single check to use anywhere a node's visibility matters — admins always pass.
function canSeeNode(nodeId){
  if(isAdmin()) return true;
  const cu = currentUser();
  if(!cu) return false;
  // Summary module is granted at the module level only — Year and Month nodes
  // underneath it are never individually ticked; once someone has the module, they
  // see everything in it (filtered by their own workstream access, same as always).
  const path = featureNodePath(nodeId);
  if(path.some(n=>n.id==='feat_summary')){
    return hasDirectNodeAccess(cu.id, 'feat_summary');
  }
  return hasNodeAccessOrDescendant(cu.id, nodeId);
}
// Root Modules a non-admin can see at all — new Modules are invisible to everyone
// until explicitly granted, by construction (they simply won't be in anyone's list yet).
function rootFeatureNodesVisible(){
  const roots = state.featureNodes.filter(n=>n.parentId===null && n.id!=='feat_ai_agent').sort((a,b)=>(a.order||0)-(b.order||0));
  return roots.filter(n=>canSeeNode(n.id));
}
function nextOrderFor(parentId){
  const sibs = featureChildren(parentId);
  return sibs.length ? Math.max(...sibs.map(s=>s.order||0))+1 : 1;
}
function countDescendants(nodeId){
  let count=0;
  featureChildren(nodeId).forEach(k=>{ count += 1 + countDescendants(k.id); });
  return count;
}
function deleteNodeCascade(nodeId){
  featureChildren(nodeId).forEach(k=> deleteNodeCascade(k.id));
  state.featureNodes = state.featureNodes.filter(n=>n.id!==nodeId);
}

/* ============================== ATTENDANCE SHEET (special Heading view) ============================== */

const ATT_STATUS = { P:{label:'Present',color:'#1F8A47'}, L:{label:'Leave',color:'#B8791A'}, WFH:{label:'Work from home',color:'#3D74A8'}, NS:{label:'No show',color:'#B8362D'}, H:{label:'Holiday',color:'#7A4F96'}, CO:{label:'Comp off',color:'#347F77'} };

function attendanceKey(userId, date){ return userId+'|'+date; }
function getAttendance(userId, date){ return state.attendance[attendanceKey(userId,date)] || null; }

// For a task assigned to a specific person, summarizes any Leave/WFH days across its
// active date range — from start date through today if still open (so it keeps
// growing day by day while the task remains open), or through its actual close date
// if closed. Only Leave and WFH are considered; every other status is ignored.
// Consecutive days of the same status collapse into one range rather than listing
// each day separately.
// Who can see Leave/WFH badges on a workstream's Handoff Rail: admins always; anyone
// who actually has a task of their own in this specific workstream; and viewers who've
// been explicitly granted read-only access to this workstream, even without a task of
// their own there. Nobody else — general workstream visibility alone isn't enough.
function canSeeAttendanceBadges(projectId){
  if(isAdmin()) return true;
  const cu = currentUser();
  if(!cu) return false;
  const hasOwnTask = state.tasks.some(t=>t.projectId===projectId && (
    (t.assignedType==='user' && t.assignedId===cu.id) ||
    (t.assignedType==='team' && t.assignedId===cu.teamId)
  ));
  if(hasOwnTask) return true;
  if(cu.role==='viewer'){
    if(cu.viewerProjectIds==='all') return true;
    if(Array.isArray(cu.viewerProjectIds) && cu.viewerProjectIds.includes(projectId)) return true;
  }
  return false;
}

function taskAttendanceSummary(t){
  if(t.assignedType!=='user' || !t.assignedId || !t.startDate) return null;
  const rangeEnd = t.status==='closed' ? (t.closedDate||t.startDate) : todayISO();
  if(rangeEnd < t.startDate) return null;
  const days = [];
  let cur = t.startDate;
  while(cur <= rangeEnd){
    const status = getAttendance(t.assignedId, cur);
    if(status==='L' || status==='WFH') days.push({date:cur, status});
    cur = addDays(cur, 1);
  }
  if(!days.length) return null;
  // Group consecutive days sharing the same status into ranges
  const groups = [];
  days.forEach(d=>{
    const last = groups[groups.length-1];
    if(last && last.status===d.status && addDays(last.end,1)===d.date){
      last.end = d.date;
    } else {
      groups.push({status:d.status, start:d.date, end:d.date});
    }
  });
  const label = groups.map(g=>{
    const statusName = g.status==='L' ? 'Leave' : 'WFH';
    return g.start===g.end ? `${statusName} ${fmtDateOrdinal(g.start)}` : `${statusName} ${fmtDateOrdinal(g.start)} till ${fmtDateOrdinal(g.end)}`;
  }).join(', ');
  return { groups, label, hasLeave: groups.some(g=>g.status==='L'), hasWFH: groups.some(g=>g.status==='WFH') };
}
function setAttendanceValue(userId, date, status){
  const key = attendanceKey(userId,date);
  if(status) state.attendance[key] = status; else delete state.attendance[key];
}
// Always the current month plus the two before it — a rolling window, not dependent
// on whether data actually exists for those months yet.
function last3Months(){
  const [y,m] = todayISO().split('-').map(Number);
  const months = [];
  for(let i=0;i<3;i++){
    let mm=m-i, yy=y;
    while(mm<1){ mm+=12; yy--; }
    months.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return months;
}
function monthLabelLong(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
}

function renderAttendanceSheet(node){
  const months = last3Months();
  const monthKey = (ui.attendanceMonth && months.includes(ui.attendanceMonth)) ? ui.attendanceMonth : months[0];
  const [y,m] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const admin = isAdmin();
  const cu = currentUser();
  // Admins see the whole team; anyone else only ever sees their own attendance row.
  const rows = admin ? state.users.filter(u=>u.role!=='viewer') : (cu ? [cu] : []);

  const dayHeaders = Array.from({length:daysInMonth},(_,i)=>{
    const day=i+1;
    const dateISO = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return `<th class="att-daycol${isWeekendISO(dateISO)?' att-weekend-col':''}">${day}</th>`;
  }).join('');

  const bodyRows = rows.map(u=>{
    const cells = Array.from({length:daysInMonth},(_,i)=>{
      const day=i+1;
      const dateISO = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const weekend = isWeekendISO(dateISO);
      const rec = getAttendance(u.id, dateISO);
      let label, style='';
      if(weekend){
        label = (rec && ATT_STATUS[rec]) ? rec : 'WO';
        if(rec && ATT_STATUS[rec]) style = `background:${ATT_STATUS[rec].color};color:#fff;border-color:${ATT_STATUS[rec].color};font-weight:700;`;
      } else {
        label = rec || '';
        if(rec && ATT_STATUS[rec]) style = `background:${ATT_STATUS[rec].color};color:#fff;border-color:${ATT_STATUS[rec].color};font-weight:700;`;
      }
      const clickAttr = admin ? (weekend ? ` data-att-weekend="${u.id}|${dateISO}"` : ` data-att-weekday="${u.id}|${dateISO}"`) : '';
      const cls = `att-cell${weekend?' att-weekend':''}${admin?' att-clickable':''}`;
      return `<td class="${cls}" style="${style}"${clickAttr}>${label}</td>`;
    }).join('');
    return `<tr><td style="padding:8px 6px;width:70px;color:#000;font-family:var(--f-mono);font-size:11px;text-align:center;white-space:nowrap;">${u.employeeId||''}</td><td class="att-name">${u.name}</td>${cells}</tr>`;
  }).join('');

  const legend = Object.entries(ATT_STATUS).map(([code,v])=>
    `<span style="font-size:11px;color:var(--paper-dim);margin-right:14px;"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${v.color};margin-right:5px;"></span>${code} = ${v.label}</span>`
  ).join('') + `<span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--panel-raised);border:1px dashed var(--paper-faint);margin-right:5px;"></span>WO = Weekly off${admin?' — click to mark Present, click again to revert':''}</span>`;

  return `
    <div class="eyebrow">Heading</div>
    <h1 class="page-title" style="margin-bottom:4px;">${node.name}</h1>
    <div class="muted" style="font-size:15px;font-family:var(--f-display);margin-bottom:16px;">${monthLabelLong(monthKey)}</div>

    <div class="filters" style="margin-bottom:14px;">
      <select id="attMonthSelect">
        ${months.map(mk=>`<option value="${mk}" ${mk===monthKey?'selected':''}>${monthLabelLong(mk)}</option>`).join('')}
      </select>
    </div>

    <div style="margin-bottom:14px;">${legend}</div>

    <div class="att-wrap">
      <table class="att-table">
        <thead><tr><th style="padding:8px 6px;width:70px;font-family:var(--f-mono);font-size:11px;text-align:center;white-space:nowrap;">Employee ID</th><th class="att-name-col">Name</th>${dayHeaders}</tr></thead>
        <tbody>${bodyRows || `<tr><td colspan="${daysInMonth+2}" class="empty-state">No one to show yet.</td></tr>`}</tbody>
      </table>
    </div>
    ${!admin ? '<div class="footnote">Only admins can enter attendance.</div>' : ''}
  `;
}

  const sel = document.getElementById('attMonthSelect');
  if(sel) sel.addEventListener('change', ()=>{ ui.attendanceMonth = sel.value; render(); });

      setAttendanceValue(userId,date, next || null);
      persist(); render();
    });
  });

  document.querySelectorAll('[data-att-weekend]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [userId,date] = el.dataset.attWeekend.split('|');
      const cur = getAttendance(userId,date);

      } else {

        persist(); render();
      }
    });
  });
}

// For actions severe enough that a single click shouldn't be enough — requires typing

function openTypeToConfirmModal(title, message, phrase, onConfirm){

// "X yr Y mo" from a Date-of-Joining to today — purely for display.
function tenureLabel(doj){
  if(!doj) return '—';
  const start = new Date(doj+'T00:00:00');
  const now = new Date(todayISO()+'T00:00:00');
  if(isNaN(start.getTime()) || start > now) return '—';
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  if(now.getDate() < start.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  const parts = [];
  if(years>0) parts.push(`${years} yr`);
  parts.push(`${months} mo`);
  return parts.join(' ');
}
// A review is overdue once a full year has passed since the last appraisal date.
function isAppraisalOverdue(lastDate){
  if(!lastDate) return false;
  return todayISO() > addDays(lastDate, 365);
}
function fmtMoney(n){
  if(n===null || n===undefined || n==='') return '';
  return Number(n).toLocaleString('en-US');
}
