<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImproveID Workspace — Workstream Timeline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0D1316;
    --panel:#141B1F;
    --panel-raised:#1B2328;
    --panel-hi:#212A2F;
    --line:#2A353B;
    --line-soft:#1E2830;
    --paper:#EDE8DC;
    --paper-dim:#8F988F;
    --paper-faint:#5B6560;
    --green:#33A85C;
    --green-soft:#132A1C;
    --green-glow:rgba(51,168,92,.38);
    --red:#DD5147;
    --red-soft:#331A17;
    --red-glow:rgba(221,81,71,.4);
    --amber:#E0AC3F;
    --amber-soft:#2E2410;
    --f-display:'Barlow Condensed',sans-serif;
    --f-body:'Space Grotesk',sans-serif;
    --f-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--f-body);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(51,168,92,.05), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(221,81,71,.05), transparent 35%);
  }
  ::selection{background:var(--amber);color:var(--ink);}
  a{color:inherit;}
  button{font-family:var(--f-body);cursor:pointer;}
  input,select,textarea{font-family:var(--f-body);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }

  /* ---------- layout shell ---------- */
  #app{display:flex;min-height:100vh;}
  .navrail{
    width:76px;flex:0 0 76px;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    padding:18px 0;gap:6px;position:sticky;top:0;height:100vh;
  }
  .navrail .brand{
    width:38px;height:38px;border-radius:8px;
    background:conic-gradient(from 220deg, var(--green), var(--amber), var(--red), var(--green));
    margin-bottom:22px;position:relative;
  }
  .brand::after{content:"";position:absolute;inset:5px;background:var(--panel);border-radius:5px;}
  .navbtn{
    width:52px;height:52px;border-radius:10px;border:1px solid transparent;
    background:transparent;color:var(--paper-dim);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;font-family:var(--f-body);font-weight:600;transition:all .15s ease;
  }
  .navbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .navbtn:hover{color:var(--paper);background:var(--panel-raised);}
  .navbtn.active{color:var(--ink);background:var(--paper);}
  .navrail .spacer{flex:1;}
  .navbtn.logout{color:var(--red);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:1px solid var(--line);
    background:rgba(20,27,31,.6);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:5;
  }
  .crumb{font-family:var(--f-mono);font-size:12px;color:var(--paper-dim);letter-spacing:.03em;}
  .crumb b{color:var(--paper);font-weight:600;}
  .today-display{font-size:12px;font-weight:600;color:var(--amber);letter-spacing:.03em;padding:6px 14px;border:1px solid rgba(224,172,63,.4);background:var(--amber-soft);border-radius:14px;box-shadow:0 0 12px -4px rgba(224,172,63,.35);text-align:center;line-height:1.3;}
  .today-time{font-size:10px;font-weight:500;color:rgba(224,172,63,.75);letter-spacing:.06em;}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--paper-dim);}
  .who .avatar{
    width:28px;height:28px;border-radius:50%;background:var(--panel-hi);
    display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);
    font-size:11px;color:var(--paper);border:1px solid var(--line);
  }
  .content{padding:28px;max-width:1240px;width:100%;margin:0 auto;flex:1;}

  /* ---------- typography ---------- */
  h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.01em;}
  .eyebrow{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--paper-faint);margin:0 0 6px;
  }
  .page-title{font-size:38px;line-height:1.05;}
  .section-title{font-size:22px;margin-bottom:14px;}
  .muted{color:var(--paper-dim);}
  .mono{font-family:var(--f-mono);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel-raised);color:var(--paper);
    font-size:13px;font-weight:600;transition:all .15s ease;
  }
  .btn:hover{background:var(--panel-hi);border-color:var(--paper-faint);}
  .btn-primary{background:var(--paper);color:var(--ink);border-color:var(--paper);}
  .btn-primary:hover{background:#fff;}
  .btn-danger{background:var(--red-soft);color:var(--red);border-color:rgba(221,81,71,.35);}
  .btn-danger:hover{background:rgba(221,81,71,.22);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--paper-dim);}
  .btn-ghost:hover{color:var(--paper);background:var(--panel-raised);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- cards & grids ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .grid{display:grid;gap:16px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr;}}

  /* ---------- status pills / badges ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
    font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  }
  .pill-green{background:var(--green-soft);color:var(--green);}
  .pill-red{background:var(--red-soft);color:var(--red);}
  .pill-amber{background:var(--amber-soft);color:var(--amber);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .dot.pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .pill-blink{animation:pillBlink 1.6s ease-in-out infinite;}
  @keyframes pillBlink{0%,100%{opacity:1;}50%{opacity:.4;}}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
  .cal-dow{font-size:10px;color:var(--paper-faint);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px;}
  .cal-day{aspect-ratio:1;border-radius:6px;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);border:1px solid var(--line-soft);}
  .cal-day.blank{background:transparent;border:none;}
  .cal-day.weekend{border-style:dashed;}
  .cal-day.weekend:not(.closed):not(.current):not(.future){background:rgba(255,255,255,.025);color:var(--paper-faint);}
  .cal-day.closed{background:rgba(230,159,90,.22);color:#E6A560;border-color:rgba(230,159,90,.45);}
  .cal-day.current{background:rgba(232,214,107,.22);color:#E8D66B;border-color:rgba(232,214,107,.45);font-weight:700;}
  .cal-day.future{background:rgba(126,182,224,.2);color:#7EB6E0;border-color:rgba(126,182,224,.42);}
  .cal-day.free{background:rgba(143,214,158,.18);color:#8FD69E;border-color:rgba(143,214,158,.38);}
  .cal-day.admin-toggle{cursor:pointer;}
  .cal-day.admin-toggle:hover{outline:1px solid var(--paper-dim);outline-offset:1px;}

  /* ---------- portfolio cards ---------- */
  .proj-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
    cursor:pointer;transition:all .15s ease;position:relative;overflow:hidden;
  }
  .proj-card:hover{border-color:var(--paper-faint);transform:translateY(-2px);}
  .proj-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  }
  .proj-card.status-green::before{background:var(--green);box-shadow:0 0 14px var(--green-glow);}
  .proj-card.status-red::before{background:var(--red);box-shadow:0 0 14px var(--red-glow);}
  .proj-card .pname{font-family:var(--f-display);font-size:24px;margin:2px 0 12px;}
  .proj-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--paper-dim);margin-top:14px;}
  .bar-track{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:12px;}
  .bar-fill{height:100%;background:var(--green);border-radius:99px;}
  .bar-fill.red{background:var(--red);}

  /* ---------- hero ---------- */
  .hero{
    border-radius:16px;border:1px solid var(--line);background:var(--panel);
    padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    position:relative;overflow:hidden;flex-wrap:wrap;
  }
  .hero.status-red{border-color:rgba(221,81,71,.4);box-shadow:0 0 0 1px rgba(221,81,71,.12) inset, 0 18px 50px -24px var(--red-glow);}
  .hero.status-green{border-color:rgba(51,168,92,.35);box-shadow:0 0 0 1px rgba(51,168,92,.1) inset, 0 18px 50px -24px var(--green-glow);}
  .hero-metrics{display:flex;gap:36px;flex-wrap:wrap;}
  .metric .eyebrow{margin-bottom:8px;}
  .metric .val{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1;}
  .metric .val.red{color:var(--red);}
  .metric .val.green{color:var(--green);}
  .metric .sub{font-size:11px;color:var(--paper-faint);margin-top:6px;font-family:var(--f-mono);}

  /* ---------- handoff rail (signature element) ---------- */
  .rail-wrap{overflow-x:auto;padding-bottom:6px;}

  .chain-row{display:flex;align-items:center;gap:0;margin:22px 0;min-width:max-content;}
  .chain-label{
    width:150px;flex:0 0 150px;font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);
    padding-right:14px;text-align:right;line-height:1.4;
  }
  .chain-label .tag{display:block;color:var(--paper-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .chain-track{display:flex;align-items:center;}
  .rail-node{
    position:relative;border-radius:9px;border:1.5px solid var(--line);
    background:var(--panel-raised);padding:10px 14px;min-width:96px;max-width:190px;
    display:flex;flex-direction:column;gap:3px;
  }
  .rail-node .nt{font-size:12px;font-weight:600;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:162px;}
  .rail-node .nd{font-family:var(--f-mono);font-size:10px;color:var(--paper-dim);}
  .rail-node .nu{font-size:9.5px;color:var(--paper);line-height:1.3;margin-top:1px;}
  .rail-node.green{border-color:var(--green);box-shadow:0 0 0 1px rgba(51,168,92,.15) inset;}
  .rail-node.green .nd{color:var(--green);}
  .rail-node.red{border-color:var(--red);box-shadow:0 0 12px -2px var(--red-glow);}
  .rail-node.red .nd{color:var(--red);}
  .rail-node.amber{border-color:var(--amber);}
  .rail-node.amber .nd{color:var(--amber);}
  .rail-connector{width:26px;height:2px;background:var(--line);position:relative;flex:0 0 26px;}
  .rail-connector::after{
    content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);
    border:4px solid transparent;border-left-color:var(--line);
  }
  .chain-total{
    flex:0 0 auto;margin-left:14px;font-family:var(--f-mono);font-size:11px;color:var(--paper-faint);
    padding-left:14px;border-left:1px solid var(--line-soft);white-space:nowrap;
  }
  .chain-total b{color:var(--paper);font-size:13px;}
  .chain-row.critical .chain-label{color:var(--paper);}
  .chain-row.critical .chain-label .tag{color:var(--amber);}
  .chain-row.critical .chain-total b{color:var(--amber);}

  /* ---------- donut / gauges ---------- */
  .donut-big{
    width:168px;height:168px;border-radius:50%;position:relative;flex:0 0 168px;
  }
  .donut-big .hole{
    position:absolute;inset:16px;background:var(--panel);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .donut-big .hole .pct{font-family:var(--f-mono);font-size:28px;font-weight:700;}
  .donut-big .hole .lbl{font-size:10px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;flex:1;}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--panel-raised);border:1px solid var(--line-soft);}
  .gauge-ring{width:64px;height:64px;border-radius:50%;position:relative;}
  .gauge-ring .hole{position:absolute;inset:8px;background:var(--panel-raised);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:600;}
  .gauge .gname{font-size:12px;font-weight:600;text-align:center;}
  .gauge .gfrac{font-family:var(--f-mono);font-size:10px;color:var(--paper-dim);}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--paper-faint);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;
  }
  tbody td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover{background:var(--panel-raised);}
  .task-title{font-weight:600;}
  .task-title-link{cursor:pointer;width:fit-content;}
  .task-title-link:hover{text-decoration:underline;color:var(--paper);}
  .task-desc{color:var(--paper-dim);font-size:11px;margin-top:2px;max-width:280px;}
  .date-pair{font-family:var(--f-mono);font-size:11px;}
  .date-pair .orig{color:var(--paper-dim);}
  .date-pair .ext{color:var(--red);text-decoration:none;}
  .date-pair .strike{text-decoration:line-through;color:var(--paper-faint);}

  /* ---------- forms & modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,9,10,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px;
  }
  .modal h3{font-size:22px;margin-bottom:4px;}
  .modal .modal-sub{color:var(--paper-dim);font-size:12px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-faint);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:7px;
    padding:9px 11px;color:var(--paper);font-size:13px;
  }
  .field textarea{resize:vertical;min-height:64px;font-family:var(--f-body);}
  .field input:disabled{opacity:.5;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .hint{font-size:11px;color:var(--paper-faint);margin-top:4px;}
  .credential-box{
    background:var(--ink);border:1px dashed var(--paper-faint);border-radius:8px;padding:14px;
    font-family:var(--f-mono);font-size:13px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;
  }

  /* ---------- login ---------- */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;width:100%;}
  .login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;}
  .login-mark{
    width:44px;height:44px;border-radius:10px;
    background:conic-gradient(from 220deg, var(--green), var(--amber), var(--red), var(--green));
    margin-bottom:18px;position:relative;
  }
  .login-mark::after{content:"";position:absolute;inset:6px;background:var(--panel);border-radius:6px;}
  .login-title{font-family:var(--f-display);font-size:30px;margin-bottom:2px;}
  .login-error{color:var(--red);font-size:12px;margin-top:8px;font-family:var(--f-mono);min-height:14px;}
  .demo-creds{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--paper-faint);font-family:var(--f-mono);line-height:1.7;}
  .demo-creds b{color:var(--paper-dim);}

  /* ---------- admin tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 4px;margin-right:18px;background:none;border:none;color:var(--paper-dim);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--paper);border-bottom-color:var(--amber);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--paper-faint);}
  .empty-state .et{font-family:var(--f-display);font-size:20px;color:var(--paper-dim);margin-bottom:6px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters select{background:var(--panel-raised);border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:8px 10px;font-size:12px;font-family:var(--f-body);}

  .stat-strip{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;min-width:130px;}
  .stat-chip .n{font-family:var(--f-mono);font-size:24px;font-weight:700;}
  .stat-chip .l{font-size:10px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}

  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .lb-row:last-child{border-bottom:none;}
  .lb-name{flex:1;font-size:13px;font-weight:600;}
  .lb-bar{flex:2;height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;}
  .lb-bar span{display:block;height:100%;background:var(--red);}
  .lb-count{font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);width:60px;text-align:right;}

  .icon-btn{background:none;border:none;color:var(--paper-faint);padding:4px;border-radius:5px;}
  .icon-btn:hover{color:var(--paper);background:var(--panel-hi);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .userchip{display:flex;align-items:center;gap:8px;}
  .userchip .initials{width:26px;height:26px;border-radius:50%;background:var(--panel-hi);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;flex:0 0 26px;}
  .banner{
    display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid rgba(224,172,63,.3);
    color:var(--amber);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:18px;
  }
  .footnote{margin-top:36px;padding-top:16px;border-top:1px solid var(--line-soft);color:var(--paper-faint);font-size:11px;font-family:var(--f-mono);}
  .feature-box:hover{border-color:var(--paper-faint);}
  .heading-card{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:12px;}
  .heading-card:first-child{border-top:none;padding-top:0;margin-top:0;}
  .heading-name{font-family:var(--f-display);font-size:16px;font-weight:600;}
  .content-item{background:var(--panel-raised);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .ci-title{font-size:12px;font-weight:600;color:var(--paper);margin-bottom:3px;}
  .ci-text{font-size:13px;color:var(--paper-dim);line-height:1.6;}
  .ci-link{font-size:13px;color:var(--amber);text-decoration:none;}
  .ci-link:hover{text-decoration:underline;}
  .att-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;}
  .att-table{border-collapse:collapse;font-family:var(--f-mono);font-size:11px;}
  .att-table th, .att-table td{border:1px solid var(--line-soft);padding:0;text-align:center;}

// fetch() calls to a parent frame via postMessage, which uses the structured clone
// algorithm — and that algorithm can't clone a real Headers object. supabase-js
// builds its requests using Headers internally, so we hand it a fetch wrapper that
// flattens headers to a plain object first. Harmless on a normal, unsandboxed page
// (like the real hosted site) — it's only ever needed inside a sandboxed preview.
function sandboxSafeFetch(url, options){
  const opts = options ? {...options} : {};
  if(opts.headers){
    if(typeof Headers !== 'undefined' && opts.headers instanceof Headers){
      const plain = {};
      opts.headers.forEach((v,k)=>{ plain[k]=v; });
      opts.headers = plain;
    } else if(Array.isArray(opts.headers)){
      opts.headers = Object.fromEntries(opts.headers);
    }
  }
  return fetch(url, opts);
}

// visits the hosted site should see the same thing here, so Supabase takes priority.
const storageAdapter = supaClient ? {

    if(error) throw error;
    return data ? { key, value: data.value } : null;
  },
  set: async (key, value) => {
    const { error } = await supaClient.from('app_storage').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;

function runOnClickAndEnter(formId, btnId, handler){

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
// Always compute "today" in India Standard Time (UTC+5:30), regardless of the
// browser's own timezone — delay tracking should be consistent for everyone.
function todayISO(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  return new Date(Date.now() + IST_OFFSET_MS).toISOString().slice(0,10);
}
// Current time in IST, 24-hour HH:MM — purely for display, not used in any date math.
function nowTimeIST(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  const d = new Date(Date.now() + IST_OFFSET_MS);
  return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}
// A combined IST date+time stamp, e.g. "2026-07-20T22:03", for recording exactly
// when something was last touched (used by the task update-history chart).
function nowDateTimeIST(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  const d = new Date(Date.now() + IST_OFFSET_MS);
  const date = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  const time = `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
  return `${date}T${time}`;
}
function ordinalSuffix(n){
  if(n>3 && n<21) return 'th';
  switch(n%10){ case 1: return 'st'; case 2: return 'nd'; case 3: return 'rd'; default: return 'th'; }
}
// Formats a nowDateTimeIST() value as "22:03 20th Jul 2026".
function fmtDateTime(iso){
  if(!iso) return '';
  const [datePart, timePart] = iso.split('T');
  const d = new Date(datePart+'T00:00:00');
  const day = d.getDate();
  const month = d.toLocaleDateString('en-US',{month:'short'});
  return `${timePart} ${day}${ordinalSuffix(day)} ${month} ${d.getFullYear()}`;
}

}

// a task (save, extend, blocker, amend) so the update-history chart always has this.
function touchTask(t){

}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }
function isWeekendISO(iso){ const dow = new Date(iso+'T00:00:00').getDay(); return dow===0 || dow===6; }
// Inclusive day span between two dates, and how many of those days fall on a Sat/Sun —
// purely informational, doesn't feed into any delay or duration math.
function calendarVsWorkingDays(start, end){
  if(!start || !end || end < start) return null;
  let calendarDays = 0, weekendDays = 0;
  let cur = new Date(start+'T00:00:00');
  const endD = new Date(end+'T00:00:00');
  while(cur<=endD){
    calendarDays++;
    const dow = cur.getDay();
    if(dow===0||dow===6) weekendDays++;
    cur.setDate(cur.getDate()+1);
  }
  return { calendarDays, weekendDays, workingDays: calendarDays-weekendDays };
}
function dateRangeHint(start, end){
  const r = calendarVsWorkingDays(start, end);
  if(!r) return '';
  if(r.weekendDays===0) return `${r.calendarDays} calendar day${r.calendarDays===1?'':'s'} · no weekend days in range`;
  return `${r.calendarDays} calendar day${r.calendarDays===1?'':'s'} · ${r.workingDays} working day${r.workingDays===1?'':'s'} · includes ${r.weekendDays} weekend day${r.weekendDays===1?'':'s'}`;
}
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

// A task is delayed the moment either condition happens, and it stays delayed
// permanently after that — even once the task or the whole project is closed:
//  1) it was ever pushed back with the Extend Date option, or
//  2) today (IST) has passed its original agreed deadline while it's still open —
//     this is live, no button needed, and once it's happened it stays true even
//     after the task later closes (admins can always amend the record via "Amend timeline").
function isTaskDelayed(t){
  if(t.extended) return true;
  if(t.status==='closed'){
    return !!(t.closedDate && t.originalEndDate && t.closedDate > t.originalEndDate);
  }
  return !!(t.originalEndDate && todayISO() > t.originalEndDate);
}
// The date a task's current duration should be measured against: its agreed/extended
// end date, but if it's still open and that date has already passed, the gap keeps
// growing with each day (today, IST) until it's closed or extended — then it freezes.
function effectiveEndDate(t){
  if(!t.endDate) return t.endDate;
  if(t.status==='closed'){
    return (t.closedDate && t.closedDate > t.endDate) ? t.closedDate : t.endDate;
  }
  const today = todayISO();
  return (today > t.endDate) ? today : t.endDate;
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('storage timeout')), ms))
  ]);
}

function isValidState(s){
  return s && Array.isArray(s.users) && Array.isArray(s.teams) && Array.isArray(s.projects) && Array.isArray(s.tasks) && s.users.length > 0;
}
// A rough measure of "how much real content is in here" — used to decide whether a
// legacy storage bucket has more genuine data than what's currently active, without
// needing to understand exactly what changed.
function stateRichness(s){
  if(!isValidState(s)) return -1;
  return s.users.length + s.teams.length + s.projects.length + s.tasks.length;
}
// Data saved before the Feature/Knowledge tree existed won't have featureNodes at
// all — add the six root Features in that case so nothing breaks and nothing already
// saved is touched.
function normalizeState(s){
  if(!s) return s;
  if(!Array.isArray(s.featureNodes) || s.featureNodes.length===0){
    s.featureNodes = [
      {id:'feat_workstream', name:'Workstream', nodeType:'feature', parentId:null, systemView:'portfolio', order:1, contentItems:[], description:''},

      {id:'feat_hr', name:'HR', nodeType:'feature', parentId:null, systemView:null, order:6, contentItems:[], description:''},
    ];
  } else {
    // migrate feature nodes already saved by an earlier version of this app
    s.featureNodes.forEach(n=>{
      if(typeof n.description !== 'string') n.description = '';
      if(n.id==='feat_kr' && n.name==='Knowledge Repository') n.name = 'Repository'; // rename, but only if never customized
      // Any Heading literally named "Attendance" automatically becomes the attendance
      // sheet view when opened — no extra setup step needed.
      if(n.nodeType==='heading' && (n.name||'').trim().toLowerCase()==='attendance' && !n.specialView){
        n.specialView = 'attendance';
      }
    });
  }
  if(!s.attendance || typeof s.attendance !== 'object' || Array.isArray(s.attendance)) s.attendance = {};
  return s;
}

// Manually triggered from Admin — lets the admin explicitly check the old "personal"
// storage bucket for data stranded there by an earlier version of this app, and choose
// whether to load it in. This never runs silently; the admin always sees the comparison
// and decides.
async function checkForLegacyData(){
  const btn = document.getElementById('recoverLegacyBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
  let legacyState = null;
  try{
    const legacyRes = await withTimeout(window.storage.get(STORAGE_KEY, false), 5000);
    legacyState = legacyRes && legacyRes.value ? JSON.parse(legacyRes.value) : null;
  }catch(e){ legacyState = null; }
  if(btn){ btn.disabled = false; btn.textContent = 'Check for legacy data'; }

  if(!isValidState(legacyState)){
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-backdrop" data-backdrop>

          <h3>No legacy data found</h3>

    return;
  }

  const currentCounts = `${state.users.length} users, ${state.teams.length} teams, ${state.projects.length} workstreams, ${state.tasks.length} tasks`;
  const legacyCounts = `${legacyState.users.length} users, ${legacyState.teams.length} teams, ${legacyState.projects.length} workstreams, ${legacyState.tasks.length} tasks`;
  document.getElementById('modalRoot').innerHTML = `

          <button type="button" class="btn btn-danger" id="loadLegacyBtn">Load legacy data instead</button>
        </div>
      </div>
    </div>`;
  bindModalClose();
  document.getElementById('loadLegacyBtn').addEventListener('click', async ()=>{
    state = normalizeState(legacyState);
    await persist();
    closeModal();
    render();
  });
}

// Best-effort background reconciliation with any previously saved data. Runs after the first
// render, with a short budget, and only touches the UI if the person hasn't started using it yet.
async function reconcileWithStorage(){
  if(!HAS_STORAGE) return;
  const stillOnFreshLogin = ()=> ui.view==='login' && !session.userId;

  try{
    const [stateRes, sessionRes] = await withTimeout(Promise.all([
      storageAdapter.get(STORAGE_KEY).catch(()=>null),
      (sessionAdapter ? sessionAdapter.get(SESSION_KEY) : Promise.resolve(null)).catch(()=>null),
    ]), 4000);

    let parsedState = stateRes && stateRes.value ? JSON.parse(stateRes.value) : null;
    const parsedSession = sessionRes && sessionRes.value ? JSON.parse(sessionRes.value) : null;

    // One-time migration: earlier versions of this app saved the shared app data under
    // Claude's "personal" storage bucket instead of "shared". Compare RICHNESS, not just
    // validity — a brief window existed where the new shared bucket could have been
    // seeded with fresh demo data before this migration existed, which would otherwise
    // permanently mask real legacy data sitting in the old bucket.
    if(HAS_CLAUDE_STORAGE && !supaClient){
      try{
        const legacyRes = await withTimeout(window.storage.get(STORAGE_KEY, false), 4000);
        const legacyState = legacyRes && legacyRes.value ? JSON.parse(legacyRes.value) : null;
        if(isValidState(legacyState) && stateRichness(legacyState) > stateRichness(parsedState)){
          parsedState = legacyState;
        }
      }catch(e){ /* no legacy data to recover, that's fine */ }
    }

    if(isValidState(parsedState) && stillOnFreshLogin()){
      state = normalizeState(parsedState);
      if(parsedSession && typeof parsedSession==='object' && parsedSession.userId && state.users.find(u=>u.id===parsedSession.userId)){
        session = parsedSession;
        ui.view = 'home';
      }
      render();
      persist(); // ensures a migrated legacy state gets written into the shared bucket right away
    } else if(!isValidState(parsedState)){
      // nothing usable saved yet — persist our fresh seed so future loads (and other people) have something to find
      persist();
    }
  }catch(e){
    // storage never responded in time or errored — the seed data already on screen keeps working
  }
}

function describeError(e){
  if(!e) return 'unknown error';
  if(typeof e === 'string') return e;
  const parts = [e.message, e.details, e.hint, e.code].filter(Boolean);
  return parts.length ? parts.join(' | ') : JSON.stringify(e);
}

async function persist(){
  if(!HAS_STORAGE) return;
  try{
    await storageAdapter.set(STORAGE_KEY, JSON.stringify(state));
    if(ui.saveError){ ui.saveError = null; render(); }
  }
  catch(e){
    const msg = describeError(e);
    console.error('save failed:', msg);
    ui.saveError = msg;
    render();
  }
}
async function persistSession(){
  if(!sessionAdapter) return;
  try{ await sessionAdapter.set(SESSION_KEY, JSON.stringify(session)); }
  catch(e){ /* ignore */ }
}

/* ============================== DERIVED LOGIC ============================== */

function currentUser(){ return state.users.find(u=>u.id===session.userId) || null; }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

// null = unrestricted (sees everything). Otherwise an array of project ids the
// current user is allowed to see: admins see everything, viewers see whatever
// the admin assigned them ('all' or a specific list), and regular members only
// see projects where they (or their team) actually have a task assigned.
function accessibleProjectIds(){
  const u = currentUser();
  if(!u) return [];
  if(u.role==='admin') return null;
  if(u.role==='viewer'){
    if(u.viewerProjectIds==='all') return null;
    return Array.isArray(u.viewerProjectIds) ? u.viewerProjectIds : [];
  }
  const ids = new Set();
  state.tasks.forEach(t=>{
    if((t.assignedType==='user' && t.assignedId===u.id) || (t.assignedType==='team' && t.assignedId===u.teamId)){
      ids.add(t.projectId);
    }
  });
  return Array.from(ids);
}
function visibleProjects(){
  const ids = accessibleProjectIds();
  return ids===null ? state.projects : state.projects.filter(p=>ids.includes(p.id));
}
function canAccessProject(projectId){
  const ids = accessibleProjectIds();
  return ids===null || ids.includes(projectId);
}
// Admins and members can always see Active Assignments (members are limited to their
// own row there — see renderAssignments). Viewers only get it if an admin switched it on.
function canSeeAssignmentsPage(){
  const u = currentUser();
  if(!u) return false;
  if(u.role==='admin' || u.role==='member') return true;
  if(u.role==='viewer') return !!u.viewerCanSeeAssignments;
  return false;
}
// Once a task is closed, only admins can open/edit it again — everyone else loses
// access at that point, even if it was originally assigned to them.
function canEditTask(t){
  const cu = currentUser();
  if(isAdmin()) return true;
  if(!cu || cu.role==='viewer') return false;
  const isAssignedToMe = (t.assignedType==='user' && t.assignedId===cu.id) || (t.assignedType==='team' && t.assignedId===cu.teamId);
  return isAssignedToMe && t.status!=='closed';
}

function projectTasks(projectId){ return state.tasks.filter(t=>t.projectId===projectId); }

function taskDuration(t, useCurrent){
  const end = useCurrent ? effectiveEndDate(t) : t.originalEndDate;
  if(!t.startDate || !end) return 0;
  return Math.max(daysBetween(t.startDate, end), 0);
}

function buildChains(tasks){
  const roots = tasks.filter(t=>!t.predecessorId);
  return roots.map(root=>{
    const chain = [root];
    let cur = root;
    while(true){
      const next = tasks.find(t=>t.predecessorId===cur.id);
      if(!next) break;
      chain.push(next); cur = next;
    }
    return chain;
  });
}

function chainSum(chain, useCurrent){
  return chain.reduce((sum,t)=> sum + taskDuration(t, useCurrent), 0);
}

function projectTimeline(projectId){
  const tasks = projectTasks(projectId);
  if(tasks.length === 0){
    return { chains:[], originalTotal:0, currentTotal:0, delay:0, isRed:false, criticalIndex:-1, originalDeadline:null, currentDeadline:null };
  }
  const chains = buildChains(tasks);
  const origSums = chains.map(c=>chainSum(c,false));
  const curSums = chains.map(c=>chainSum(c,true));
  const originalTotal = Math.max(...origSums, 0);
  const currentTotal = Math.max(...curSums, 0);
  const delay = currentTotal - originalTotal;
  const isRed = tasks.some(t=>isTaskDelayed(t));
  const criticalIndex = curSums.indexOf(Math.max(...curSums));
  // The deadline shown on the dashboard should be the actual latest task date on record,
  // not an assumed project-start-plus-duration figure — this always matches what's on the tasks.
  const originalDeadline = tasks.reduce((max,t)=> (t.originalEndDate && (!max || t.originalEndDate > max)) ? t.originalEndDate : max, null);
  const currentDeadline = tasks.reduce((max,t)=> { const e = effectiveEndDate(t); return (e && (!max || e > max)) ? e : max; }, null);
  return { chains, origSums, curSums, originalTotal, currentTotal, delay, isRed, criticalIndex, originalDeadline, currentDeadline };
}

function taskStatusColor(t){
  if(isTaskDelayed(t)) return 'red';
  if(t.status==='closed') return 'green';
  return 'amber';
}

function entityName(assignedType, assignedId){
  if(assignedType==='team'){ const tm = state.teams.find(x=>x.id===assignedId); return tm ? tm.name : 'Unassigned'; }
  const u = state.users.find(x=>x.id===assignedId);
  if(!u) return 'Unassigned';
  const tm = u.teamId ? state.teams.find(x=>x.id===u.teamId) : null;
  return tm ? `${u.username}-${tm.name}` : u.name;
}

function progressByEntity(projectId){
  const tasks = projectTasks(projectId);
  const map = {};
  tasks.forEach(t=>{
    const key = t.assignedType+':'+t.assignedId;
    if(!map[key]) map[key] = { key, type:t.assignedType, id:t.assignedId, name:entityName(t.assignedType,t.assignedId), total:0, closed:0, closedOnTime:0, closedDelayed:0, delayDays:0, red:false };
    map[key].total++;
    if(t.status==='closed'){
      map[key].closed++;
      if(isTaskDelayed(t)){
        map[key].closedDelayed++;
        map[key].delayDays += Math.max(daysBetween(t.originalEndDate, effectiveEndDate(t)), 0);
      } else {
        map[key].closedOnTime++;
      }
    }
    if(isTaskDelayed(t)) map[key].red = true;
  });
  return Object.values(map);
}

function taskDerivedStatus(t){
  const delayed = isTaskDelayed(t);
  if(t.status==='closed') return delayed ? 'closed-late' : 'closed-on-time';
  return delayed ? 'open-delayed' : 'open-on-track';
}

function bindLogin(){
  // belt-and-suspenders: if state is missing/corrupt by the time the login page shows, repair it now
  if(!state || !Array.isArray(state.users) || state.users.length === 0){
    state = seedState();
    persist();
  }
  const resetBtn = document.getElementById('resetDataBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      state = seedState();
      session = { userId:null };
      try{ await persist(); }catch(e){}
      try{ await persistSession(); }catch(e){}
      ui.loginError = 'App data reset to the demo defaults.';
      render();
    });
  }
  runOnClickAndEnter('loginForm', 'loginSubmitBtn', ()=>{
    try{
      const uEl = document.getElementById('loginUser');
      const pEl = document.getElementById('loginPass');
      const u = uEl.value.trim().toLowerCase();
      const p = pEl.value.trim();
      if(!u || !p){ ui.loginError = 'Enter both a username and a password.'; render(); return; }
      if(!state || !Array.isArray(state.users) || state.users.length===0){ state = seedState(); persist(); }
      const match = state.users.find(x=> x.username.toLowerCase()===u && x.password===p);
      if(!match){ ui.loginError = 'Username or password not recognized. Check for extra spaces or try one of the demo logins below.'; render(); return; }
      session.userId = match.id; persistSession();
      ui.loginError='';
      ui.view='home';
      render();
    }catch(err){
      ui.loginError = 'Sign-in hit an unexpected error: ' + (err && err.message ? err.message : err);
      render();
    }
  });
}

function renderPortfolio(){
  const allProjects = visibleProjects();
  const today0 = todayISO();
  let summaries = allProjects.map(p=>{
    const tl = projectTimeline(p.id);
    const tasks = projectTasks(p.id);
    const closed = tasks.filter(t=>t.status==='closed').length;
    const pct = tasks.length ? Math.round(closed/tasks.length*100) : 0;
    const isClosedProject = tasks.length>0 && closed===tasks.length;
    const isFutureProject = p.startDate > today0;
    return { p, tl, tasks, closed, pct, isClosedProject, isFutureProject };
  });

  const filter = ui.portfolioFilter || 'open';
  const filtered = summaries.filter(s=>{
    if(filter==='all') return true;
    if(filter==='closed') return s.isClosedProject;
    if(filter==='future') return s.isFutureProject;
    return !s.isClosedProject && !s.isFutureProject; // 'open' — default
  });

  const onTrack = filtered.filter(s=>!s.tl.isRed).length;
  const delayed = filtered.filter(s=>s.tl.isRed).length;
  const tasksTracked = filtered.reduce((sum,s)=>sum+s.tasks.length, 0);

  const cards = filtered.map(s=>{
    const status = s.tl.isRed ? 'red':'green';
    const deadline = s.tl.originalDeadline || addDays(s.p.startDate, s.tl.originalTotal);
    const blockingTeams = blockedTeamsForProject(s.p.id);

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
        ${pill(status, status==='red' ? `Delayed ${s.tl.delay}d${delayNames.length ? ' by '+delayNames.join(', ') : ''}` : 'On agreed timeline')}
        ${blockingTeams.length ? `<span class="pill pill-amber pill-blink" title="${blockedDetailForProject(s.p.id).replace(/"/g,'&quot;')}"><span class="dot"></span>Blocked by ${blockingTeams.join(', ')}</span>` : ''}

  }).join('');

  return `
    <div class="eyebrow">Workstream</div>
    <h1 class="page-title" style="margin-bottom:16px;">All workstreams, one board</h1>

    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${filtered.length}</div><div class="l">Workstreams</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--green);">${onTrack}</div><div class="l">On agreed timeline</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--red);">${delayed}</div><div class="l">Delayed</div></div>
      <div class="stat-chip"><div class="n">${tasksTracked}</div><div class="l">Tasks tracked</div></div>

    <div class="filters">
      <select id="portfolioFilter">
        <option value="open" ${filter==='open'?'selected':''}>Open workstreams</option>
        <option value="closed" ${filter==='closed'?'selected':''}>Closed workstreams</option>
        <option value="future" ${filter==='future'?'selected':''}>Future workstreams</option>

    <div class="grid g3">
      ${cards || `<div class="empty-state"><div class="et">No workstreams to show</div>${allProjects.length ? 'Try a different filter.' : 'Create one from Admin.'}</div>`}
    </div>
    ${isAdmin() ? `<div style="margin-top:22px;"><button class="btn btn-primary" data-nav="admin">+ New workstream</button></div>` : ''}

}

/* ============================== FEATURE TREE (Knowledge system) ============================== */

function featureChildren(parentId){
  return state.featureNodes.filter(n=>n.parentId===parentId).sort((a,b)=>(a.order||0)-(b.order||0));
}
function featureNode(id){ return state.featureNodes.find(n=>n.id===id); }
function featureNodePath(id){
  const path=[]; let cur=featureNode(id);
  while(cur){ path.unshift(cur); cur = cur.parentId ? featureNode(cur.parentId) : null; }
  return path;
}
// Access control for the tree is deferred (per plan) — everyone logged in sees all
// root Features for now. This is the one place that will change once access rules exist.
function rootFeatureNodesVisible(){
  return state.featureNodes.filter(n=>n.parentId===null).sort((a,b)=>(a.order||0)-(b.order||0));
}
function nextOrderFor(parentId){
  const sibs = featureChildren(parentId);
  return sibs.length ? Math.max(...sibs.map(s=>s.order||0))+1 : 1;
}
function countDescendants(nodeId){
  let count=0;
  featureChildren(nodeId).forEach(k=>{ count += 1 + countDescendants(k.id); });
  return count;
}
function deleteNodeCascade(nodeId){
  featureChildren(nodeId).forEach(k=> deleteNodeCascade(k.id));
  state.featureNodes = state.featureNodes.filter(n=>n.id!==nodeId);
}

/* ============================== ATTENDANCE SHEET (special Heading view) ============================== */

const ATT_STATUS = { P:{label:'Present',color:'#33A85C'}, L:{label:'Leave',color:'#E0AC3F'}, WFH:{label:'Work from home',color:'#7EB6E0'}, NS:{label:'No show',color:'#D9534F'} };

function attendanceKey(userId, date){ return userId+'|'+date; }
function getAttendance(userId, date){ return state.attendance[attendanceKey(userId,date)] || null; }
function setAttendanceValue(userId, date, status){
  const key = attendanceKey(userId,date);
  if(status) state.attendance[key] = status; else delete state.attendance[key];
}
// Always the current month plus the two before it — a rolling window, not dependent
// on whether data actually exists for those months yet.
function last3Months(){
  const [y,m] = todayISO().split('-').map(Number);
  const months = [];
  for(let i=0;i<3;i++){
    let mm=m-i, yy=y;
    while(mm<1){ mm+=12; yy--; }
    months.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return months;
}
function monthLabelLong(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
}

function renderAttendanceSheet(node){
  const months = last3Months();
  const monthKey = (ui.attendanceMonth && months.includes(ui.attendanceMonth)) ? ui.attendanceMonth : months[0];
  const [y,m] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const admin = isAdmin();
  // Who shows up as a row — everyone but Viewers for now; which specific users belong
  // here will become configurable once role-based access to this heading is designed.
  const rows = state.users.filter(u=>u.role!=='viewer');

  const dayHeaders = Array.from({length:daysInMonth},(_,i)=>{
    const day=i+1;
    const dateISO = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return `<th class="att-daycol${isWeekendISO(dateISO)?' att-weekend-col':''}">${day}</th>`;
  }).join('');

  const bodyRows = rows.map(u=>{
    const cells = Array.from({length:daysInMonth},(_,i)=>{
      const day=i+1;
      const dateISO = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const weekend = isWeekendISO(dateISO);
      const rec = getAttendance(u.id, dateISO);
      let label, style='';
      if(weekend){
        label = rec==='P' ? 'P' : 'WO';
        if(rec==='P') style = `background:${ATT_STATUS.P.color}22;color:${ATT_STATUS.P.color};border-color:${ATT_STATUS.P.color};`;
      } else {
        label = rec || '';
        if(rec && ATT_STATUS[rec]) style = `background:${ATT_STATUS[rec].color}22;color:${ATT_STATUS[rec].color};border-color:${ATT_STATUS[rec].color};`;
      }
      const clickAttr = admin ? (weekend ? ` data-att-weekend="${u.id}|${dateISO}"` : ` data-att-weekday="${u.id}|${dateISO}"`) : '';
      const cls = `att-cell${weekend?' att-weekend':''}${admin?' att-clickable':''}`;
      return `<td class="${cls}" style="${style}"${clickAttr}>${label}</td>`;
    }).join('');
    return `<tr><td class="att-name">${u.name}</td>${cells}</tr>`;
  }).join('');

  const legend = Object.entries(ATT_STATUS).map(([code,v])=>
    `<span style="font-size:11px;color:var(--paper-dim);margin-right:14px;"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${v.color};margin-right:5px;"></span>${code} = ${v.label}</span>`
  ).join('') + `<span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--panel-raised);border:1px dashed var(--paper-faint);margin-right:5px;"></span>WO = Weekly off${admin?' — click to mark Present, click again to revert':''}</span>`;

  return `
    <div class="eyebrow">Heading</div>
    <h1 class="page-title" style="margin-bottom:4px;">${node.name}</h1>
    <div class="muted" style="font-size:15px;font-family:var(--f-display);margin-bottom:16px;">${monthLabelLong(monthKey)}</div>

    <div class="filters" style="margin-bottom:14px;">
      <select id="attMonthSelect">
        ${months.map(mk=>`<option value="${mk}" ${mk===monthKey?'selected':''}>${monthLabelLong(mk)}</option>`).join('')}
      </select>
    </div>

    <div style="margin-bottom:14px;">${legend}</div>

    <div class="att-wrap">
      <table class="att-table">
        <thead><tr><th class="att-name-col">Name</th>${dayHeaders}</tr></thead>
        <tbody>${bodyRows || `<tr><td colspan="${daysInMonth+1}" class="empty-state">No one to show yet.</td></tr>`}</tbody>
      </table>
    </div>
    ${!admin ? '<div class="footnote">Only admins can enter attendance.</div>' : ''}
  `;
}

function bindAttendanceSheet(){
  const sel = document.getElementById('attMonthSelect');
  if(sel) sel.addEventListener('change', ()=>{ ui.attendanceMonth = sel.value; render(); });

  document.querySelectorAll('[data-att-weekday]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [userId,date] = el.dataset.attWeekday.split('|');
      const cur = getAttendance(userId,date);
      const cycle = ['','P','L','WFH','NS'];
      const next = cycle[(cycle.indexOf(cur||'')+1) % cycle.length];
      setAttendanceValue(userId,date, next || null);
      persist(); render();
    });
  });

  document.querySelectorAll('[data-att-weekend]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [userId,date] = el.dataset.attWeekend.split('|');
      const cur = getAttendance(userId,date);
      if(cur==='P'){
        openRevertAttendanceConfirm(date, ()=>{ setAttendanceValue(userId,date,null); persist(); render(); });
      } else {
        setAttendanceValue(userId,date,'P');
        persist(); render();
      }
    });
  });
}

  if(it.type==='image') return `<div class="content-item">${it.title?`<div class="ci-title">${it.title}</div>`:''}<img src="${it.url}" style="max-width:100%;border-radius:8px;margin-top:4px;" alt="${it.title||''}"></div>`;

  return '';

          <button class="btn btn-sm btn-danger" data-delete-node="${h.id}">Delete</button>
        </div>` : ''}
      </div>
      <div style="margin-top:8px;">${itemsHtml || '<div class="muted" style="font-size:12px;">No content yet.</div>'}</div>

function renderFeatureNode(){
  const node = featureNode(ui.featureNodeId);
  if(!node) return `<div class="empty-state"><div class="et">Not found</div></div>`;

  if(node.nodeType==='heading' && node.specialView==='attendance'){
    return renderAttendanceSheet(node);
  }

  if(node.nodeType==='heading' || node.nodeType==='subheading'){
    return `
      <div class="eyebrow">${node.nodeType==='heading'?'Heading':'Sub Heading'}</div>
      <h1 class="page-title" style="margin-bottom:20px;">${node.name}</h1>
      <div class="card">${renderHeadingCard(node, 0)}</div>
    `;
  }

  const children = featureChildren(node.id);
  const subFeatures = children.filter(c=>c.nodeType==='feature'||c.nodeType==='subfeature');
  const headings = children.filter(c=>c.nodeType==='heading');

  const subFeatureBoxes = subFeatures.map(sf=>{
    const cnt = featureChildren(sf.id).length;
    const subtitle = sf.description ? sf.description : (cnt ? cnt+' item'+(cnt===1?'':'s') : 'No description yet');
    return `
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div data-open-feature="${sf.id}" style="cursor:pointer;flex:1;">
          <div style="font-family:var(--f-display);font-size:18px;font-weight:600;">${sf.name}</div>
          <div class="muted" style="font-size:12px;">${subtitle}</div>
        </div>
        ${isAdmin() ? `<div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-ghost" data-edit-feature-desc="${sf.id}" title="Rename or add a description">✎</button>
          <button class="btn btn-sm btn-danger" data-delete-node="${sf.id}">Delete</button>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');

  const headingCards = headings.map(h=>`<div class="card" style="margin-bottom:14px;">${renderHeadingCard(h,0)}</div>`).join('');

  return `
    <div class="eyebrow">${node.parentId ? 'Feature' : 'Module'}</div>
    <h1 class="page-title" style="margin-bottom:20px;">${node.name}</h1>
    ${isAdmin() ? `<button class="btn btn-primary btn-sm" style="margin-bottom:20px;" data-add-node="${node.id}">+ Add Feature or Heading</button>` : ''}
    ${subFeatureBoxes}
    ${headingCards}
    ${(!subFeatures.length && !headings.length) ? `<div class="empty-state"><div class="et">Nothing here yet</div>${isAdmin() ? 'Use the button above to add a Feature or Heading.' : ''}</div>` : ''}
  `;
}

              <option value="image">Image (link to an image)</option>
              <option value="document">Document (link to a hosted file)</option>
            </select>
          </div>
          <div class="field"><label>Title (optional)</label><input id="ciTitle" placeholder="A short label for this item"></div>
          <div class="field" id="ciTextField"><label>Text</label><textarea id="ciText" placeholder="Write it here..."></textarea></div>
          <div class="field" id="ciUrlField" style="display:none;"><label>URL</label><input id="ciUrl" placeholder="https://..."></div>
          <div class="hint">Documents and images are stored as links (e.g. a Google Drive or SharePoint link) rather than direct uploads for now.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="ciSubmitBtn" class="btn btn-primary">Add content</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  const typeSel = document.getElementById('ciType');
  const textField = document.getElementById('ciTextField');
  const urlField = document.getElementById('ciUrlField');
  const updateFields = ()=>{
    const isText = typeSel.value==='text';
    textField.style.display = isText ? '' : 'none';
    urlField.style.display = isText ? 'none' : '';
  };
  typeSel.addEventListener('change', updateFields);
  updateFields();
  runOnClickAndEnter('contentForm','ciSubmitBtn', ()=>{
    const type = typeSel.value;
    const title = document.getElementById('ciTitle').value.trim();
    const h = featureNode(headingId);
    if(!h) return;
    if(!Array.isArray(h.contentItems)) h.contentItems = [];
    if(type==='text'){
      const text = document.getElementById('ciText').value.trim();
      if(!text) return;
      h.contentItems.push({id:uid('ci'), type, title, text});
    } else {
      const url = document.getElementById('ciUrl').value.trim();
      if(!url) return;
      h.contentItems.push({id:uid('ci'), type, title, url});
    }
    persist(); closeModal(); render();
  });
}

function openDeleteNodeConfirm(nodeId){

  document.getElementById('modalRoot').innerHTML = `

        <div class="modal-actions">

/* ============================== PROJECT DASHBOARD ============================== */

function renderProject(){
  const p = state.projects.find(x=>x.id===ui.projectId);
  if(!p) return `<div class="empty-state"><div class="et">Workstream not found</div></div>`;
  if(!canAccessProject(p.id)) return `<div class="empty-state"><div class="et">You don't have access to this workstream</div>Ask an admin to add you to it.</div>`;
  const tl = projectTimeline(p.id);
  const tasks = projectTasks(p.id);
  const closed = tasks.filter(t=>t.status==='closed').length;
  const overallPct = tasks.length ? Math.round(closed/tasks.length*100) : 0;
  const status = tl.isRed ? 'red' : 'green';
  const deadline = tl.originalDeadline || addDays(p.startDate, tl.originalTotal);
  const lastClosedDate = (tasks.length>0 && closed===tasks.length) ? tasks.reduce((max,t)=> (t.closedDate && (!max || t.closedDate > max)) ? t.closedDate : max, null) : null;

  const railRows = tl.chains.map((chain, idx)=>{
    const isCritical = idx === tl.criticalIndex && tl.chains.length>1;
    const nodes = chain.map((t,i)=>{
      const color = t.status==='closed' ? 'green' : 'red';
      const dur = taskDuration(t, true);
      const lu = t.lastUpdated;
      const luText = lu ? `Updated by ${lu.byName} at ${fmtDateTime(lu.at)}` : 'Not yet updated';
      return `
        ${i>0 ? '<div class="rail-connector"></div>' : ''}
        <div class="rail-node ${color}" data-task-node="${t.id}" style="cursor:pointer;">
          <span class="nt">${t.title || 'Untitled task'}</span>
          <span class="nd">${entityName(t.assignedType,t.assignedId)} · ${dur}d</span>
          <span class="nu">${luText}</span>
        </div>`;
    }).join('');
    return `
      <div class="chain-row ${isCritical?'critical':''}">
        <div class="chain-label">Chain ${idx+1}${isCritical?'<span class="tag">Critical path</span>':''}</div>
        <div class="chain-track">${nodes}</div>
        <div class="chain-total">total <b>${tl.curSums[idx]}d</b>${tl.curSums[idx]!==tl.origSums[idx] ? ` <span style="color:var(--red)">(was ${tl.origSums[idx]}d)</span>`:''}</div>
      </div>`;
  }).join('');

  const entities = progressByEntity(p.id);
  const gauges = entities.map(e=>{
    const pct = e.total ? Math.round(e.closed/e.total*100) : 0;
    const colorVar = e.red ? '--red' : '--green';
    let fracText;
    if(e.closed===0){
      fracText = `${e.closed}/${e.total} closed`;
    } else if(e.closedDelayed===0){
      fracText = `${e.closed}/${e.total} closed on time`;
    } else if(e.closedOnTime===0){
      fracText = `${e.closed}/${e.total} closed ${e.delayDays}d delay`;
    } else {
      fracText = `${e.closedOnTime}/${e.total} closed on time & ${e.closedDelayed}/${e.total} closed ${e.delayDays}d delay`;
    }
    return `
      <div class="gauge">
        <div class="gauge-ring" style="background:${donutGradient(pct, colorVar)}">
          <div class="hole">${pct}%</div>
        </div>
        <div class="gname">${e.name}</div>
        <div class="gfrac">${fracText}</div>
      </div>`;
  }).join('');

  const taskRows = tasks.map((t,i)=>{
    const color = taskStatusColor(t);
    const canEdit = canEditTask(t);
    const blockedTeamName = t.blockedByTeamId ? ((state.teams.find(tm=>tm.id===t.blockedByTeamId)||{}).name || 'Unknown team') : null;
    return `
    <tr>
      <td class="mono" style="color:var(--paper);">${i+1}.</td>
      <td>
        <div class="task-title task-title-link" data-view-task="${t.id}">${t.title || '<span class="muted">Untitled task</span>'}</div>
        ${t.description ? `<div class="task-desc">${t.description}</div>` : '<div class="task-desc">No description yet</div>'}
        ${blockedTeamName ? `<div style="margin-top:6px;">${pill('amber', 'Blocked by '+blockedTeamName, entityName(t.assignedType,t.assignedId)+': '+(t.blockerReason||'no reason given'))}</div>` : ''}
        ${t.weekendWork ? `<div style="margin-top:6px;">${pill('amber', 'Includes weekend work')}</div>` : ''}
      </td>
      <td>${entityName(t.assignedType,t.assignedId)}</td>
      <td class="date-pair">
        ${fmtDate(t.startDate)} →
        ${t.extended
          ? `<span class="strike">${fmtDate(t.originalEndDate)}</span> <span class="ext">${fmtDate(t.endDate)}</span>`
          : (isTaskDelayed(t) ? `<span class="ext">${fmtDate(t.endDate)}</span>` : fmtDate(t.endDate))}
        ${t.status==='closed' && t.closedDate ? `<div class="orig" style="margin-top:4px;">Closed ${fmtDate(t.closedDate)}</div>` : ''}
      </td>
      <td>${pill(color, color==='green' ? (t.status==='closed'?'Closed on time':'On track') : color==='red' ? (t.extended?'Extended':(t.status==='closed'?'Closed late':'Overdue')) : 'Open')}</td>
      <td>
        <div class="row-actions">
          ${canEdit ? `<button class="btn btn-sm" data-edit-task="${t.id}">Edit</button>` : ''}
          ${canEdit && t.status!=='closed' ? `<button class="btn btn-sm btn-danger" data-extend-task="${t.id}">Extend date</button>` : ''}
          ${canEdit && t.status!=='closed' ? (blockedTeamName
              ? `<button class="btn btn-sm" data-clear-blocker="${t.id}" style="background:var(--amber-soft);color:var(--amber);border-color:rgba(224,172,63,.35);">Clear blocker</button>`
              : `<button class="btn btn-sm" data-set-blocker="${t.id}">Blocker</button>`) : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  const blockingTeams = blockedTeamsForProject(p.id);
  const delayNames = status==='red' ? delayResponsibleNames(p.id) : [];
  const switcherOptions = visibleProjects();

  return `
    <div class="filters" style="margin-bottom:16px;">
      <select id="workstreamSwitcher">
        ${switcherOptions.map(sp=>`<option value="${sp.id}" ${sp.id===p.id?'selected':''}>${sp.name}</option>`).join('')}
      </select>
    </div>
    <div class="hero status-${status}">
      <div>
        <div class="eyebrow">Workstream</div>
        <h1 class="page-title">${p.name}</h1>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          ${pill(status, status==='red' ? `Delayed ${tl.delay}d${delayNames.length ? ' by '+delayNames.join(', ') : ''}` : 'On agreed timeline')}
          ${blockingTeams.length ? `<span class="pill pill-amber pill-blink" title="${blockedDetailForProject(p.id).replace(/"/g,'&quot;')}"><span class="dot"></span>Blocked by ${blockingTeams.join(', ')}</span>` : ''}
        </div>
      </div>
      <div class="hero-metrics">
        <div class="metric"><div class="eyebrow">Start date</div><div class="val" style="font-size:20px;">${fmtDate(p.startDate)}</div></div>
        <div class="metric"><div class="eyebrow">Total days agreed</div><div class="val">${tl.originalTotal}</div><div class="sub">${tasks.length} tasks combined</div></div>
        <div class="metric"><div class="eyebrow">Deadline</div><div class="val" style="font-size:20px;">${fmtDate(deadline)}</div><div class="sub">${lastClosedDate ? 'Closed on '+fmtDate(lastClosedDate) : ''}</div></div>
        <div class="metric"><div class="eyebrow">Delay</div><div class="val ${tl.delay>0?'red':'green'}">${tl.delay>0 ? '-'+tl.delay : '0'}</div><div class="sub">days vs. original agreement</div></div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;display:flex;gap:20px;align-items:center;">
      <div class="donut-big" style="background:${donutGradient(overallPct,'--green')}">
        <div class="hole"><div class="pct">${overallPct}%</div><div class="lbl">Complete</div></div>
      </div>
      <div>
        <div class="section-title" style="margin-bottom:4px;">Overall progress</div>
        <div class="muted" style="font-size:12px;">${closed} of ${tasks.length} tasks closed across the project.</div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="section-title">By Individual &amp; Team</div>
      <div class="gauge-grid">${gauges || '<div class="empty-state">Nothing assigned yet.</div>'}</div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="section-title">Handoff rail</div>
      <div class="muted" style="font-size:12px;margin-bottom:4px;">Every chain of dependent tasks, combined into one timeline. Parallel chains run at once — the longest one sets the project length. Each node also shows who last touched that task, and when. Green means the task is closed; red means it's still open.</div>
      <div class="rail-wrap">${railRows || '<div class="empty-state">No tasks yet.</div>'}</div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="section-title" style="margin-bottom:0;">Tasks</div>
        <div style="display:flex;gap:8px;">
          ${isAdmin() ? `<button class="btn btn-sm" data-add-task>+ Add blank task</button>` : ''}
          <button class="btn btn-sm btn-ghost" data-view-report>Open in reports</button>
        </div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Task</th><th>Assigned</th><th>Timeline</th><th>Status</th><th></th></tr></thead>
        <tbody>${taskRows || `<tr><td colspan="6" class="empty-state">No tasks in this project.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function bindProject(){
  const switcher = document.getElementById('workstreamSwitcher');
  if(switcher) switcher.addEventListener('change', ()=>{ ui.projectId = switcher.value; render(); });
  document.querySelectorAll('[data-edit-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.editTask;
      const t = state.tasks.find(x=>x.id===id);
      if(t && !canEditTask(t)) return; // closed tasks (or tasks not yours) can't be reopened either
      openTaskModal(id);
    });
  });
  document.querySelectorAll('[data-task-node],[data-view-task]').forEach(el=>{
    el.addEventListener('click', ()=>{ openTaskDetailsModal(el.dataset.taskNode || el.dataset.viewTask); });
  });
  document.querySelectorAll('[data-extend-task]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openExtendModal(el.dataset.extendTask); });
  });
  document.querySelectorAll('[data-set-blocker]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openBlockerModal(el.dataset.setBlocker); });
  });
  document.querySelectorAll('[data-clear-blocker]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const t = state.tasks.find(x=>x.id===el.dataset.clearBlocker);
      if(t){ t.blockedByTeamId = null; t.blockerReason = null; touchTask(t); persist(); render(); }
    });
  });
  const addBtn = document.querySelector('[data-add-task]');
  if(addBtn) addBtn.addEventListener('click', ()=> openBlankTaskModal(ui.projectId));
  const rep = document.querySelector('[data-view-report]');
  if(rep) rep.addEventListener('click', ()=>{ ui.reportFilters = {project:ui.projectId, team:'', user:'', status:''}; ui.view='reports'; render(); });
}

function openBlockerModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Flag a blocker</h3>
        <div class="modal-sub">${t.title} — mark which team this task is waiting on.</div>
        <form id="blockerForm">
          <div class="field"><label>Blocked by team</label>
            <select id="bkTeam">${state.teams.map(tm=>`<option value="${tm.id}">${tm.name}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Why is it blocked?</label><textarea id="bkReason" placeholder="What's needed from them before this can move?" required></textarea></div>
          <div class="hint">Everyone viewing this project will see a flashing "Blocked" indicator until this is cleared — hovering over it shows this reason.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="bkSubmitBtn" class="btn btn-danger">Mark as blocked</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  runOnClickAndEnter('blockerForm', 'bkSubmitBtn', ()=>{
    const teamId = document.getElementById('bkTeam').value;
    const reason = document.getElementById('bkReason').value.trim();
    if(!teamId || !reason) return;
    t.blockedByTeamId = teamId;
    t.blockerReason = reason;
    touchTask(t);
    persist(); closeModal(); render();
  });
}

/* ============================== TASK MODALS ============================== */

function assigneeOptions(selectedType, selectedId){
  return state.users.filter(u=>u.role==='member').map(u=>{
    const tm = u.teamId ? state.teams.find(x=>x.id===u.teamId) : null;
    const label = tm ? `${u.name} — ${tm.name}` : `${u.name} (no team)`;
    return `<option value="user:${u.id}" ${selectedType==='user'&&selectedId===u.id?'selected':''}>${label}</option>`;
  }).join('');
}

function predecessorOptions(projectId, excludeId, selected){
  const tasks = projectTasks(projectId).filter(t=>t.id!==excludeId);
  const opts = tasks.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${t.title||'Untitled task'}</option>`).join('');
  return `<option value="">None — runs in parallel from project start</option>` + opts;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openBlankTaskModal(projectId){

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="btSubmitBtn" class="btn btn-primary">Create task</button>
