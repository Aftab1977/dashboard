/* ============================== PROJECT DASHBOARD ============================== */

function renderProject(){
  const p = state.projects.find(x=>x.id===ui.projectId);
  if(!p) return `<div class="empty-state"><div class="et">Workstream not found</div></div>`;
  if(!canAccessProject(p.id)) return `<div class="empty-state"><div class="et">You don't have access to this workstream</div>Ask an admin to add you to it.</div>`;
  const tl = projectTimeline(p.id);
  const tasks = projectTasks(p.id);
  const closed = tasks.filter(t=>t.status==='closed').length;
  const overallPct = tasks.length ? Math.round(closed/tasks.length*100) : 0;
  const status = tl.isRed ? 'red' : 'green';
  const deadline = tl.originalDeadline || addDays(p.startDate, tl.originalTotal);
  const lastClosedDate = (tasks.length>0 && closed===tasks.length) ? tasks.reduce((max,t)=> (t.closedDate && (!max || t.closedDate > max)) ? t.closedDate : max, null) : null;

  const canSeeAttBadges = canSeeAttendanceBadges(p.id);
  const railRows = tl.chains.map((chain, idx)=>{
    const isCritical = idx === tl.criticalIndex && tl.chains.length>1;
    const nodes = chain.map((t,i)=>{
      const color = t.status==='closed' ? 'green' : 'red';
      const dur = taskDuration(t, true);
      const durLabel = t.deadlineDisabled ? 'no deadline' : `${dur}d`;
      const lu = t.lastUpdated;
      const luText = lu ? `Updated by ${lu.byName} at ${fmtDateTime(lu.at)}` : 'Not yet updated';
      const attSummary = canSeeAttBadges ? taskAttendanceSummary(t) : null;
      const attBadge = attSummary ? `<span class="rail-att-badge" title="${entityName(t.assignedType,t.assignedId)} (${attSummary.label.replace(/"/g,'&quot;')})">${attSummary.hasWFH ? '🏠' : ''}${attSummary.hasLeave ? '🌴' : ''}</span>` : '';
      return `
        ${i>0 ? '<div class="rail-connector"></div>' : ''}
        <div class="rail-node ${color}" data-task-node="${t.id}" style="cursor:pointer;">          ${attBadge}
          <span class="nt">${t.title || 'Untitled task'}</span>
          <span class="nd">${entityName(t.assignedType,t.assignedId)} · ${durLabel}</span>
          <span class="nu">${luText}</span>
        </div>`;
    }).join('');
    return `
      <div class="chain-row ${isCritical?'critical':''}">
        <div class="chain-label">Chain ${idx+1}${isCritical?'<span class="tag">Critical path</span>':''}</div>
        <div class="chain-track">${nodes}</div>
        <div class="chain-total">total <b>${tl.curSums[idx]}d</b>${tl.curSums[idx]!==tl.origSums[idx] ? ` <span style="color:var(--red)">(was ${tl.origSums[idx]}d)</span>`:''}</div>
      </div>`;
  }).join('');

  const entities = progressByEntity(p.id);
  const gauges = entities.map(e=>{
    const pct = e.total ? Math.round(e.closed/e.total*100) : 0;
    const colorVar = e.red ? '--red' : '--green';
    let fracText;
    if(e.closed===0){
      fracText = `${e.closed}/${e.total} closed`;
    } else if(e.closedDelayed===0){
      fracText = `${e.closed}/${e.total} closed on time`;
    } else if(e.closedOnTime===0){
      fracText = `${e.closed}/${e.total} closed ${e.delayDays}d delay`;
    } else {
      fracText = `${e.closedOnTime}/${e.total} closed on time & ${e.closedDelayed}/${e.total} closed ${e.delayDays}d delay`;
    }
    return `
      <div class="gauge">
        <div class="gauge-ring" style="background:${donutGradient(pct, colorVar)}">
          <div class="hole">${pct}%</div>
        </div>
        <div class="gname">${e.name}</div>
        <div class="gfrac">${fracText}</div>
      </div>`;
  }).join('');

  const taskRows = tasks.map((t,i)=>{
    const color = taskStatusColor(t);
    const canEdit = canEditTask(t);
    const blockedTeamName = t.blockedByTeamId ? (t.blockedByUserId ? entityName('user', t.blockedByUserId) : ((state.teams.find(tm=>tm.id===t.blockedByTeamId)||{}).name || 'Unknown team')) : null;
    return `
    <tr>
      <td class="mono" style="color:var(--paper);">${i+1}.</td>
      <td>
        <div class="task-title task-title-link" data-view-task="${t.id}">${t.title || '<span class="muted">Untitled task</span>'}</div>
        ${t.description ? `<div class="task-desc">${t.description}</div>` : '<div class="task-desc">No description yet</div>'}
        ${blockedTeamName ? `<div style="margin-top:6px;">${pill('blocker', 'Blocked by '+blockedTeamName, entityName(t.assignedType,t.assignedId)+': '+(t.blockerReason||'no reason given'))}</div>` : ''}
        ${t.weekendWork ? `<div style="margin-top:6px;">${pill('amber', 'Includes weekend work')}</div>` : ''}
      </td>
      <td>${entityName(t.assignedType,t.assignedId)}</td>
      <td class="date-pair">
        ${t.deadlineDisabled
          ? `${fmtDate(t.startDate)} <span class="muted" style="font-size:11px;">— no deadline</span>`
          : `${fmtDate(t.startDate)} →
        ${t.extended
          ? `<span class="strike">${fmtDate(t.originalEndDate)}</span> <span class="ext">${fmtDate(t.endDate)}</span>`
          : (isTaskDelayed(t) ? `<span class="ext">${fmtDate(t.endDate)}</span>` : fmtDate(t.endDate))}`}
        ${t.status==='closed' && t.closedDate ? `<div class="orig" style="margin-top:4px;">Closed ${fmtDate(t.closedDate)}</div>` : ''}
      </td>
      <td>${pill(color, color==='green' ? (t.status==='closed'?'Closed on time':'On track') : color==='red' ? (t.extended?'Extended':(t.status==='closed'?'Closed late':'Overdue')) : 'Open')}</td>
      <td>
        <div class="row-actions">
          ${canEdit ? `<button class="btn btn-sm" data-edit-task="${t.id}">Edit</button>` : ''}
          ${canEdit && t.status!=='closed' && !t.deadlineDisabled ? `<button class="btn btn-sm btn-danger" data-extend-task="${t.id}">Extend date</button>` : ''}
          ${canEdit && t.status!=='closed' ? (blockedTeamName
              ? `<button class="btn btn-sm" data-clear-blocker="${t.id}" style="background:var(--blocker-soft);color:var(--blocker);border-color:var(--blocker-border);">Clear blocker</button>`
              : `<button class="btn btn-sm" data-set-blocker="${t.id}">Blocker</button>`) : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  const blockingTeams = blockedTeamsForProject(p.id);
  const delayNames = status==='red' ? delayResponsibleNames(p.id) : [];
  const switcherOptions = visibleProjects();

  return `
    <div class="filters" style="margin-bottom:16px;">
      <select id="workstreamSwitcher">
        ${switcherOptions.map(sp=>`<option value="${sp.id}" ${sp.id===p.id?'selected':''}>${sp.name}</option>`).join('')}
      </select>
    </div>
    <div class="hero status-${status}">
      <div>
        <div class="eyebrow">Workstream</div>
        <h1 class="page-title" data-open-workstream-info="${p.id}" style="cursor:pointer;">${p.name}</h1>
        ${p.description ? `<div class="muted" style="font-size:13px;margin-top:4px;max-width:640px;">${p.description}</div>` : ''}
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          ${pill(status, status==='red' ? `Delayed ${tl.delay}d${delayNames.length ? ' by '+delayNames.join(', ') : ''}` : 'On agreed timeline')}
          ${blockingTeams.length ? `<span class="pill pill-blocker pill-blink" title="${blockedDetailForProject(p.id).replace(/"/g,'&quot;')}"><span class="dot"></span>Blocked by ${blockingTeams.join(', ')}</span>` : ''}
        </div>
      </div>
      <div class="hero-metrics">
        <div class="metric"><div class="eyebrow">Start date</div><div class="val" style="font-size:20px;">${fmtDate(p.startDate)}</div></div>
        <div class="metric"><div class="eyebrow">Total days agreed</div><div class="val">${tl.originalTotal}</div><div class="sub">${tasks.length} tasks combined</div></div>
        <div class="metric"><div class="eyebrow">Deadline</div><div class="val" style="font-size:20px;">${fmtDate(deadline)}</div><div class="sub">${lastClosedDate ? 'Closed on '+fmtDate(lastClosedDate) : ''}</div></div>
        <div class="metric"><div class="eyebrow">Delay</div><div class="val ${tl.delay>0?'red':'green'}">${tl.delay>0 ? '-'+tl.delay : '0'}</div><div class="sub">days vs. original agreement</div></div>
      </div>
    </div>

    ${(()=>{
      const cu = currentUser();
      const myTeam = cu && cu.teamId ? state.teams.find(t=>t.id===cu.teamId) : null;
      const points = (myTeam && Array.isArray(myTeam.checklist)) ? myTeam.checklist : [];
      if(!myTeam || points.length===0) return '';
      return `
    <div class="card" style="margin-top:20px;">
      <div class="section-title" style="margin-bottom:4px;font-size:20px;font-weight:800;">${myTeam.name} Checklist</div>
      <div class="muted" style="font-size:12px;margin-bottom:12px;">Keep these in mind while working on tasks in this workstream — built from lessons learned before.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;">
        ${points.map(pt=>`<div style="font-size:15px;font-weight:600;color:var(--paper);display:flex;gap:8px;align-items:flex-start;"><span style="color:var(--amber);">✓</span><span>${pt.text}</span></div>`).join('')}
      </div>
    </div>`;
    })()}

    <div class="card" style="margin-top:20px;display:flex;gap:20px;align-items:center;">
      <div class="donut-big" style="background:${donutGradient(overallPct,'--green')}">
        <div class="hole"><div class="pct">${overallPct}%</div><div class="lbl">Complete</div></div>
      </div>
      <div>
        <div class="section-title" style="margin-bottom:4px;">Overall progress</div>
        <div class="muted" style="font-size:12px;">${closed} of ${tasks.length} tasks closed across the project.</div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="section-title">By Individual &amp; Team</div>
      <div class="gauge-grid">${gauges || '<div class="empty-state">Nothing assigned yet.</div>'}</div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="section-title">Handoff rail</div>
      <div class="muted" style="font-size:12px;margin-bottom:4px;">Every chain of dependent tasks, combined into one timeline. Parallel chains run at once — the longest one sets the project length. Each node also shows who last touched that task, and when. Green means the task is closed; red means it's still open.</div>
      <div class="rail-wrap">${railRows || '<div class="empty-state">No tasks yet.</div>'}</div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="section-title" style="margin-bottom:0;">Tasks</div>
        <div style="display:flex;gap:8px;">
          ${(isAdmin() || isTaggedToProject(p.id)) ? `<button class="btn btn-sm" data-add-task>+ Add blank task</button>` : ''}
          <button class="btn btn-sm btn-ghost" data-view-report>Open in reports</button>
        </div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Task</th><th>Assigned</th><th>Timeline</th><th>Status</th><th></th></tr></thead>
        <tbody>${taskRows || `<tr><td colspan="6" class="empty-state">No tasks in this project.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function bindProject(){
  const switcher = document.getElementById('workstreamSwitcher');
  if(switcher) switcher.addEventListener('change', ()=>{ ui.projectId = switcher.value; render(); });
  const wsInfo = document.querySelector('[data-open-workstream-info]');
  if(wsInfo) wsInfo.addEventListener('click', ()=> openWorkstreamInfoModal(wsInfo.dataset.openWorkstreamInfo));
  document.querySelectorAll('[data-edit-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.editTask;
      const t = state.tasks.find(x=>x.id===id);
      if(t && !canEditTask(t)) return; // closed tasks (or tasks not yours) can't be reopened either
      openTaskModal(id);
    });
  });
  document.querySelectorAll('[data-task-node],[data-view-task]').forEach(el=>{
    el.addEventListener('click', ()=>{ openTaskDetailsModal(el.dataset.taskNode || el.dataset.viewTask); });
  });
  document.querySelectorAll('[data-extend-task]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openExtendModal(el.dataset.extendTask); });
  });
  document.querySelectorAll('[data-set-blocker]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openBlockerModal(el.dataset.setBlocker); });
  });
  document.querySelectorAll('[data-clear-blocker]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const t = state.tasks.find(x=>x.id===el.dataset.clearBlocker);
      if(t){ t.blockedByTeamId = null; t.blockedByUserId = null; t.blockerReason = null; touchTask(t); persist(); render(); }
    });
  });
  const addBtn = document.querySelector('[data-add-task]');
  if(addBtn) addBtn.addEventListener('click', ()=> openBlankTaskModal(ui.projectId));
  const rep = document.querySelector('[data-view-report]');
  if(rep) rep.addEventListener('click', ()=>{ ui.reportFilters = {project:ui.projectId, team:'', user:'', status:''}; ui.view='reports'; render(); });
}

function openBlockerModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const candidates = state.users.filter(u=>u.role!=='viewer' && u.id!==t.assignedId);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Flag a blocker</h3>
        <div class="modal-sub">${t.title} — tag the specific person this task is waiting on.</div>
        <form id="blockerForm">
          <div class="field"><label>Blocked by</label>
            <select id="bkUser">${candidates.map(u=>`<option value="${u.id}">${entityName('user',u.id)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Why is it blocked?</label><textarea id="bkReason" placeholder="What's needed from them before this can move?" required></textarea></div>
          <div class="hint">Everyone viewing this project will see a flashing "Blocked" indicator until this is cleared, and the person you tag will see a notice on their Focus Area page.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="bkSubmitBtn" class="btn btn-danger">Mark as blocked</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  runOnClickAndEnter('blockerForm', 'bkSubmitBtn', ()=>{
    const userId = document.getElementById('bkUser').value;
    const reason = document.getElementById('bkReason').value.trim();
    if(!userId || !reason) return;
    const blockingUser = state.users.find(u=>u.id===userId);
    t.blockedByUserId = userId;
    t.blockedByTeamId = blockingUser ? blockingUser.teamId : null;
    t.blockerReason = reason;
    touchTask(t);
    persist(); closeModal(); render();
  });
}

/* ============================== TASK MODALS ============================== */

function assigneeOptions(selectedType, selectedId){
  return state.users.filter(u=>u.role==='member' || u.role==='hod').map(u=>{
    const tm = u.teamId ? state.teams.find(x=>x.id===u.teamId) : null;
    const label = tm ? `${u.name} — ${tm.name}` : `${u.name} (no team)`;
    return `<option value="user:${u.id}" ${selectedType==='user'&&selectedId===u.id?'selected':''}>${label}</option>`;
  }).join('');
}

function predecessorOptions(projectId, excludeId, selected){
  const tasks = projectTasks(projectId).filter(t=>t.id!==excludeId);
  const opts = tasks.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${t.title||'Untitled task'}</option>`).join('');
  return `<option value="">None — runs in parallel from project start</option>` + opts;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openBlankTaskModal(projectId){
  const admin = isAdmin();
  const cu = currentUser();
  if(!admin && !isTaggedToProject(projectId)) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>New task</h3>
        <div class="modal-sub">${admin ? 'Create a blank slot and assign it — the team fills in the rest.' : 'This task will be assigned to you — fill in the rest once it is created.'}</div>
        <form id="blankTaskForm">
          <div class="field"><label>Title</label><input id="btTitle" required placeholder="e.g. Payment gateway integration"></div>
          ${admin ? `<div class="field"><label>Assign to</label><select id="btAssignee">${assigneeOptions()}</select></div>` : ''}
          <div class="field"><label>Depends on</label><select id="btPredecessor">${predecessorOptions(projectId,null,null)}</select><div class="hint">If this task can't start until another finishes, pick it here — durations chain together.</div></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="btSubmitBtn" class="btn btn-primary">Create task</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  runOnClickAndEnter('blankTaskForm', 'btSubmitBtn', ()=>{
    const titleEl = document.getElementById('btTitle');
    if(!titleEl.value.trim()){ titleEl.focus(); return; }
    const [type,id] = admin ? document.getElementById('btAssignee').value.split(':') : ['user', cu.id];
    const proj = state.projects.find(p=>p.id===projectId);
    const t = {
      id: uid('t'), projectId, title: titleEl.value.trim(),
      description:'', reason:'', assignedType:type, assignedId:id,
      predecessorId: document.getElementById('btPredecessor').value || null,
      startDate:'', endDate:'', originalEndDate:'', extended:false, blockedByTeamId:null, blockedByUserId:null, status:'open', closedDate:null,
      datesLocked:false, extensionHistory:[], weekendWork:false, checklistRecord:null, workedWeekendDates:[], lastUpdated:null, blockerReason:null, deadlineDisabled:false,
      checklistRequired: !!(proj && proj.requireChecklist), attachments: []
    };
    state.tasks.push(t); persist(); closeModal(); render();
  });
}

// A plain, read-only view of everything on a task — anyone can open this via the
// task title, regardless of whether they're allowed to edit it. Editing still goes
// through openTaskModal via the Edit button, gated by canEditTask().
// Read-only, whole-workstream view — click the workstream title to see its purpose
// and every task's story in one place, without opening each task individually.
function openWorkstreamInfoModal(projectId){
  const p = state.projects.find(x=>x.id===projectId);
  if(!p) return;
  const tasks = projectTasks(projectId);
  const taskTextBlocks = [];
  const taskBlocks = tasks.map((t,i)=>{
    const blockedTeamName = t.blockedByTeamId ? (t.blockedByUserId ? entityName('user', t.blockedByUserId) : ((state.teams.find(tm=>tm.id===t.blockedByTeamId)||{}).name || 'Unknown team')) : null;
    const extensionHtml = (t.extensionHistory && t.extensionHistory.length)
      ? `<div class="hint" style="margin-top:4px;"><b style="color:var(--paper-dim);">Extension history:</b>${t.extensionHistory.map(h=>`<br>→ moved to ${fmtDate(h.newEndDate)}${h.category?' · '+h.category:''} — ${h.reason||'no reason given'}`).join('')}</div>`
      : '';
    const blockerHtml = blockedTeamName
      ? `<div class="hint" style="margin-top:4px;color:var(--blocker);"><b>Blocked by ${blockedTeamName}:</b> ${t.blockerReason || 'no reason given'}</div>`
      : '';
    const timelineText = t.deadlineDisabled
      ? (t.startDate ? fmtDate(t.startDate)+' — no deadline' : 'Timeline not set yet')
      : `${t.startDate ? `${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}` : 'Timeline not set yet'}${t.extended ? ` (extended to ${fmtDate(t.endDate)})` : ''}`;
    taskTextBlocks.push([
      `${i+1}. ${t.title || 'Untitled task'} — ${entityName(t.assignedType,t.assignedId)}`,
      `   ${t.description || 'No description yet.'}`,
      t.reason ? `   Why this much time: ${t.reason}` : '',
      `   ${timelineText}`,
      (t.extensionHistory && t.extensionHistory.length) ? `   Extension history:` + t.extensionHistory.map(h=>`\n     → moved to ${fmtDate(h.newEndDate)}${h.category?' · '+h.category:''} — ${h.reason||'no reason given'}`).join('') : '',
      blockedTeamName ? `   Blocked by ${blockedTeamName}: ${t.blockerReason || 'no reason given'}` : '',
      `   ${t.status==='closed' ? 'Closed on '+fmtDate(t.closedDate) : 'Open'}`
    ].filter(Boolean).join(String.fromCharCode(10)));
    return `
      <div style="padding:12px 0;${i>0?'border-top:1px solid var(--line-soft);':''}">
        <div style="font-weight:600;font-size:14px;color:var(--paper);">${i+1}. ${t.title || 'Untitled task'} <span class="muted" style="font-weight:400;font-size:12px;">— ${entityName(t.assignedType,t.assignedId)}</span></div>
        <div class="hint" style="margin-top:4px;">${t.description || 'No description yet.'}</div>
        ${t.reason ? `<div class="hint" style="margin-top:4px;"><b style="color:var(--paper-dim);">Why this much time:</b> ${t.reason}</div>` : ''}
        <div class="hint" style="margin-top:4px;">${t.deadlineDisabled ? (t.startDate ? fmtDate(t.startDate)+' — no deadline' : 'Timeline not set yet') : `${t.startDate ? `${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}` : 'Timeline not set yet'}${t.extended ? ` <span style="color:var(--red);">extended to ${fmtDate(t.endDate)}</span>` : ''}`}</div>
        ${extensionHtml}
        ${blockerHtml}
        <div class="hint" style="margin-top:4px;">${t.status==='closed' ? 'Closed on '+fmtDate(t.closedDate) : 'Open'}</div>
      </div>`;
  }).join('');
  const shareText = [
    `Workstream: ${p.name}`,
    p.description ? `About: ${p.description}` : '',
    (p.contentItems && p.contentItems.length) ? `Content: ${p.contentItems.map(it=>it.title||it.fileName||'Untitled').join(', ')}` : '',
    '',
    ...taskTextBlocks
  ].filter(Boolean).join(String.fromCharCode(10));
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal" style="max-width:640px;">
        <h3>${p.name}</h3>
        <div class="modal-sub">${p.description || 'No description added for this workstream yet.'}</div>
        ${(p.contentItems && p.contentItems.length) ? `<div class="field"><label>Content</label>${p.contentItems.map(it=>renderProjectContentItem(it,p.id,false)).join('')}</div>` : ''}
        <div style="margin-top:10px;max-height:60vh;overflow-y:auto;">
          ${taskBlocks || '<div class="empty-state">No tasks in this workstream yet.</div>'}
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" data-close>Close</button>
          <a class="btn" href="${waLink('', shareText)}" target="_blank" rel="noopener">Share via WhatsApp</a>
        </div>
      </div>
    </div>`;
  bindModalClose();
  document.querySelectorAll('[data-open-project-content]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pid, itemId] = el.dataset.openProjectContent.split('|');
      openProjectContentPreviewModal(pid, itemId);
    });
  });
}

function openTaskDetailsModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const proj = state.projects.find(p=>p.id===t.projectId);
  const blockedTeamName = t.blockedByTeamId ? (t.blockedByUserId ? entityName('user', t.blockedByUserId) : ((state.teams.find(tm=>tm.id===t.blockedByTeamId)||{}).name || 'Unknown team')) : null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>${t.title || 'Untitled task'}</h3>
        <div class="modal-sub">${entityName(t.assignedType,t.assignedId)} · ${proj?proj.name:''}</div>

        <div class="field"><label>Description</label><div class="hint">${t.description || 'No description yet.'}</div></div>
        <div class="field"><label>Reason — why this much time?</label><div class="hint">${t.reason || 'No reason given yet.'}</div></div>

        <div class="field-row">
          <div class="field"><label>${t.deadlineDisabled ? 'Start date' : 'Agreed timeline'}</label><div class="hint">${t.startDate ? (t.deadlineDisabled ? fmtDate(t.startDate) : `${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}`) : 'Not set yet'}</div></div>
          ${(t.extended && !t.deadlineDisabled) ? `<div class="field"><label>Extended to</label><div class="hint" style="color:var(--red);">${fmtDate(t.endDate)}</div></div>` : ''}
        </div>

        ${(t.extensionHistory && t.extensionHistory.length && !t.deadlineDisabled) ? `<div class="field"><label>Extension history</label>${t.extensionHistory.map(h=>`<div class="hint">→ moved to ${fmtDate(h.newEndDate)}${h.category?' · '+h.category:''} — ${h.reason||'no reason given'}</div>`).join('')}</div>` : ''}

        <div class="field"><label>Status</label><div class="hint">${t.status==='closed' ? 'Closed on '+fmtDate(t.closedDate) : 'Open'}</div></div>

        ${blockedTeamName ? `
        <div class="field"><label>Blocked by</label><div class="hint" style="color:var(--blocker);">${blockedTeamName} — ${t.blockerReason || 'no reason given'}</div></div>
        ` : ''}

        ${t.weekendWork ? `<div style="margin:6px 0;">${pill('amber','Includes weekend work')}</div>` : ''}

        ${t.checklistRecord ? `<div class="field"><label>Checklist confirmed</label><div class="hint">Completed by ${t.checklistRecord.completedByName} on ${fmtDate(t.checklistRecord.completedAt)}${t.checklistRecord.items.map(i=>`<br>✓ ${i.text}`).join('')}</div></div>` : ''}

        <div class="field"><label>Last updated</label><div class="hint">${t.lastUpdated ? `${t.lastUpdated.byName} at ${fmtDateTime(t.lastUpdated.at)}` : 'Not yet updated'}</div></div>

        <div class="modal-actions">

          ${(()=>{

              `Assigned to: ${entityName(t.assignedType,t.assignedId)}`,
              `Description: ${t.description || 'No description yet.'}`,
              `Reason — why this much time: ${t.reason || 'No reason given yet.'}`,
              t.deadlineDisabled

                : `Agreed timeline: ${t.startDate ? `${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}` : 'Not set yet'}`,
              (t.extended && !t.deadlineDisabled) ? `Extended to: ${fmtDate(t.endDate)}` : '',
              (t.extensionHistory && t.extensionHistory.length && !t.deadlineDisabled)
                ? `Extension history:` + t.extensionHistory.map(h=>`\n  → moved to ${fmtDate(h.newEndDate)}${h.category?' · '+h.category:''} — ${h.reason||'no reason given'}`).join('')
                : '',
              `Status: ${t.status==='closed' ? 'Closed on '+fmtDate(t.closedDate) : 'Open'}`,
              blockedTeamName ? `Blocked by: ${blockedTeamName} — ${t.blockerReason || 'no reason given'}` : '',
              t.weekendWork ? `Includes weekend work` : '',
              t.checklistRecord ? `Checklist confirmed: completed by ${t.checklistRecord.completedByName} on ${fmtDate(t.checklistRecord.completedAt)}` + t.checklistRecord.items.map(i=>`\n  ✓ ${i.text}`).join('') : '',
              `Last updated: ${t.lastUpdated ? `${t.lastUpdated.byName} at ${fmtDateTime(t.lastUpdated.at)}` : 'Not yet updated'}`,
              (t.attachments && t.attachments.length) ? `Attachments: ${t.attachments.map(a=>a.title||a.fileName||'Untitled').join(', ')}` : ''
            ].filter(Boolean);
            return `<a class="btn" href="${waLink(assigneeUser?assigneeUser.phone:'', lines.join(String.fromCharCode(10)))}" target="_blank" rel="noopener">Share via WhatsApp</a>`;
          })()}

      openTaskAttachmentPreviewModal(tid, attId);
    });
  });
}

function openTaskModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  if(!canEditTask(t)) return; // closed tasks are admin-only from here on
  const admin = isAdmin();
  const canEdit = true; // guaranteed by the check above — kept as a named constant for clarity in the template
  const firstTimeSave = !t.datesLocked; // dates are only part of THIS form before they're ever locked
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Task details</h3>
        <div class="modal-sub">${entityName(t.assignedType,t.assignedId)} · ${state.projects.find(p=>p.id===t.projectId)?.name || ''}</div>
        <form id="taskForm">
          <div class="field"><label>Title</label><input id="tfTitle" value="${t.title.replace(/"/g,'&quot;')}" required></div>
          <div class="field"><label>Description</label><textarea id="tfDesc">${t.description||''}</textarea></div>
          ${firstTimeSave ? `
          <div class="field-row">
            <div class="field"><label>Start date</label><input type="date" id="tfStart" value="${t.startDate}" required></div>
            <div class="field" id="tfEndField" style="${t.deadlineDisabled?'display:none;':''}"><label>End date (agreed)</label><input type="date" id="tfEnd" value="${t.endDate}" ${t.deadlineDisabled?'disabled':'required'}></div>
          </div>
          <div class="hint" id="tfDateHint" style="${t.deadlineDisabled?'display:none;':''}">${dateRangeHint(t.startDate,t.endDate)}</div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="tfWeekendWork" ${t.weekendWork?'checked':''}> This timeline includes weekend work</label>
          <div class="hint">Once saved, this becomes the permanent agreed timeline — it can't be changed here again. Use "Extend date" later for delays, or an admin can amend it directly if needed.</div>
          ` : `
          <div class="field-row">
            <div class="field"><label>${t.deadlineDisabled?'Start date':'Agreed timeline'}</label><input value="${t.deadlineDisabled?fmtDate(t.startDate):`${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}`}" disabled></div>
            ${(t.extended && !t.deadlineDisabled) ? `<div class="field"><label>Extended to</label><input value="${fmtDate(t.endDate)}" disabled></div>` : ''}
            ${t.status==='closed' ? `<div class="field"><label>Closed on</label><input value="${fmtDate(t.closedDate)}" disabled></div>` : ''}
          </div>
          ${t.weekendWork ? `<div style="margin:6px 0;">${pill('amber','Includes weekend work')}</div>` : ''}
          ${t.checklistRecord ? `<div class="field"><label>Checklist confirmed</label><div class="hint">Completed by ${t.checklistRecord.completedByName} on ${fmtDate(t.checklistRecord.completedAt)}${t.checklistRecord.items.map(i=>`<br>✓ ${i.text}`).join('')}</div></div>` : ''}
          ${admin && !t.deadlineDisabled ? `<div class="hint">To correct these dates, use "Amend timeline" below — it's kept separate from Save so closing or editing a task never silently changes the permanent record.</div>` : ''}
          `}
          <div class="field"><label>Reason — why this much time?</label><textarea id="tfReason" placeholder="Explain the estimate...">${t.reason||''}</textarea></div>
          <div class="field">
            <label>Attachments</label>
            <div id="taskAttachList" style="margin-bottom:8px;">${(t.attachments||[]).length ? (t.attachments||[]).map(it=>renderTaskAttachmentItem(it,t.id,canEdit)).join('') : '<div class="muted" style="font-size:12px;">No attachments yet.</div>'}</div>
            ${canEdit ? `<button type="button" class="btn btn-sm" id="taskAttachAddBtn">+ Add attachment</button>` : ''}
          </div>
          <div class="field"><label>Assign to</label><select id="tfAssignee" ${admin?'':'disabled'}>${assigneeOptions(t.assignedType,t.assignedId)}</select></div>
          ${admin ? `<div class="field"><label>Depends on</label><select id="tfPredecessor">${predecessorOptions(t.projectId,t.id,t.predecessorId)}</select></div>` : ''}
          <div class="field">
            <label>Status</label>
            <select id="tfStatus">
              <option value="open" ${t.status==='open'?'selected':''}>Open</option>
              <option value="closed" ${t.status==='closed'?'selected':''}>Closed</option>
            </select>
          </div>
          ${admin ? `<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="tfDeadlineDisabled" ${t.deadlineDisabled?'checked':''}> This task has no deadline — don't track delays for it</label>
          <div class="hint">For ongoing or monitoring-only tasks. It stays visible here and on the Handoff Rail, but won't ever show as delayed, can't be extended, and is left out of the workstream's delay totals and reports.</div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="tfChecklistRequired" ${t.checklistRequired?'checked':''}> Require a checklist confirmation before this task can close</label>
          <div class="hint">Set per task — turn it off to skip the checklist step even if this workstream generally requires one, or on to require it even if the workstream doesn't.</div>` : ''}
          ${t.extensionHistory && t.extensionHistory.length ? `<div class="field"><label>Extension history</label>${t.extensionHistory.map(h=>`<div class="hint">→ moved to ${fmtDate(h.newEndDate)}${h.category?' · '+h.category:''} — ${h.reason||'no reason given'}</div>`).join('')}</div>` : ''}
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            ${admin ? `<button type="button" class="btn btn-danger" data-delete-task="${t.id}">Delete</button>` : ''}
            ${admin && !firstTimeSave ? `<button type="button" class="btn" id="amendTimelineBtn">Amend timeline</button>` : ''}
            <button type="button" id="tfSubmitBtn" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  const attachAddBtn = document.getElementById('taskAttachAddBtn');
  if(attachAddBtn) attachAddBtn.addEventListener('click', ()=> openAddTaskAttachmentModal(t.id));
  document.querySelectorAll('[data-open-task-attachment]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [tid, attId] = el.dataset.openTaskAttachment.split('|');
      openTaskAttachmentPreviewModal(tid, attId);
    });
  });
  document.querySelectorAll('[data-delete-task-attachment]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [tid, attId] = el.dataset.deleteTaskAttachment.split('|');
      const task = state.tasks.find(x=>x.id===tid);
      const att = task ? (task.attachments||[]).find(a=>a.id===attId) : null;
      const name = att ? (att.title || att.fileName || 'this attachment') : 'this attachment';
      openConfirmDelete('Delete this attachment?', `This will permanently delete "${name}". This can't be undone.`, ()=>{
        task.attachments = (task.attachments||[]).filter(a=>a.id!==attId);
        touchTask(task); persist();
        openTaskModal(tid); // refresh the modal so the removed attachment disappears
      });
    });
  });
  if(firstTimeSave){
    const hintEl = document.getElementById('tfDateHint');
    const updateHint = ()=>{ hintEl.textContent = dateRangeHint(document.getElementById('tfStart').value, document.getElementById('tfEnd').value); };
    document.getElementById('tfStart').addEventListener('input', updateHint);
    document.getElementById('tfEnd').addEventListener('input', updateHint);
  }
  const deadlineToggleEl = document.getElementById('tfDeadlineDisabled');
  if(deadlineToggleEl && firstTimeSave){
    deadlineToggleEl.addEventListener('change', ()=>{
      const endField = document.getElementById('tfEndField');
      const endInput = document.getElementById('tfEnd');
      const hintEl = document.getElementById('tfDateHint');
      const on = deadlineToggleEl.checked;
      endField.style.display = on ? 'none' : '';
      hintEl.style.display = on ? 'none' : '';
      endInput.disabled = on;
      if(on) endInput.removeAttribute('required'); else endInput.setAttribute('required','required');
    });
  }
  runOnClickAndEnter('taskForm', 'tfSubmitBtn', ()=>{
    const titleEl = document.getElementById('tfTitle');
    if(!titleEl.value.trim()){ titleEl.focus(); return; }
    const noDeadline = admin && document.getElementById('tfDeadlineDisabled') && document.getElementById('tfDeadlineDisabled').checked;
    let sVal, eVal;
    if(firstTimeSave){
      sVal = document.getElementById('tfStart').value;
      eVal = noDeadline ? sVal : document.getElementById('tfEnd').value;
      if(!sVal || (!noDeadline && !eVal)){ return; }
    }
    const commit = ()=>{
      t.title = titleEl.value.trim();
      t.description = document.getElementById('tfDesc').value.trim();
      t.reason = document.getElementById('tfReason').value.trim();
      t.status = document.getElementById('tfStatus').value;
      if(t.status==='closed' && !t.closedDate) t.closedDate = todayISO();
      if(t.status==='open') t.closedDate = null;
      if(firstTimeSave){
        t.startDate = sVal;
        t.endDate = eVal;
        t.originalEndDate = eVal;
        t.datesLocked = true;
        if(document.getElementById('tfWeekendWork').checked) t.weekendWork = true;
      }
      if(admin){
        const [type,id] = document.getElementById('tfAssignee').value.split(':');
        t.assignedType = type; t.assignedId = id;
        t.predecessorId = document.getElementById('tfPredecessor').value || null;
        const deadlineToggle = document.getElementById('tfDeadlineDisabled');
        if(deadlineToggle) t.deadlineDisabled = deadlineToggle.checked;
        const checklistToggle = document.getElementById('tfChecklistRequired');
        if(checklistToggle) t.checklistRequired = checklistToggle.checked;
      }
      touchTask(t);
      persist(); closeModal(); render();
    };
    const overlapThenCommit = ()=>{
      if(firstTimeSave){
        const assignedType = admin ? document.getElementById('tfAssignee').value.split(':')[0] : t.assignedType;
        const assignedId = admin ? document.getElementById('tfAssignee').value.split(':')[1] : t.assignedId;
        const overlaps = findOverlappingTasks(assignedType, assignedId, sVal, eVal, t.id);
        if(overlaps.length){ openOverlapConfirmModal(overlaps, commit); return; }
      }
      commit();
    };
    const pendingStatus = document.getElementById('tfStatus').value;
    const isClosingNow = t.status!=='closed' && pendingStatus==='closed';
    if(isClosingNow){
      const proj = state.projects.find(p=>p.id===t.projectId);
      const teamId = t.assignedType==='team' ? t.assignedId : (state.users.find(u=>u.id===t.assignedId)||{}).teamId;
      const team = teamId ? state.teams.find(tm=>tm.id===teamId) : null;
      const items = (team && Array.isArray(team.checklist)) ? team.checklist : [];
      if(t.checklistRequired && items.length){
        openChecklistGateModal(t, team, items, (record)=>{ t.checklistRecord = record; overlapThenCommit(); });
        return;
      }
    }
    overlapThenCommit();
  });
  const amendBtn = document.getElementById('amendTimelineBtn');
  if(amendBtn) amendBtn.addEventListener('click', ()=> openAmendTimelineModal(t.id));
  const delBtn = document.querySelector('[data-delete-task]');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    openConfirmDelete('Delete this task?', `This will permanently delete "${t.title||'this task'}" — its timeline, extension history, everything. This can't be undone.`, ()=>{
      state.tasks = state.tasks.filter(x=>x.id!==t.id);
      state.tasks.forEach(x=>{ if(x.predecessorId===t.id) x.predecessorId=null; });
      persist(); closeModal(); render();
    });
  });
}

function openAmendTimelineModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Amend timeline</h3>
        <div class="modal-sub">${t.title} — this directly rewrites the permanent record. Use with care.</div>
        <form id="amendForm">
          <div class="field-row">
            <div class="field"><label>Start date</label><input type="date" id="amStart" value="${t.startDate}" required></div>
            <div class="field"><label>Original agreed end date</label><input type="date" id="amOrigEnd" value="${t.originalEndDate}" required></div>
          </div>
          ${t.extended ? `<div class="field"><label>Extended end date</label><input type="date" id="amExtEnd" value="${t.endDate}" required></div>` : ''}
          <div class="hint" id="amDateHint">${dateRangeHint(t.startDate, t.originalEndDate)}</div>
          ${t.status==='closed' ? `<div class="field"><label>Closed date</label><input type="date" id="amClosedDate" value="${t.closedDate||''}" required></div><div class="hint">This date is what the delay shown on the workstream is measured against once a task is closed.</div>` : ''}
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="amWeekendWork" ${t.weekendWork?'checked':''}> This timeline includes weekend work</label>
          <div class="hint">This is separate from the normal Save action on purpose — closing or editing a task will never change these dates on its own.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="amendSubmitBtn" class="btn btn-danger">Save amended timeline</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  const amUpdateHint = ()=>{ document.getElementById('amDateHint').textContent = dateRangeHint(document.getElementById('amStart').value, document.getElementById('amOrigEnd').value); };
  document.getElementById('amStart').addEventListener('input', amUpdateHint);
  document.getElementById('amOrigEnd').addEventListener('input', amUpdateHint);
  runOnClickAndEnter('amendForm', 'amendSubmitBtn', ()=>{
    const start = document.getElementById('amStart').value;
    const origEnd = document.getElementById('amOrigEnd').value;
    const extEnd = t.extended ? document.getElementById('amExtEnd').value : null;
    const closedDateVal = t.status==='closed' ? document.getElementById('amClosedDate').value : null;
    if(!start || !origEnd || (t.extended && !extEnd) || (t.status==='closed' && !closedDateVal)) return;
    t.startDate = start;
    t.originalEndDate = origEnd;
    t.weekendWork = document.getElementById('amWeekendWork').checked;
    if(t.status==='closed'){
      t.closedDate = closedDateVal;
    }
    if(t.extended){
      t.endDate = extEnd;
    } else {
      t.endDate = origEnd;
    }
    touchTask(t);
    persist(); closeModal(); render();
  });
}

function openExtendModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const DELAY_CATEGORIES = ['Client delay','Dependency on another team','Scope change','Underestimated','Resource unavailable','Other'];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Extend date</h3>
        <div class="modal-sub">${t.title} — currently agreed for ${fmtDate(t.endDate)}</div>
        <form id="extendForm">
          <div class="field"><label>New end date</label><input type="date" id="exDate" min="${addDays(t.endDate,1)}" value="${addDays(t.endDate,1)}" required></div>
          <div class="hint" id="exDateHint">${dateRangeHint(t.startDate, addDays(t.endDate,1))}</div>
          <div class="field"><label>Why is this late?</label><select id="exCategory">${DELAY_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
          <div class="field"><label>Reason for the extension</label><textarea id="exReason" placeholder="What pushed this back?" required></textarea></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="exWeekendWork" ${t.weekendWork?'checked':''}> This includes weekend work</label>
          <div class="hint">The original date (${fmtDate(t.originalEndDate)}) stays on record. This task, its chain and the project dashboard will switch to red.</div>
          <div class="login-error" id="exError"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="exSubmitBtn" class="btn btn-danger">Confirm extension</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  document.getElementById('exDate').addEventListener('input', ()=>{
    document.getElementById('exDateHint').textContent = dateRangeHint(t.startDate, document.getElementById('exDate').value);
  });
  runOnClickAndEnter('extendForm', 'exSubmitBtn', ()=>{
    const newDate = document.getElementById('exDate').value;
    const reason = document.getElementById('exReason').value.trim();
    const category = document.getElementById('exCategory').value;
    const errEl = document.getElementById('exError');
    if(!newDate){ errEl.textContent = 'Pick a new end date before confirming.'; return; }
    if(newDate <= t.endDate){ errEl.textContent = `The new date must be after the current agreed date (${fmtDate(t.endDate)}).`; return; }
    if(!reason){ errEl.textContent = 'Add a reason for the extension.'; return; }
    errEl.textContent = '';
    t.extensionHistory = t.extensionHistory || [];
    t.extensionHistory.push({date: todayISO(), newEndDate:newDate, reason, category});
    t.lastDelayCategory = category;
    t.endDate = newDate;
    t.extended = true;
    if(document.getElementById('exWeekendWork').checked) t.weekendWork = true;
    touchTask(t);
    persist(); closeModal(); render();
  });
}

function bindModalClose(){
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  document.querySelector('[data-backdrop]').addEventListener('click', (e)=>{ if(e.target.dataset.backdrop!==undefined && e.target===e.currentTarget) closeModal(); });
}

// Other still-open tasks for the same person whose date range overlaps the one being saved.
function findOverlappingTasks(assignedType, assignedId, start, end, excludeTaskId){
  if(!start || !end) return [];
  return state.tasks.filter(o=>
    o.id!==excludeTaskId &&
    o.assignedType===assignedType && o.assignedId===assignedId &&
    o.status!=='closed' &&
    o.startDate && o.endDate &&
    start <= o.endDate && end >= o.startDate
  );
}

// A stacked confirmation shown on top of the task form (without closing it) when the
// dates just entered overlap another open task for the same person. "Change dates"
// simply dismisses this overlay so they can edit the form underneath; "Keep dates
// anyway" runs the save that was already prepared.
// Reverting a marked-worked weekend day back to a normal weekly off — a quick
// confirmation so admins don't lose the record with a single accidental click.
function openRevertWeekendConfirm(iso, onConfirm){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-backdrop" style="z-index:60;">
      <div class="modal">
        <h3>Change back to weekly off?</h3>
        <div class="modal-sub">${fmtDate(iso)} is currently marked as worked. Do you want to change it back to weekly off? This will also clear the Comp Off record for it in Attendance.</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="revertWeekendCancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="revertWeekendConfirm">Yes, change back</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const cleanup = ()=> div.remove();
  div.querySelector('#revertWeekendCancel').addEventListener('click', cleanup);
  div.querySelector('#revertWeekendConfirm').addEventListener('click', ()=>{ cleanup(); onConfirm(); });
}

}

// Blocks closing a task until every one of the assigned team's checklist points is
// ticked — this workstream has "Require checklist" turned on. Records exactly what
// was ticked, by whom, and when, as a permanent snapshot on the task.
function openChecklistGateModal(t, team, items, onComplete){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-backdrop" style="z-index:60;">
      <div class="modal">
        <h3>Before closing this task</h3>
        <div class="modal-sub">${team.name}'s checklist for "${t.title||'this task'}" — keep these in mind:</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin:14px 0;">
          ${items.map(it=>`<div style="font-size:13px;color:var(--paper-dim);display:flex;gap:8px;align-items:flex-start;"><span style="color:var(--amber);">✓</span><span>${it.text}</span></div>`).join('')}
        </div>
        <label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin-top:6px;">
          <input type="checkbox" id="clGateSingleCheck" style="margin-top:2px;">
          <span>I confirm this task was completed keeping the above in mind.</span>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="clGateCancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="clGateConfirm" disabled>Confirm &amp; close task</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const singleCheck = div.querySelector('#clGateSingleCheck');
  const confirmBtn = div.querySelector('#clGateConfirm');
  singleCheck.addEventListener('change', ()=>{ confirmBtn.disabled = !singleCheck.checked; });
  div.querySelector('#clGateCancel').addEventListener('click', ()=> div.remove());
  confirmBtn.addEventListener('click', ()=>{
    if(confirmBtn.disabled) return;
    const record = {
      completedBy: session.userId,
      completedByName: (currentUser()||{}).name || 'Unknown',
      completedAt: todayISO(),
      items: items.map(it=>({ id: it.id, text: it.text, checked: true }))
    };
    div.remove();
    onComplete(record);
  });
}

/* ============================== REPORTS ============================== */

function renderReports(){
  const accessIds = accessibleProjectIds();
  const scopedTasks = accessIds===null ? state.tasks : state.tasks.filter(t=>accessIds.includes(t.projectId));
  const scopedProjects = visibleProjects();

  const f = ui.reportFilters;
  let rows = scopedTasks.slice();
  if(f.project) rows = rows.filter(t=>t.projectId===f.project);
  if(f.team) rows = rows.filter(t=>t.assignedType==='team' && t.assignedId===f.team);
  if(f.user) rows = rows.filter(t=>t.assignedType==='user' && t.assignedId===f.user);
  if(f.status) rows = rows.filter(t=>taskDerivedStatus(t)===f.status);
  if(f.reason) rows = rows.filter(t=> f.reason==='Uncategorized' ? (t.extended && !t.lastDelayCategory) : t.lastDelayCategory===f.reason);

  const total = scopedTasks.length;
  const onTime = scopedTasks.filter(t=>!isTaskDelayed(t)).length;
  const late = scopedTasks.filter(t=>isTaskDelayed(t)).length;

  // leaderboard of delays by team/user, with repeat offenders flagged
  const lb = {};
  scopedTasks.filter(t=>isTaskDelayed(t)).forEach(t=>{
    const name = entityName(t.assignedType,t.assignedId);
    lb[name] = (lb[name]||0)+1;
  });
  const lbMax = Math.max(1, ...Object.values(lb));
  const lbRows = Object.entries(lb).sort((a,b)=>b[1]-a[1]).map(([name,count])=>`
    <div class="lb-row"><div class="lb-name">${name}${count>=3?' <span class="mono" style="color:var(--red);font-size:10px;">· REPEAT</span>':''}</div><div class="lb-bar"><span style="width:${count/lbMax*100}%;${count>=3?'background:var(--red);':''}"></span></div><div class="lb-count">${count} delay${count===1?'':'s'}</div></div>
  `).join('') || `<div class="muted" style="font-size:12px;">No delays recorded — nice.</div>`;

  // why things are late, aggregated across every extension on record in scope
  const reasonCounts = {};
  scopedTasks.forEach(t=>{
    (t.extensionHistory||[]).forEach(h=>{
      const cat = h.category || 'Uncategorized';
      reasonCounts[cat] = (reasonCounts[cat]||0)+1;
    });
  });
  const reasonMax = Math.max(1, ...Object.values(reasonCounts));
  const reasonRows = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>`
    <div class="lb-row" data-filter-reason="${cat}" style="cursor:pointer;${f.reason===cat?'background:var(--panel-hi);border-radius:6px;':''}">
      <div class="lb-name">${cat}</div><div class="lb-bar"><span style="width:${count/reasonMax*100}%;background:var(--amber);"></span></div><div class="lb-count">${count}×</div>
    </div>
  `).join('') || `<div class="muted" style="font-size:12px;">No extensions recorded yet.</div>`;

  const tableRows = rows.map(t=>{
    const ds = taskDerivedStatus(t);
    const labelMap = {'closed-on-time':['green','Closed on time'],'closed-late':['red','Closed late'],'open-on-track':['amber','Open · on track'],'open-delayed':['red','Open · delayed']};
    const [color,label] = labelMap[ds];
    const proj = state.projects.find(p=>p.id===t.projectId);
    const delayed = isTaskDelayed(t);
    const delayDays = delayed ? Math.max(daysBetween(t.originalEndDate, effectiveEndDate(t)), 0) : 0;
    return `<tr>
      <td>${proj ? proj.name : '—'}</td>
      <td><div class="task-title">${t.title||'Untitled'}</div></td>
      <td>${entityName(t.assignedType,t.assignedId)}</td>
      <td class="mono" style="font-size:11px;">${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}</td>
      <td class="mono" style="font-size:11px;${delayed?'color:var(--red)':''}">${t.extended ? fmtDate(t.endDate) : '—'}</td>
      <td class="mono" style="font-size:11px;">${t.lastDelayCategory || '—'}</td>
      <td>${pill(color,label)}</td>
      <td class="mono" style="font-size:11px;${delayDays>0?'color:var(--red)':''}">${delayDays>0 ? '-'+delayDays+'d' : '0d'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="eyebrow">Reports</div>
    <h1 class="page-title" style="margin-bottom:22px;">Who delivered, who slipped</h1>

    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${total}</div><div class="l">Total tasks</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--green);">${onTime}</div><div class="l">Never extended</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--red);">${late}</div><div class="l">Extended at least once</div></div>
    </div>

    <div class="grid g3" style="align-items:start;margin-bottom:22px;">
      <div class="card">
        <div class="section-title">Most delays, by team &amp; individual</div>
        ${lbRows}
      </div>
      <div class="card">
        <div class="section-title">Why things are late</div>
        <div class="muted" style="font-size:11px;margin-bottom:8px;margin-top:-4px;">Click a reason to see exactly which tasks it covers.</div>
        ${reasonRows}
      </div>
      <div class="card">
        <div class="section-title">Filter</div>
        <div class="filters">
          <select id="fProject"><option value="">All workstreams</option>${scopedProjects.map(p=>`<option value="${p.id}" ${f.project===p.id?'selected':''}>${p.name}</option>`).join('')}</select>
          <select id="fTeam"><option value="">All teams</option>${state.teams.map(t=>`<option value="${t.id}" ${f.team===t.id?'selected':''}>${t.name}</option>`).join('')}</select>
          <select id="fUser"><option value="">All individuals</option>${state.users.filter(u=>u.role!=='admin').map(u=>`<option value="${u.id}" ${f.user===u.id?'selected':''}>${u.name}</option>`).join('')}</select>
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="closed-on-time" ${f.status==='closed-on-time'?'selected':''}>Closed on time</option>
            <option value="closed-late" ${f.status==='closed-late'?'selected':''}>Closed late</option>
            <option value="open-on-track" ${f.status==='open-on-track'?'selected':''}>Open · on track</option>
            <option value="open-delayed" ${f.status==='open-delayed'?'selected':''}>Open · delayed</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      ${f.reason ? `<div class="banner"><span>Filtered to "${f.reason}" delays</span><button type="button" class="btn btn-sm btn-ghost" id="clearReasonFilter" style="margin-left:auto;">Clear ✕</button></div>` : ''}
      <table>
        <thead><tr><th>Workstream</th><th>Task</th><th>Assigned</th><th>Agreed window</th><th>Extended to</th><th>Why late</th><th>Status</th><th>Delay</th></tr></thead>
        <tbody>${tableRows || `<tr><td colspan="8" class="empty-state">No tasks match these filters.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function bindReports(){
  ['fProject','fTeam','fUser','fStatus'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      ui.reportFilters = {
        project: document.getElementById('fProject').value,
        team: document.getElementById('fTeam').value,
        user: document.getElementById('fUser').value,
        status: document.getElementById('fStatus').value,
        reason: ui.reportFilters.reason,
      };
      render();
    });
  });
  document.querySelectorAll('[data-filter-reason]').forEach(row=>{

      ui.reportFilters.reason = (ui.reportFilters.reason===cat) ? '' : cat; // click again to clear
      render();
    });
  });
  const clearBtn = document.getElementById('clearReasonFilter');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ ui.reportFilters.reason=''; render(); });
}

/* ============================== ACTIVE ASSIGNMENTS ============================== */

// Per-member workload: what they're on right now, what's next, and a tentative
// date for when they'll be free of everything currently assigned to them.
function activeAssignmentsData(){
  const accessIds = accessibleProjectIds();
  const scopedTasks = accessIds===null ? state.tasks : state.tasks.filter(t=>accessIds.includes(t.projectId));
  const cu = currentUser();
  let members = state.users.filter(u=>u.role==='member' || u.role==='hod');
  if(cu && cu.role==='member') members = members.filter(u=>u.id===cu.id); // members only ever see themselves here; HODs see everyone, matching their monitoring role

  return members.map(u=>{
    const myTasks = scopedTasks.filter(t=>
      (t.assignedType==='user' && t.assignedId===u.id) ||
      (t.assignedType==='team' && t.assignedId===u.teamId)
    );
    const openTasks = myTasks
      .filter(t=>t.status!=='closed' && t.datesLocked) // a blank task with no timeline yet isn't real workload
      .slice()
      .sort((a,b)=> (effectiveEndDate(a)||'9999') < (effectiveEndDate(b)||'9999') ? -1 : 1);
    const closedTasks = myTasks
      .filter(t=>t.status==='closed')
      .slice()
      .sort((a,b)=> (b.closedDate||'') < (a.closedDate||'') ? -1 : 1);
    const current = openTasks[0] || null;
    const future = openTasks.slice(1);
    const freeBy = openTasks.reduce((max,t)=>{ const e=effectiveEndDate(t); return (e && (!max||e>max)) ? e : max; }, null);
    return { user:u, team: state.teams.find(tm=>tm.id===u.teamId), allTasks: myTasks, openTasks, closedTasks, current, future, freeBy, openCount: openTasks.length };
  });
}

function taskWorkloadStatus(t){
  if(t.blockedByTeamId){
    const teamName = (state.teams.find(tm=>tm.id===t.blockedByTeamId)||{}).name || 'Unknown team';
    return { color:'blocker', label:'Blocked by '+teamName, tooltip: t.blockerReason||'no reason given' };
  }
  if(isTaskDelayed(t)) return { color:'red', label: t.extended?'Extended':'Overdue' };
  return { color:'green', label:'In progress' };
}

// closed / current / future — the three-way bucket used for both the row accent
// color and the calendar coloring.
function taskCategory(t, currentTaskId){
  if(t.status==='closed') return 'closed';
  if(t.id===currentTaskId) return 'current';
  return 'future';
}
const CATEGORY_COLOR = { closed:'#7C93B3', current:'var(--green)', future:'var(--amber)' };
const CATEGORY_LABEL = { closed:'Closed', current:'Current', future:'Future' };

function taskEffectiveRange(t){
  const end = t.status==='closed' ? (t.closedDate && t.closedDate>t.endDate ? t.closedDate : t.endDate) : effectiveEndDate(t);
  return { start: t.startDate, end };
}

function taskOverlapsMonth(t, monthKey){
  if(!monthKey) return true;
  const {start,end} = taskEffectiveRange(t);
  if(!start || !end) return false;
  const [y,m] = monthKey.split('-').map(Number);
  const monthStart = `${monthKey}-01`;
  const monthEndD = new Date(y, m, 0);
  const monthEnd = `${monthEndD.getFullYear()}-${String(monthEndD.getMonth()+1).padStart(2,'0')}-${String(monthEndD.getDate()).padStart(2,'0')}`;
  return start <= monthEnd && end >= monthStart;
}

// Every month touched by any in-scope task, plus the current month, for the month filter dropdown.
function monthsInRange(rows){
  const set = new Set([todayISO().slice(0,7)]);
  rows.forEach(r=> r.allTasks.forEach(t=>{
    const {start,end} = taskEffectiveRange(t);
    if(!start || !end) return;
    let cur = new Date(start+'T00:00:00');
    const endD = new Date(end+'T00:00:00');
    let guard = 0;
    while(cur<=endD && guard<240){
      set.add(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
      cur.setMonth(cur.getMonth()+1);
      guard++;
    }
  }));
  return Array.from(set).sort();
}
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}

const CAL_COLOR = { closed:'#E6A560', current:'#E8D66B', future:'#7EB6E0', free:'#8FD69E' };

// Highest-priority task covering a given date (current > future > closed) — used to
// decide both the day's color and, for weekends, which task any marked work belongs to.
function findCoveringTask(row, iso, currentTaskId){
  const rank = { current:3, future:2, closed:1 };
  let best = null, bestRank = -1;
  row.allTasks.forEach(t=>{
    const {start,end} = taskEffectiveRange(t);
    if(!start || !end || iso<start || iso>end) return;
    const c = taskCategory(t, currentTaskId);
    if(rank[c] > bestRank){ bestRank = rank[c]; best = t; }
  });
  return best;
}

function buildCalendarHtml(row, monthKey, currentTaskId){
  const [y,m] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = new Date(y, m-1, 1).getDay();
  const dows = ['S','M','T','W','T','F','S'];
  const admin = isAdmin();
  // Fallback for attributing marked-worked weekend days when no task's own date range
  // covers that specific day — prefer the person's current task, else any task they have.
  const fallbackAttribution = (row.current || row.allTasks[0] || null);
  let cells = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const weekend = isWeekendISO(iso);
    const covering = findCoveringTask(row, iso, currentTaskId);
    let cat = null;
    let clickable = false;
    let attributionTask = null;
    if(weekend){
      attributionTask = covering || fallbackAttribution;
      const worked = attributionTask && Array.isArray(attributionTask.workedWeekendDates) && attributionTask.workedWeekendDates.includes(iso);
      if(worked) cat = taskCategory(attributionTask, currentTaskId);
      if(attributionTask && admin) clickable = true;
    } else {
      cat = covering ? taskCategory(covering, currentTaskId) : 'free';
    }
    const cls = `cal-day ${cat||''}${weekend?' weekend':''}${clickable?' admin-toggle':''}`;
    const toggleAttr = clickable ? ` data-cal-toggle="${iso}|${attributionTask.id}|${row.user.id}"` : '';
    const titleAttr = weekend ? (cat ? 'Worked this weekend — click to unmark' : (clickable ? 'Weekly off — click to mark as worked' : 'Weekly off')) : '';
    cells += `<div class="${cls}"${toggleAttr} title="${titleAttr}">${d}</div>`;
  }
  return `<div style="display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;">
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.closed};margin-right:5px;"></span>Closed</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.current};margin-right:5px;"></span>Current</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.future};margin-right:5px;"></span>Future</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.free};margin-right:5px;"></span>Free</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--panel-raised);border:1px dashed var(--paper-faint);margin-right:5px;"></span>Weekly off${admin ? ' — click a weekend day to mark it worked' : ''}</span>
    </div>
    <div class="cal-grid">${cells}</div>`;
}

function renderAssignments(){
  const allRows = activeAssignmentsData();
  const availableCount = allRows.filter(r=>r.openCount===0).length;
  const working = allRows.filter(r=>r.openCount>0 && !r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId)).length;
  const atRisk = allRows.filter(r=>r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId)).length;

  const cu = currentUser();
  const isMemberSelf = cu && cu.role==='member';
  const viewBy = isMemberSelf ? 'individual' : (ui.assignmentsFilters.viewBy || 'individual'); // 'individual' | 'team'
  const userFilter = isMemberSelf ? cu.id : ui.assignmentsFilters.user;
  const teamFilter = isMemberSelf ? '' : ui.assignmentsFilters.team;
  const statusFilter = ui.assignmentsFilters.status; // 'current' | 'future' | 'closed' | 'available' | 'all'
  const monthFilter = ui.assignmentsFilters.month; // '' or 'YYYY-MM'
  const personFilter = ui.assignmentsFilters.personFilter; // '' | 'available' | 'working' | 'atrisk'

  let rows = allRows;
  let scoped = false;
  if(viewBy==='individual' && userFilter){ rows = allRows.filter(r=>r.user.id===userFilter); scoped = true; }
  else if(viewBy==='team' && teamFilter){ rows = allRows.filter(r=>r.team && r.team.id===teamFilter); scoped = true; }

  if(personFilter==='available') rows = rows.filter(r=>r.openCount===0);
  else if(personFilter==='working') rows = rows.filter(r=>r.openCount>0 && !r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId));
  else if(personFilter==='atrisk') rows = rows.filter(r=>r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId));

  if(statusFilter==='available') rows = rows.filter(r=>r.openCount===0);
  else if(statusFilter==='current') rows = rows.filter(r=>!!r.current);
  else if(statusFilter==='future') rows = rows.filter(r=>r.future.length>0);
  else if(statusFilter==='closed') rows = rows.filter(r=>r.closedTasks.length>0);

  const showCalendarFor = scoped; // show each scoped card's own calendar, whether it's one person or a whole team
  const availableMonths = monthsInRange(allRows);

  const cards = rows.map(r=>{
    const headerStatus = r.openCount===0
      ? pill('green','Available')
      : (r.openTasks.some(t=>t.blockedByTeamId) ? pill('blocker', 'Blocked')
        : r.openTasks.some(t=>isTaskDelayed(t)) ? pill('red','Delayed')
        : pill('green','On track'));

    let taskList;
    if(statusFilter==='closed') taskList = r.closedTasks;
    else if(statusFilter==='current') taskList = r.current ? [r.current] : [];
    else if(statusFilter==='future') taskList = r.future;
    else if(statusFilter==='available') taskList = [];
    else taskList = r.allTasks; // 'all'

    taskList = taskList.filter(t=>taskOverlapsMonth(t, monthFilter)).slice().sort((a,b)=>{
      const ea = taskEffectiveRange(a).start||'9999', eb = taskEffectiveRange(b).start||'9999';
      return ea<eb?-1:1;
    });

    const taskRowsHtml = taskList.map(t=>{
      const tp = state.projects.find(p=>p.id===t.projectId);
      const cat = taskCategory(t, r.current?r.current.id:null);
      const st = cat==='closed'
        ? pill(isTaskDelayed(t)?'red':'green', isTaskDelayed(t)?'Closed late':'Closed on time')
        : pill(taskWorkloadStatus(t).color, taskWorkloadStatus(t).label, taskWorkloadStatus(t).tooltip);
      const range = taskEffectiveRange(t);
      return `<tr data-open-project-row="${tp?tp.id:''}" style="cursor:pointer;">
        <td style="border-left:3px solid ${CATEGORY_COLOR[cat]};">
          <div class="task-title" style="font-size:13px;">${cat==='current'?'▸ ':''}${t.title||'Untitled task'}</div>
          <div class="task-desc">${tp?tp.name:''}</div>
        </td>
        <td class="mono" style="font-size:12px;">${fmtDate(t.startDate)} → ${fmtDate(range.end)}</td>
        <td>${pill(cat==='closed'?'green':cat==='current'?'green':'amber', CATEGORY_LABEL[cat])}</td>
        <td class="mono" style="font-size:12px;">${cat==='closed' ? fmtDate(t.closedDate) : '—'}</td>
        <td>${st}</td>
      </tr>`;
    }).join('');

    const emptyMsg = statusFilter==='available' ? 'Available — nothing currently assigned.' : 'Nothing to show for this filter.';

    return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
        <div class="userchip"><div class="initials">${initials(r.user.name)}</div>
          <div>
            <div style="font-weight:600;">${r.user.name}</div>
            <div class="muted" style="font-size:11px;">${r.team?r.team.name:'No team'}</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          ${headerStatus}
          <span class="mono" style="font-size:11px;color:var(--paper-faint);">${r.freeBy ? 'Available by '+fmtDate(r.freeBy) : 'Available now'}</span>
        </div>
      </div>
      ${taskList.length ? `
      <table>
        <thead><tr><th>Task</th><th>Timeline</th><th>Category</th><th>Closed</th><th>Status</th></tr></thead>
        <tbody>${taskRowsHtml}</tbody>
      </table>` : `<div class="empty-state" style="padding:20px;">${emptyMsg}</div>`}
      ${showCalendarFor ? `<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);"><div class="section-title" style="font-size:15px;margin-bottom:10px;">${monthLabel(monthFilter||todayISO().slice(0,7))}</div>${buildCalendarHtml(r, monthFilter||todayISO().slice(0,7), r.current?r.current.id:null)}</div>` : ''}
    </div>`;
  }).join('');

function bindAssignments(){
  const vb = document.getElementById('asgViewBy');
  if(vb) vb.addEventListener('change', ()=>{ ui.assignmentsFilters.viewBy = vb.value; ui.assignmentsFilters.user=''; ui.assignmentsFilters.team=''; render(); });
  const uf = document.getElementById('asgUserFilter');
  if(uf) uf.addEventListener('change', ()=>{ ui.assignmentsFilters.user = uf.value; render(); });
  const tf = document.getElementById('asgTeamFilter');
  if(tf) tf.addEventListener('change', ()=>{ ui.assignmentsFilters.team = tf.value; render(); });
  const sf = document.getElementById('asgStatusFilter');
  if(sf) sf.addEventListener('change', ()=>{ ui.assignmentsFilters.status = sf.value; ui.assignmentsFilters.personFilter=''; render(); });
  const mf = document.getElementById('asgMonthFilter');
  if(mf) mf.addEventListener('change', ()=>{ ui.assignmentsFilters.month = mf.value; render(); });
  document.querySelectorAll('[data-open-project-row]').forEach(row=>{
    const id = row.dataset.openProjectRow;
    if(!id) return;
    row.addEventListener('click', ()=>{ ui.projectId = id; ui.view='project'; render(); });
  });
  document.querySelectorAll('[data-cal-toggle]').forEach(cell=>{
    cell.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const [iso, taskId, userId] = cell.dataset.calToggle.split('|');
      const t = state.tasks.find(x=>x.id===taskId);
      if(!t) return;
      if(!Array.isArray(t.workedWeekendDates)) t.workedWeekendDates = [];
      const idx = t.workedWeekendDates.indexOf(iso);
      if(idx>=0){
        // reverting a worked weekend day back to weekly off — confirm first, and
        // clear the Comp Off record that was set for it in Attendance
        openRevertWeekendConfirm(iso, ()=>{
          const i2 = t.workedWeekendDates.indexOf(iso);
          if(i2>=0) t.workedWeekendDates.splice(i2,1);
          if(userId && getAttendance(userId, iso)==='CO') setAttendanceValue(userId, iso, null);
          persist(); render();
        });
      } else {
        // marking a weekly off as worked now also confirms first, and records a
        // Comp Off (CO) day in Attendance for the same person and date
        openMarkWeekendWorkedConfirm(iso, ()=>{
          t.workedWeekendDates.push(iso);
          if(userId) setAttendanceValue(userId, iso, 'CO');
          persist(); render();
        });
      }
    });
  });
  document.querySelectorAll('[data-person-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const val = chip.dataset.personFilter;
      if(ui.assignmentsFilters.personFilter===val) return; // already showing this — repeat clicks do nothing
      ui.assignmentsFilters.personFilter = val;
      ui.assignmentsFilters.status = val==='available' ? 'available' : 'current';
      render();
    });
  });
  const resetBtn = document.getElementById('asgResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    ui.assignmentsFilters = { viewBy:'individual', user:'', team:'', status:'current', month: todayISO().slice(0,7), personFilter:'' };
    render();
  });
}

function renderCopilotAnalytics(){
  if(!copilotAnalyticsData){
    return `<div class="card"><div class="muted" style="font-size:13px;">Loading Copilot usage data…</div></div>`;
  }
  const { logs, provider, model } = copilotAnalyticsData;
  if(!logs.length){
    return `<div class="card"><div class="muted" style="font-size:13px;">No Copilot usage recorded yet — this fills in once people start asking it questions.</div></div>`;
  }

  // All aggregation happens here, client-side, from the raw rows the backend
  // already verified this admin is allowed to see — real numbers, not estimates.
  const byMonth = {};
  const byUser = {};
  let totalCost = 0, totalSummaryCost = 0, totalUnhelpful = 0;
  logs.forEach(row=>{
    const mk = (row.created_at||'').slice(0,7);
    if(!byMonth[mk]) byMonth[mk] = { count:0, cost:0, summaryCost:0, unhelpful:0 };
    byMonth[mk].count++;
    byMonth[mk].cost += Number(row.cost_usd)||0;
    byMonth[mk].summaryCost += Number(row.summary_cost_usd)||0;
    if(row.was_unhelpful) byMonth[mk].unhelpful++;
    const uname = row.user_name || 'Unknown';
    byUser[uname] = (byUser[uname]||0) + 1;
    totalCost += Number(row.cost_usd)||0;
    totalSummaryCost += Number(row.summary_cost_usd)||0;
    if(row.was_unhelpful) totalUnhelpful++;
  });
  const monthKeys = Object.keys(byMonth).sort().reverse();
  const monthRows = monthKeys.map(mk=>{
    const m = byMonth[mk];
    return `<tr><td>${mk}</td><td>${m.count}</td><td>$${m.cost.toFixed(4)}</td><td>$${m.summaryCost.toFixed(4)}</td><td>${m.unhelpful}</td></tr>`;
  }).join('');
  const userRows = Object.entries(byUser).sort((a,b)=>b[1]-a[1]).map(([name,count])=>
    `<tr><td>${name}</td><td>${count}</td></tr>`

// A reusable "select multiple from a list" dropdown — a single button that opens a
// searchable, checkbox-driven panel, instead of a plain list of checkboxes that gets
// unwieldy once there are more than a handful of options.
function buildMultiSelect(idPrefix, options, preselectedIds){
  const selected = new Set(preselectedIds||[]);
  const rows = options.map(o=>`
    <label class="ms-option" data-ms-label="${idPrefix}">
      <input type="checkbox" class="ms-check" data-ms-prefix="${idPrefix}" value="${o.id}" ${selected.has(o.id)?'checked':''}> ${o.label}
    </label>`).join('');
  return `
    <div class="ms-dropdown" id="ms-${idPrefix}">
      <button type="button" class="ms-toggle" id="ms-toggle-${idPrefix}">
        <span id="ms-summary-${idPrefix}">${selected.size ? selected.size+' selected' : 'Select users'}</span>
        <span class="ms-caret">▾</span>
      </button>
      <div class="ms-panel" id="ms-panel-${idPrefix}" style="display:none;">
        <input type="text" class="ms-search" id="ms-search-${idPrefix}" placeholder="Filter...">
        <div class="ms-options" id="ms-options-${idPrefix}">${rows}</div>
      </div>
    </div>`;
}
function bindMultiSelect(idPrefix){
  const toggleBtn = document.getElementById(`ms-toggle-${idPrefix}`);
  const panel = document.getElementById(`ms-panel-${idPrefix}`);
  const search = document.getElementById(`ms-search-${idPrefix}`);
  const summary = document.getElementById(`ms-summary-${idPrefix}`);
  if(!toggleBtn || !panel) return;
  panel.addEventListener('click', (e)=> e.stopPropagation());
  toggleBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : '';
    if(!isOpen){
      const closeOnOutside = ()=>{ panel.style.display = 'none'; document.removeEventListener('click', closeOnOutside); };
      setTimeout(()=> document.addEventListener('click', closeOnOutside), 0);
    }
  });
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll(`[data-ms-label="${idPrefix}"]`).forEach(row=>{
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  document.querySelectorAll(`.ms-check[data-ms-prefix="${idPrefix}"]`).forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const count = document.querySelectorAll(`.ms-check[data-ms-prefix="${idPrefix}"]:checked`).length;
      summary.textContent = count ? `${count} selected` : 'Select users';
    });
  });
}
function getMultiSelectValues(idPrefix){
  return Array.from(document.querySelectorAll(`.ms-check[data-ms-prefix="${idPrefix}"]:checked`)).map(el=>el.value);
}

function randomPassword(){

}
