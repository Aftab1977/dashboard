<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImproveID Workspace — Workstream Timeline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root, [data-theme="dark"]{
    --ink:#0D1316;
    --panel:#141B1F;
    --panel-raised:#1B2328;
    --panel-hi:#212A2F;
    --line:#2A353B;
    --line-soft:#1E2830;
    --paper:#EDE8DC;
    --paper-dim:#8F988F;
    --paper-faint:#5B6560;
    --green:#33A85C;
    --green-soft:#132A1C;
    --green-glow:rgba(51,168,92,.38);
    --red:#DD5147;
    --red-soft:#331A17;
    --red-glow:rgba(221,81,71,.4);
    --amber:#E0AC3F;
    --amber-soft:#2E2410;
    --amber-border:rgba(224,172,63,.4);
    --amber-glow:rgba(224,172,63,.35);
    --blocker:#CC5500;
    --blocker-soft:#2E1B0A;
    --blocker-border:rgba(204,85,0,.4);
    --blocker-glow:rgba(204,85,0,.35);
    --card-shadow:none;
    --f-display:'Barlow Condensed',sans-serif;
    --f-body:'Space Grotesk',sans-serif;
    --f-mono:'JetBrains Mono',monospace;
  }
  [data-theme="light"]{
    --ink:#E9EBF2;
    --panel:#FFFFFF;
    --panel-raised:#F7F8FC;
    --panel-hi:#EEF0F7;
    --line:#E3E5EE;
    --line-soft:#ECEDF4;
    --paper:#1D2029;
    --paper-dim:#6B7280;
    --paper-faint:#9CA3AF;
    /* Green & red stay identical to Dark — these are status colors (green = done/
       closed, red = pending/delayed), not decorative, so they don't change per theme. */
    --green:#33A85C;
    --green-soft:#E6F6EC;
    --green-glow:rgba(51,168,92,.22);
    --red:#DD5147;
    --red-soft:#FCEAE8;
    --red-glow:rgba(221,81,71,.22);
    --amber:#0060BF;
    --amber-soft:#E8F1F9;
    --amber-border:rgba(0,96,191,.35);
    --amber-glow:rgba(0,96,191,.3);
    /* Blockers get their own dedicated dark-orange, identical across themes — like
       green/red, this is a status color carrying real meaning, not decoration. */
    --blocker:#CC5500;
    --blocker-soft:#FBEDE3;
    --blocker-border:rgba(204,85,0,.35);
    --blocker-glow:rgba(204,85,0,.3);
    --card-shadow:0 1px 3px rgba(30,35,60,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--f-body);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(51,168,92,.05), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(221,81,71,.05), transparent 35%);
  }
  ::selection{background:var(--amber);color:var(--ink);}
  a{color:inherit;}
  button{font-family:var(--f-body);cursor:pointer;}
  input,select,textarea{font-family:var(--f-body);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }

  /* ---------- layout shell ---------- */
  #app{display:flex;min-height:100vh;}
  .navrail{
    width:76px;flex:0 0 76px;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    padding:18px 0;gap:6px;position:sticky;top:0;height:100vh;
  }
  .navrail .brand{
    width:38px;height:38px;border-radius:8px;
    background:conic-gradient(from 220deg, var(--green), var(--amber), var(--red), var(--green));
    margin-bottom:22px;position:relative;
  }
  .brand::after{content:"";position:absolute;inset:5px;background:var(--panel);border-radius:5px;}
  .navbtn{
    width:52px;height:52px;border-radius:10px;border:1px solid transparent;
    background:transparent;color:var(--paper-dim);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;font-family:var(--f-body);font-weight:600;transition:all .15s ease;
  }
  .navbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .navbtn:hover{color:var(--paper);background:var(--panel-raised);}
  .navbtn.active{color:var(--ink);background:var(--paper);}
  [data-theme="light"] .navbtn.active{color:#fff;background:var(--amber);}
  .navrail .spacer{flex:1;}
  .navbtn.logout{color:var(--red);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:1px solid var(--line);
    background:rgba(20,27,31,.6);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:5;
  }
  .topbar-accent-btn{padding:6px 14px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-border);box-shadow:0 0 10px -4px var(--amber-glow);font-weight:600;}
  .crumb{font-family:var(--f-mono);font-size:12px;color:var(--paper-dim);letter-spacing:.03em;}
  .crumb b{color:var(--paper);font-weight:600;}
  .today-display{font-size:12px;font-weight:600;color:var(--amber);letter-spacing:.03em;padding:6px 14px;border:1px solid var(--amber-border);background:var(--amber-soft);border-radius:14px;box-shadow:0 0 12px -4px var(--amber-glow);text-align:center;line-height:1.3;}
  .today-time{font-size:10px;font-weight:500;color:var(--amber);opacity:.85;letter-spacing:.06em;}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--paper-dim);}
  .who .avatar{
    width:28px;height:28px;border-radius:50%;background:var(--panel-hi);
    display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);
    font-size:11px;color:var(--paper);border:1px solid var(--line);
  }
  /* Light theme: the topbar itself becomes the dominant blue, so everything sitting
     inside it needs to switch to a light-on-blue treatment instead of its normal
     colors — otherwise the blue-on-blue elements (Go Back, the date pill) would
     disappear into the new background. */
  [data-theme="light"] .topbar{background:var(--amber);border-bottom:none;}
  [data-theme="light"] .crumb{color:rgba(255,255,255,.8);}
  [data-theme="light"] .crumb b{color:#fff;}
  [data-theme="light"] .topbar-accent-btn{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);box-shadow:none;}
  [data-theme="light"] .today-display{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);box-shadow:none;}
  [data-theme="light"] .today-time{color:rgba(255,255,255,.85);}
  [data-theme="light"] .who{color:rgba(255,255,255,.9);}
  [data-theme="light"] .who .avatar{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.35);}
  .content{padding:28px;max-width:1240px;width:100%;margin:0 auto;flex:1;}

  /* ---------- typography ---------- */
  h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.01em;}
  .eyebrow{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--paper-faint);margin:0 0 6px;
  }
  .page-title{font-size:38px;line-height:1.05;}
  .section-title{font-size:22px;margin-bottom:14px;}
  .muted{color:var(--paper-dim);}
  .mono{font-family:var(--f-mono);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel-raised);color:var(--paper);
    font-size:13px;font-weight:600;transition:all .15s ease;
  }
  .btn:hover{background:var(--panel-hi);border-color:var(--paper-faint);}
  .btn-primary{background:var(--paper);color:var(--ink);border-color:var(--paper);}
  .btn-primary:hover{background:#fff;}
  [data-theme="light"] .btn-primary{background:var(--amber);color:#fff;border-color:var(--amber);box-shadow:0 2px 8px var(--amber-glow);}
  [data-theme="light"] .btn-primary:hover{background:#2857BB;}
  .btn-danger{background:var(--red-soft);color:var(--red);border-color:rgba(221,81,71,.35);}
  .btn-danger:hover{background:rgba(221,81,71,.22);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--paper-dim);}
  .btn-ghost:hover{color:var(--paper);background:var(--panel-raised);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- cards & grids ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--card-shadow);}
  .grid{display:grid;gap:16px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr;}}

  /* ---------- status pills / badges ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
    font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  }
  .pill-green{background:var(--green-soft);color:var(--green);}
  .pill-red{background:var(--red-soft);color:var(--red);}
  .pill-amber{background:var(--amber-soft);color:var(--amber);}
  .pill-blocker{background:var(--blocker-soft);color:var(--blocker);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .dot.pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .pill-blink{animation:pillBlink 1.6s ease-in-out infinite;}
  @keyframes pillBlink{0%,100%{opacity:1;}50%{opacity:.4;}}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
  .cal-dow{font-size:10px;color:var(--paper-faint);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px;}
  .cal-day{aspect-ratio:1;border-radius:6px;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);border:1px solid var(--line-soft);}
  .cal-day.blank{background:transparent;border:none;}
  .cal-day.weekend{border-style:dashed;}
  .cal-day.weekend:not(.closed):not(.current):not(.future){background:rgba(255,255,255,.025);color:var(--paper-faint);}
  .cal-day.closed{background:rgba(230,159,90,.22);color:#E6A560;border-color:rgba(230,159,90,.45);}
  .cal-day.current{background:rgba(232,214,107,.22);color:#E8D66B;border-color:rgba(232,214,107,.45);font-weight:700;}
  .cal-day.future{background:rgba(126,182,224,.2);color:#7EB6E0;border-color:rgba(126,182,224,.42);}
  .cal-day.free{background:rgba(143,214,158,.18);color:#8FD69E;border-color:rgba(143,214,158,.38);}
  .cal-day.admin-toggle{cursor:pointer;}
  .cal-day.admin-toggle:hover{outline:1px solid var(--paper-dim);outline-offset:1px;}

  /* ---------- portfolio cards ---------- */
  .proj-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
    cursor:pointer;transition:all .15s ease;position:relative;overflow:hidden;box-shadow:var(--card-shadow);
  }
  .proj-card:hover{border-color:var(--paper-faint);transform:translateY(-2px);}
  .proj-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  }
  .proj-card.status-green::before{background:var(--green);box-shadow:0 0 14px var(--green-glow);}
  .proj-card.status-red::before{background:var(--red);box-shadow:0 0 14px var(--red-glow);}
  .proj-card .pname{font-family:var(--f-display);font-size:24px;margin:2px 0 12px;}
  .proj-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--paper-dim);margin-top:14px;}
  .bar-track{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:12px;}
  .bar-fill{height:100%;background:var(--green);border-radius:99px;}
  .bar-fill.red{background:var(--red);}

  /* ---------- hero ---------- */
  .hero{
    border-radius:16px;border:1px solid var(--line);background:var(--panel);
    padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    position:relative;overflow:hidden;flex-wrap:wrap;
  }
  .hero.status-red{border-color:rgba(221,81,71,.4);box-shadow:0 0 0 1px rgba(221,81,71,.12) inset, 0 18px 50px -24px var(--red-glow);}
  .hero.status-green{border-color:rgba(51,168,92,.35);box-shadow:0 0 0 1px rgba(51,168,92,.1) inset, 0 18px 50px -24px var(--green-glow);}
  .hero-metrics{display:flex;gap:36px;flex-wrap:wrap;}
  .metric .eyebrow{margin-bottom:8px;}
  .metric .val{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1;}
  .metric .val.red{color:var(--red);}
  .metric .val.green{color:var(--green);}
  .metric .sub{font-size:11px;color:var(--paper-faint);margin-top:6px;font-family:var(--f-mono);}

  /* ---------- handoff rail (signature element) ---------- */
  .rail-wrap{overflow-x:auto;padding-bottom:6px;}

  .chain-row{display:flex;align-items:center;gap:0;margin:22px 0;min-width:max-content;}
  .chain-label{
    width:150px;flex:0 0 150px;font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);
    padding-right:14px;text-align:right;line-height:1.4;
  }
  .chain-label .tag{display:block;color:var(--paper-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .chain-track{display:flex;align-items:center;}
  .rail-node{
    position:relative;border-radius:9px;border:1.5px solid var(--line);
    background:var(--panel-raised);padding:10px 14px;min-width:96px;max-width:190px;
    display:flex;flex-direction:column;gap:3px;
  }
  .rail-att-badge{position:absolute;top:6px;right:8px;font-size:11px;line-height:1;cursor:default;}
  .rail-node .nt{font-size:12px;font-weight:600;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:162px;}
  .rail-node .nd{font-family:var(--f-mono);font-size:10px;color:var(--paper-dim);}
  .rail-node .nu{font-size:9.5px;color:var(--paper);line-height:1.3;margin-top:1px;}
  .rail-node.green{border-color:var(--green);box-shadow:0 0 0 1px rgba(51,168,92,.15) inset;}
  .rail-node.green .nd{color:var(--green);}
  .rail-node.red{border-color:var(--red);box-shadow:0 0 12px -2px var(--red-glow);}
  .rail-node.red .nd{color:var(--red);}
  .rail-node.amber{border-color:var(--amber);}
  .rail-node.amber .nd{color:var(--amber);}
  .rail-connector{width:26px;height:2px;background:var(--line);position:relative;flex:0 0 26px;}
  .rail-connector::after{
    content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);
    border:4px solid transparent;border-left-color:var(--line);
  }
  .chain-total{
    flex:0 0 auto;margin-left:14px;font-family:var(--f-mono);font-size:11px;color:var(--paper-faint);
    padding-left:14px;border-left:1px solid var(--line-soft);white-space:nowrap;
  }
  .chain-total b{color:var(--paper);font-size:13px;}
  .chain-row.critical .chain-label{color:var(--paper);}
  .chain-row.critical .chain-label .tag{color:var(--amber);}
  .chain-row.critical .chain-total b{color:var(--amber);}

  /* ---------- donut / gauges ---------- */
  .donut-big{
    width:168px;height:168px;border-radius:50%;position:relative;flex:0 0 168px;
  }
  .donut-big .hole{
    position:absolute;inset:16px;background:var(--panel);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .donut-big .hole .pct{font-family:var(--f-mono);font-size:28px;font-weight:700;}
  .donut-big .hole .lbl{font-size:10px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;flex:1;}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--panel-raised);border:1px solid var(--line-soft);}
  .gauge-ring{width:64px;height:64px;border-radius:50%;position:relative;}
  .gauge-ring .hole{position:absolute;inset:8px;background:var(--panel-raised);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:600;}
  .gauge .gname{font-size:12px;font-weight:600;text-align:center;}
  .gauge .gfrac{font-family:var(--f-mono);font-size:10px;color:var(--paper-dim);}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px;}
  thead th{
    text-align:left;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:#fff;background:var(--amber);padding:10px 12px;font-weight:700;border:none;
  }
  thead th:first-child{border-radius:8px 0 0 8px;}
  thead th:last-child{border-radius:0 8px 8px 0;}
  thead tr th:only-child{border-radius:8px;}
  tbody td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover{background:var(--panel-raised);}
  .task-title{font-weight:600;}
  .task-title-link{cursor:pointer;width:fit-content;}
  .task-title-link:hover{text-decoration:underline;color:var(--paper);}
  .task-desc{color:var(--paper-dim);font-size:11px;margin-top:2px;max-width:280px;}
  .date-pair{font-family:var(--f-mono);font-size:11px;}
  .date-pair .orig{color:var(--paper-dim);}
  .date-pair .ext{color:var(--red);text-decoration:none;}
  .date-pair .strike{text-decoration:line-through;color:var(--paper-faint);}

  /* ---------- forms & modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,9,10,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid rgba(30,35,60,.07);border-radius:16px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:26px;
    box-shadow:0 2px 4px rgba(30,35,60,.06), 0 12px 32px rgba(30,35,60,.12);
  }
  .modal h3{font-size:22px;margin-bottom:6px;}
  .modal .modal-sub{color:var(--paper-dim);font-size:12px;margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-faint);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--ink);border:1.5px solid rgba(30,35,60,.1);border-radius:9px;
    padding:10px 13px;color:var(--paper);font-size:13px;transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow);
  }
  .field textarea{resize:vertical;min-height:64px;font-family:var(--f-body);}
  .field input:disabled{opacity:.5;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .hint{font-size:11px;color:var(--paper-faint);margin-top:4px;}
  .credential-box{
    background:var(--ink);border:1px dashed var(--paper-faint);border-radius:9px;padding:14px;
    font-family:var(--f-mono);font-size:13px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;
  }

  /* ---------- login ---------- */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;width:100%;}
  .login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;}
  .login-logo{max-width:264px;max-height:86px;width:auto;height:auto;object-fit:contain;margin:0 auto 18px;display:block;}
  .login-title{font-family:var(--f-display);font-size:30px;margin-bottom:2px;text-align:center;}
  .login-error{color:var(--red);font-size:12px;margin-top:8px;font-family:var(--f-mono);min-height:14px;}

  /* ---------- admin tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 4px;margin-right:18px;background:none;border:none;color:var(--paper-dim);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--paper);border-bottom-color:var(--amber);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--paper-faint);}
  .empty-state .et{font-family:var(--f-display);font-size:20px;color:var(--paper-dim);margin-bottom:6px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters select{background:var(--panel-raised);border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:8px 10px;font-size:12px;font-family:var(--f-body);}

  .stat-strip{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;min-width:130px;box-shadow:var(--card-shadow);}
  .stat-chip .n{font-family:var(--f-mono);font-size:24px;font-weight:700;}
  .stat-chip .l{font-size:10px;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}

  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .lb-row:last-child{border-bottom:none;}
  .lb-name{flex:1;font-size:13px;font-weight:600;}
  .lb-bar{flex:2;height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;}
  .lb-bar span{display:block;height:100%;background:var(--red);}
  .lb-count{font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);width:60px;text-align:right;}

  .icon-btn{background:none;border:none;color:var(--paper-faint);padding:4px;border-radius:5px;}
  .icon-btn:hover{color:var(--paper);background:var(--panel-hi);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .userchip{display:flex;align-items:center;gap:8px;}
  .userchip .initials{width:26px;height:26px;border-radius:50%;background:var(--panel-hi);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;flex:0 0 26px;}
  .banner{
    display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid var(--amber-border);
    color:var(--amber);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:18px;
  }
  .footnote{margin-top:36px;padding-top:16px;border-top:1px solid var(--line-soft);color:var(--paper-faint);font-size:11px;font-family:var(--f-mono);}
  .feature-box:hover{border-color:var(--paper-faint);}
  .heading-card{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:12px;}
  .heading-card:first-child{border-top:none;padding-top:0;margin-top:0;}
  .heading-name{font-family:var(--f-display);font-size:16px;font-weight:600;}
  .hcontent.collapsed{display:none;}
  .collapse-arrow{display:inline-block;color:var(--paper-faint);font-size:11px;width:10px;transition:transform .15s;}
  .drag-handle{cursor:grab;color:var(--paper-faint);font-size:16px;line-height:1;user-select:none;}
  .drag-handle:active{cursor:grabbing;}
  .drag-node.dragging{opacity:.4;}
  .drag-node.drag-over{outline:2px dashed var(--amber);outline-offset:2px;}
  .ms-dropdown{position:relative;width:100%;}
  .ms-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--panel-raised);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--paper);font-size:13px;font-family:var(--f-body);cursor:pointer;}
  .ms-toggle:hover{border-color:var(--paper-faint);}
  .ms-caret{color:var(--paper-faint);font-size:11px;}
  .ms-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:8px;}
  .ms-search{width:100%;box-sizing:border-box;background:var(--panel-raised);border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px;color:var(--paper);font-size:12px;margin-bottom:6px;}
  .ms-options{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .ms-option{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;padding:6px 8px;border-radius:6px;cursor:pointer;}
  .ms-option:hover{background:var(--panel-hi);}
  .access-tree-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;padding:4px 0;}
  .access-toggle-arrow{cursor:pointer;color:var(--paper-faint);font-size:11px;width:14px;display:inline-block;user-select:none;}
  .access-children{overflow:hidden;}
  .access-children.collapsed{display:none;}
  .access-node.access-search-hidden{display:none;}

  /* ---------- Workspace CoPilot: floating bubble + slide-out panel ---------- */
  .ai-bubble{
    position:fixed;bottom:24px;right:24px;z-index:80;width:70px;height:70px;
    border-radius:50%;background:var(--panel);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .15s ease;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  .ai-bubble:hover, .ai-bubble.ai-bubble-hover-active{transform:scale(1.06);}
  .ai-bubble-label:hover, .ai-bubble-label.ai-bubble-hover-active{transform:scale(1.06);}
  .ai-bubble-label{
    position:fixed;bottom:104px;right:24px;z-index:80;
    background:var(--panel);border:1.5px solid var(--line);border-radius:8px;
    padding:7px 14px;font-size:13px;font-weight:600;color:var(--paper);
    box-shadow:0 3px 10px rgba(0,0,0,.12);white-space:nowrap;cursor:pointer;
  }
  .ai-icon-glow path, .ai-icon-glow circle{stroke:#4FC3F7;fill:none;}
  .ai-icon-glow .node{fill:#4FC3F7;stroke:none;}
  .ai-icon-glow .trace{stroke-width:2.2;}
  .ai-icon-glow.idle .node{animation:aiIdlePulse 3s ease-in-out infinite;}
  .ai-icon-glow.idle .trace{animation:aiIdleGlow 3s ease-in-out infinite;}
  @keyframes aiIdlePulse{0%,100%{opacity:.55;filter:drop-shadow(0 0 1px #4FC3F7);}50%{opacity:1;filter:drop-shadow(0 0 4px #4FC3F7);}}
  @keyframes aiIdleGlow{0%,100%{opacity:.4;}50%{opacity:.85;}}
  .ai-icon-glow.thinking .node{animation:aiThinkPulse 1.4s ease-in-out infinite;}
  .ai-icon-glow.thinking .trace{animation:aiThinkGlow 1.4s ease-in-out infinite;opacity:.5;}
  @keyframes aiThinkPulse{0%,100%{opacity:.3;filter:drop-shadow(0 0 1px #4FC3F7);}50%{opacity:1;filter:drop-shadow(0 0 6px #7FDBFF) drop-shadow(0 0 12px #4FC3F7);}}
  @keyframes aiThinkGlow{0%,100%{opacity:.3;}50%{opacity:.9;}}

  .ai-panel{
    position:fixed;bottom:92px;right:24px;width:50vw;max-width:640px;min-width:320px;
    z-index:81;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 32px rgba(0,0,0,.2);
    display:flex;flex-direction:column;
    transform:translateY(16px) scale(.97);opacity:0;pointer-events:none;
    transition:transform .18s ease, opacity .18s ease;
  }
  .ai-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .ai-panel.minimized .ai-panel-messages, .ai-panel.minimized .ai-panel-input-row{display:none;}
  .ai-panel.minimized{width:25vw;max-width:320px;min-width:220px;}
  .ai-panel-header{display:flex;align-items:center;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .ai-panel.minimized .ai-panel-header{border-bottom:none;}
  .ai-panel-title{font-family:var(--f-display);font-size:16px;color:var(--paper);flex:1;}
  .ai-panel-btn{cursor:pointer;color:var(--paper-faint);font-size:14px;background:none;border:none;padding:5px 8px;border-radius:5px;}
  .ai-panel-btn:hover{background:var(--panel-raised);color:var(--paper);}
  .ai-panel-close{cursor:pointer;color:var(--paper-faint);font-size:18px;background:none;border:none;padding:4px 6px;}
  .ai-panel-context{font-size:11px;color:var(--paper-faint);font-family:var(--f-mono);padding:8px 18px;background:var(--panel-raised);border-bottom:1px solid var(--line);}
  .ai-panel-messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
  .ai-msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;}
  .ai-msg.user{align-self:flex-end;background:var(--amber);color:#fff;}
  .ai-msg.assistant{align-self:flex-start;background:var(--panel-raised);color:var(--paper);border:1px solid var(--line);}
  .ai-msg.error{align-self:flex-start;background:var(--red-soft,rgba(220,60,60,.1));color:var(--red);border:1px solid var(--red-border,rgba(220,60,60,.3));}
  .ai-msg-time{font-size:10px;opacity:.65;margin-top:4px;font-family:var(--f-mono);}
  .ai-msg.user .ai-msg-time{text-align:right;}
  .ai-msg-table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px;}
  .ai-est-flag{background:rgba(230,145,56,.16);color:#B8541A;border:1px solid rgba(230,145,56,.4);border-radius:5px;padding:1px 6px;font-weight:600;cursor:help;white-space:nowrap;}
  .toggle-switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
  .toggle-switch input{opacity:0;width:0;height:0;}
  .toggle-track{position:absolute;inset:0;background:var(--line);border-radius:24px;cursor:pointer;transition:background .15s ease;}
  .toggle-track::before{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle-switch input:checked + .toggle-track{background:var(--amber);}
  .toggle-switch input:checked + .toggle-track::before{transform:translateX(18px);}
  .ai-msg-table th, .ai-msg-table td{border:1px solid var(--line);padding:6px 10px;text-align:left;}
  .ai-msg-table th{background:var(--panel);font-weight:600;color:var(--paper);}
  .ai-msg:has(.ai-msg-table){max-width:96%;}
  .ai-panel-empty{color:var(--paper-faint);font-size:13px;text-align:center;margin-top:40px;padding:0 20px;}
  .ai-panel-input-row{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);}
  .ai-panel-input{flex:1;background:var(--panel-raised);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--paper);font-size:13px;resize:none;font-family:var(--f-body);}
  .ai-panel-send{background:var(--amber);color:#fff;border:none;border-radius:8px;padding:0 16px;cursor:pointer;font-weight:600;font-size:13px;}
  .ai-panel-send:disabled{opacity:.5;cursor:default;}
  .sumcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:520px;}
  .sumcal-dow{text-align:center;font-size:11px;color:var(--paper-faint);font-family:var(--f-mono);padding-bottom:4px;}
  .sumcal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid #555555;border-radius:8px;font-size:13px;color:var(--paper-faint);}
  .sumcal-cell.sumcal-has-summary{cursor:pointer;color:var(--paper);background:var(--amber-soft);border-color:var(--amber-border);font-weight:600;}
  .sumcal-cell.sumcal-has-summary:hover{outline:1px solid var(--amber);}
  .sumcal-cell.sumcal-blank{border:none;}
  .content-item{background:var(--panel-raised);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .ci-title{font-size:12px;font-weight:600;color:var(--paper);margin-bottom:3px;}
  .ci-text{font-size:13px;color:var(--paper-dim);line-height:1.6;}
  .ci-link{font-size:13px;color:var(--amber);text-decoration:none;}
  .ci-link:hover{text-decoration:underline;}
  /* Shared grid/table convention, redesigned: rounded, colored pill headers and
     row labels (our own theme color, not a hard black border), real spacing
     between every cell instead of a collapsed grid, and zebra-striped rows for
     readability at a glance. Reused by both Attendance and Appraisal so both
     get this treatment consistently from one shared set of rules. */
  .att-wrap{overflow-x:auto;padding:2px;}
  .att-table{border-collapse:separate;border-spacing:4px 6px;font-family:var(--f-mono);font-size:11px;width:100%;table-layout:auto;}
  .att-table th{background:var(--amber);color:#fff;font-weight:700;padding:10px 14px;border-radius:8px;white-space:nowrap;}
  .att-table td{padding:9px 14px;text-align:center;background:var(--panel-raised);color:var(--paper);font-family:var(--f-mono);font-size:11px;border-radius:8px;}
  .att-table tbody tr:nth-child(even) td{background:var(--panel-hi);}
  .att-name-col{position:sticky;left:0;z-index:2;text-align:center;font-family:var(--f-mono);font-size:11px;white-space:nowrap;}
  .att-daycol{min-width:26px;text-align:center;padding:10px 4px;}
  .att-weekend-col{background:var(--amber-glow) !important;}
  .att-name{position:sticky;left:0;z-index:1;background:var(--amber) !important;color:#fff !important;text-align:center;font-weight:700;white-space:nowrap;border-radius:8px;}
  .att-cell{width:26px;height:28px;text-align:center;}
  .att-cell.att-weekend{background:rgba(0,96,191,.07) !important;}
  .att-cell.att-clickable{cursor:pointer;}
  .att-cell.att-clickable:hover{outline:1.5px solid var(--amber);outline-offset:-1.5px;}
  .appraisal-cell{text-align:center;font-family:var(--f-mono);font-size:11px;}
  .appraisal-overdue{color:var(--red) !important;font-weight:600;}
  tr[data-appraisal-row]:hover .att-name{background:var(--amber) !important;filter:brightness(1.1);}
  tr[data-appraisal-row]:hover .appraisal-cell{background:var(--amber-soft) !important;}

function nowDateTimeIST(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;

function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }
// "5th Aug 2026" style, specifically for the task attendance summary on the Handoff Rail.
function fmtDateOrdinal(iso){
  const d = new Date(iso+'T00:00:00');
  const day = d.getDate();
  const suffix = (day%10===1 && day!==11) ? 'st' : (day%10===2 && day!==12) ? 'nd' : (day%10===3 && day!==13) ? 'rd' : 'th';
  const month = d.toLocaleDateString('en-US',{month:'short'});
  return `${day}${suffix} ${month} ${d.getFullYear()}`;
}
function isWeekendISO(iso){ const dow = new Date(iso+'T00:00:00').getDay(); return dow===0 || dow===6; }

// ---- Reminders ----
// A reminder's "due" moment is its date + time combined, always read/written as
// IST to stay consistent with the rest of the app's date handling.
function reminderDueDateObj(dateISO, time){
  const [h,m] = (time||'00:00').split(':').map(Number);
  const d = new Date(dateISO+'T00:00:00');
  d.setHours(h, m, 0, 0);
  return d;
}
function nowIST(){
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  return new Date(Date.now() + IST_OFFSET_MS);
}
const REMINDER_REPEAT_LABELS = {
  never:'Never', hourly:'Hourly', daily:'Daily', weekdays:'Weekdays', weekends:'Weekends',
  weekly:'Weekly', fortnightly:'Fortnightly', monthly:'Monthly', every3months:'Every 3 months',
  every6months:'Every 6 months', yearly:'Yearly',
};
// Computes the next occurrence AFTER the given date/time, based on the reminder's
// own original date+time (not "now") — same behavior as Apple Reminders, where a
// weekly reminder set for Monday 9am stays anchored to Monday 9am indefinitely,
// rather than drifting based on when someone happened to act on it.
function computeNextOccurrence(dateISO, time, repeat){
  const base = reminderDueDateObj(dateISO, time);
  const advance = (fn)=>{ const d=new Date(base); fn(d); return d; };
  const advanceMonths = (fromDate,n)=>{
    const d = new Date(fromDate);
    const targetMonth = d.getMonth()+n;
    const lastDayOfTargetMonth = new Date(d.getFullYear(), targetMonth+1, 0).getDate();
    d.setDate(Math.min(d.getDate(), lastDayOfTargetMonth));
    d.setMonth(targetMonth);
    return d;
  };
  let next;
  switch(repeat){
    case 'hourly': next = advance(d=>d.setHours(d.getHours()+1)); break;
    case 'daily': next = advance(d=>d.setDate(d.getDate()+1)); break;
    case 'weekly': next = advance(d=>d.setDate(d.getDate()+7)); break;
    case 'fortnightly': next = advance(d=>d.setDate(d.getDate()+14)); break;
    case 'monthly': next = advanceMonths(base,1); break;
    case 'every3months': next = advanceMonths(base,3); break;
    case 'every6months': next = advanceMonths(base,6); break;
    case 'yearly': next = advance(d=>d.setFullYear(d.getFullYear()+1)); break;
    case 'weekdays': {
      next = advance(d=>d.setDate(d.getDate()+1));
      while(next.getDay()===0 || next.getDay()===6) next.setDate(next.getDate()+1);
      break;
    }
    case 'weekends': {
      next = advance(d=>d.setDate(d.getDate()+1));
      while(!(next.getDay()===0 || next.getDay()===6)) next.setDate(next.getDate()+1);
      break;
    }
    default: return null; // 'never' has no next occurrence
  }
  const dISO = `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
  const tStr = `${String(next.getHours()).padStart(2,'0')}:${String(next.getMinutes()).padStart(2,'0')}`;
  return { dateISO: dISO, time: tStr };
}
function reminderDisplayDateTime(r){
  return { date: fmtDate(r.dateISO), time: r.time };
}
// Inclusive day span between two dates, and how many of those days fall on a Sat/Sun —
// purely informational, doesn't feed into any delay or duration math.
function calendarVsWorkingDays(start, end){
  if(!start || !end || end < start) return null;
  let calendarDays = 0, weekendDays = 0;
  let cur = new Date(start+'T00:00:00');
  const endD = new Date(end+'T00:00:00');
  while(cur<=endD){
    calendarDays++;
    const dow = cur.getDay();
    if(dow===0||dow===6) weekendDays++;
    cur.setDate(cur.getDate()+1);
  }
  return { calendarDays, weekendDays, workingDays: calendarDays-weekendDays };
}
function dateRangeHint(start, end){
  const r = calendarVsWorkingDays(start, end);
  if(!r) return '';
  if(r.weekendDays===0) return `${r.calendarDays} calendar day${r.calendarDays===1?'':'s'} · no weekend days in range`;
  return `${r.calendarDays} calendar day${r.calendarDays===1?'':'s'} · ${r.workingDays} working day${r.workingDays===1?'':'s'} · includes ${r.weekendDays} weekend day${r.weekendDays===1?'':'s'}`;
}
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

// A task is delayed the moment either condition happens, and it stays delayed
// permanently after that — even once the task or the whole project is closed:
//  1) it was ever pushed back with the Extend Date option, or
//  2) today (IST) has passed its original agreed deadline while it's still open —
//     this is live, no button needed, and once it's happened it stays true even
//     after the task later closes (admins can always amend the record via "Amend timeline").
function isTaskDelayed(t){
  if(t.deadlineDisabled) return false;
  if(t.extended) return true;
  if(t.status==='closed'){
    return !!(t.closedDate && t.originalEndDate && t.closedDate > t.originalEndDate);
  }
  return !!(t.originalEndDate && todayISO() > t.originalEndDate);
}
// The date a task's current duration should be measured against: its agreed/extended
// end date, but if it's still open and that date has already passed, the gap keeps
// growing with each day (today, IST) until it's closed or extended — then it freezes.
function effectiveEndDate(t){
  if(!t.endDate) return t.endDate;
  if(t.status==='closed'){
    return (t.closedDate && t.closedDate > t.endDate) ? t.closedDate : t.endDate;
  }
  const today = todayISO();
  return (today > t.endDate) ? today : t.endDate;
}

function blockedTeamsForProject(projectId){
  const ids = new Set();
  projectTasks(projectId).forEach(t=>{ if(t.blockedByTeamId) ids.add(t.blockedByTeamId); });
  return Array.from(ids).map(id => (state.teams.find(tm=>tm.id===id) || {}).name || 'Unknown team');
}
// Same as above, but paired with the reason given for each blocked task — used to
// build a hover tooltip so people can see WHY without opening the task.
function blockedDetailForProject(projectId){
  return projectTasks(projectId)
    .filter(t=>t.blockedByTeamId)
    .map(t=>{
      const blockerName = t.blockedByUserId ? entityName('user', t.blockedByUserId) : null;
      return `${entityName(t.assignedType,t.assignedId)}${blockerName?' (blocked by '+blockerName+')':''}: ${t.blockerReason || 'no reason given'}`;
    })
    .join(' | ');
}

// Which teams/individuals actually have a delayed task in this project — used to
// show "DELAYED 5D BY <who>" so it's obvious at a glance who to go ask.
function delayResponsibleNames(projectId){
  const names = new Set();
  projectTasks(projectId).forEach(t=>{ if(isTaskDelayed(t)) names.add(entityName(t.assignedType,t.assignedId)); });
  return Array.from(names);
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('storage timeout')), ms))
  ]);
}

function isValidState(s){
  return s && Array.isArray(s.users) && Array.isArray(s.teams) && Array.isArray(s.projects) && Array.isArray(s.tasks) && s.users.length > 0;
}
// A rough measure of "how much real content is in here" — used to decide whether a
// legacy storage bucket has more genuine data than what's currently active, without
// needing to understand exactly what changed.
function stateRichness(s){
  if(!isValidState(s)) return -1;
  return s.users.length + s.teams.length + s.projects.length + s.tasks.length;
}

  // One-time rename: "FAI — Frequently Asked Information" -> "Frequently Asked
  // Information". Same care as the Workstreams rename — only touches it if it's
  // still exactly the old default name, leaving any deliberate admin customization alone.
  if(!s._faiModuleRenamed){
    const faiNode = s.featureNodes.find(n=>n.id==='feat_fai');
    if(faiNode && faiNode.name==='FAI — Frequently Asked Information') faiNode.name = 'Frequently Asked Information';
    s._faiModuleRenamed = true;
  }
  // Dashboard widgets are personal to each person now — their own order, their own
  // on/off choices — not a single shared arrangement for everyone. Reconciled on
  // every load rather than gated by a one-time flag, so a brand new user always
  // starts with sensible defaults, and if the widget set itself grows later, any
  // newly-added widget gets appended for people who haven't seen it yet, without
  // disturbing whatever they've already arranged.
  const knownWidgetIds = new Set(DEFAULT_DASHBOARD_WIDGET_ORDER);
  (s.users || []).forEach(u=>{
    if(!Array.isArray(u.dashboardWidgetOrder)){
      u.dashboardWidgetOrder = DEFAULT_DASHBOARD_WIDGET_ORDER.slice();
    } else {
      u.dashboardWidgetOrder = u.dashboardWidgetOrder.filter(id=>knownWidgetIds.has(id));
      DEFAULT_DASHBOARD_WIDGET_ORDER.forEach(id=>{
        if(!u.dashboardWidgetOrder.includes(id)){
          u.dashboardWidgetOrder.push(id);
          // A genuinely new widget this person hasn't seen before — default it to
          // on, same as anyone else's default. Only for widgets newly appended
          // here, never re-enabling something they'd already seen and turned off.
          if(Array.isArray(u.dashboardWidgetsEnabled) && !u.dashboardWidgetsEnabled.includes(id)){
            u.dashboardWidgetsEnabled.push(id);
          }
        }
      });
    }
    if(!Array.isArray(u.dashboardWidgetsEnabled)){
      u.dashboardWidgetsEnabled = DEFAULT_DASHBOARD_WIDGET_ORDER.slice();
    }
  });
  // Give everyone the new Summary module specifically — the general Access grandfather
  // migration below only ever runs once, so a brand new module added afterward would
  // otherwise be invisible to everyone until an admin manually ticks it.
  if(!s._summaryModuleGranted && Array.isArray(s.users)){
    if(!s.userAccess) s.userAccess = {};
    s.users.forEach(u=>{
      if(u.role==='admin') return;
      if(!s.userAccess[u.id]) s.userAccess[u.id] = [];
      if(!s.userAccess[u.id].includes('feat_summary')) s.userAccess[u.id].push('feat_summary');
    });
    s._summaryModuleGranted = true;
  }
  if(!s.dailySnapshots || typeof s.dailySnapshots !== 'object' || Array.isArray(s.dailySnapshots)) s.dailySnapshots = {};
  if(!s.dailySummaries || typeof s.dailySummaries !== 'object' || Array.isArray(s.dailySummaries)) s.dailySummaries = {};
  if(!s.weeklySummaries || typeof s.weeklySummaries !== 'object' || Array.isArray(s.weeklySummaries)) s.weeklySummaries = {};
  // One-time backfill: earlier daily/weekly summaries were generated before the fix
  // that lets a workstream be labeled "Completed" once every task in it is closed —
  // before that fix, a fully-closed workstream still showed "On Agreed timeline".
  // Recomputed here from each entry's own stored task-count line (e.g. "1 of 1 tasks
  // closed"), the same source of truth the original label came from — not guessed,
  // not just overwritten by hand.
  if(!s._summaryClosedStatusBackfilled){
    function correctSummaryStatuses(summaryMap){
      Object.values(summaryMap || {}).forEach(entry=>{
        (entry.workstreams || []).forEach(w=>{
          const line = (w.taskStatusLines || [])[0] || '';
          const m = line.match(/^(\d+) of (\d+) tasks closed$/);
          if(m){
            const closedCount = Number(m[1]), totalCount = Number(m[2]);
            if(totalCount>0 && closedCount===totalCount && w.status !== 'Completed — all tasks closed'){
              w.status = 'Completed — all tasks closed';
            }
          }
        });
      });
    }
    correctSummaryStatuses(s.dailySummaries);
    correctSummaryStatuses(s.weeklySummaries);
    s._summaryClosedStatusBackfilled = true;
  }
  // One-time reorder: Summary - Daily & Weekly moves after Active Assignments, so
  // Focus Area reads Workstream, Active Assignments, then Summary. Existing accounts
  // already have this node stored with its old order value — updating the
  // definitions above only affects brand new installs, so this corrects what's
  // already saved for everyone else.
  if(!s._summaryModuleReordered){
    const summaryNode = s.featureNodes.find(n=>n.id==='feat_summary');
    if(summaryNode) summaryNode.order = 2.5;
    s._summaryModuleReordered = true;
  }
  if(!s.summaryShownLog || typeof s.summaryShownLog !== 'object' || Array.isArray(s.summaryShownLog)) s.summaryShownLog = {};
  if(!Array.isArray(s.reminders)) s.reminders = [];
  if(!Array.isArray(s.roles)) s.roles = [];
  // One-time migration: Job Title used to be a dropdown referencing a managed
  // list (s.roles); it's now a plain text field on the user directly. Resolve
  // any existing roleTitleId to its real name before it becomes orphaned, so
  // nobody's already-entered job title is silently lost in the switch.
  if(!s._jobTitleMigratedToText){
    const roleNameById = {};
    s.roles.forEach(r=>{ roleNameById[r.id] = r.name; });
    (s.users||[]).forEach(u=>{
      if(u.roleTitleId && !u.jobTitle){
        u.jobTitle = roleNameById[u.roleTitleId] || '';
      }
      delete u.roleTitleId;
    });
    s._jobTitleMigratedToText = true;
  }
  if(!s.attendance || typeof s.attendance !== 'object' || Array.isArray(s.attendance)) s.attendance = {};
  if(!s.appraisal || typeof s.appraisal !== 'object' || Array.isArray(s.appraisal)) s.appraisal = {};
  if(!s.settings || typeof s.settings !== 'object') s.settings = {};
  if(typeof s.settings.maxUploadMB !== 'number') s.settings.maxUploadMB = 250;
  if(typeof s.settings.aiCopilotEnabled !== 'boolean') s.settings.aiCopilotEnabled = true;
  if(!Array.isArray(s.settings.dashboardWidgetOrder)) s.settings.dashboardWidgetOrder = DEFAULT_DASHBOARD_WIDGET_ORDER.slice();
  else {
    // Keep this in sync if the widget set itself ever changes — add any new
    // widget IDs at the end, drop any that no longer exist, without disturbing
    // the order of everything else someone may have already rearranged.
    const known = new Set(DEFAULT_DASHBOARD_WIDGET_ORDER);
    s.settings.dashboardWidgetOrder = s.settings.dashboardWidgetOrder.filter(id=>known.has(id));
    DEFAULT_DASHBOARD_WIDGET_ORDER.forEach(id=>{ if(!s.settings.dashboardWidgetOrder.includes(id)) s.settings.dashboardWidgetOrder.push(id); });
  }
  if(!s.userAccess || typeof s.userAccess !== 'object' || Array.isArray(s.userAccess)) s.userAccess = {};
  if(Array.isArray(s.projects)) s.projects.forEach(p=>{ if(!Array.isArray(p.contentItems)) p.contentItems = []; });
  // One-time only: the Access feature didn't exist before, so nobody had any grants yet.
  // Give every current non-admin user access to everything that exists right now, so
  // their visibility doesn't collapse to nothing the moment this ships. Anything
  // created after this point still defaults to hidden for everyone, as intended.
  if(!s._userAccessGrandfathered && Array.isArray(s.users) && Array.isArray(s.featureNodes)){
    const allNodeIds = s.featureNodes.map(n=>n.id);
    s.users.forEach(u=>{
      if(u.role!=='admin' && !s.userAccess[u.id]) s.userAccess[u.id] = allNodeIds.slice();
    });
    s._userAccessGrandfathered = true;
  }
  // Tasks saved before the per-task checklist toggle existed relied entirely on the
  // workstream's own setting — carry that over as their starting value so closing
  // behavior doesn't silently change for anything already in progress.
  if(Array.isArray(s.tasks) && Array.isArray(s.projects)){
    s.tasks.forEach(t=>{
      if(typeof t.checklistRequired !== 'boolean'){
        const proj = s.projects.find(p=>p.id===t.projectId);
        t.checklistRequired = !!(proj && proj.requireChecklist);
      }
    });
  }
  return s;
}

// Manually triggered from Admin — lets the admin explicitly check the old "personal"
// storage bucket for data stranded there by an earlier version of this app, and choose
// whether to load it in. This never runs silently; the admin always sees the comparison
// and decides.
async function checkForLegacyData(){
  const btn = document.getElementById('recoverLegacyBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
  let legacyState = null;
  try{
    const legacyRes = await withTimeout(window.storage.get(STORAGE_KEY, false), 5000);
    legacyState = legacyRes && legacyRes.value ? JSON.parse(legacyRes.value) : null;
  }catch(e){ legacyState = null; }
  if(btn){ btn.disabled = false; btn.textContent = 'Check for legacy data'; }

  if(!isValidState(legacyState)){
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-backdrop" data-backdrop>
        <div class="modal">
          <h3>No legacy data found</h3>
          <div class="modal-sub">Nothing usable was found in the older storage location.</div>
          <div class="modal-actions"><button class="btn btn-primary" data-close>OK</button></div>
        </div>
      </div>`;
    bindModalClose();
    return;
  }

  const currentCounts = `${state.users.length} users, ${state.teams.length} teams, ${state.projects.length} workstreams, ${state.tasks.length} tasks`;
  const legacyCounts = `${legacyState.users.length} users, ${legacyState.teams.length} teams, ${legacyState.projects.length} workstreams, ${legacyState.tasks.length} tasks`;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Legacy data found</h3>
        <div class="modal-sub">Compare before deciding — loading legacy data replaces what's currently active.</div>
        <div class="field"><label>Currently active</label><div class="hint">${currentCounts}</div></div>
        <div class="field"><label>Found in legacy storage</label><div class="hint">${legacyCounts}</div></div>
        <div class="hint">This does not merge the two — it replaces the active data with the legacy set. If you need both combined, tell me what's in each and I can help reconcile it manually.</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-danger" id="loadLegacyBtn">Load legacy data instead</button>
        </div>
      </div>
    </div>`;
  bindModalClose();
  document.getElementById('loadLegacyBtn').addEventListener('click', async ()=>{
    state = normalizeState(legacyState);
    await persist();
    closeModal();
    render();
  });
}

// Synchronous, instant setup so the UI never has to wait on storage to show something usable.
function loadAllInstant(){
  state = seedState();
  session = { userId:null };
  ui.view = 'login';
}

// Best-effort background reconciliation with any previously saved data. Runs after the first
// render, with a short budget, and only touches the UI if the person hasn't started using it yet.
async function reconcileWithStorage(){
  if(!HAS_STORAGE) return;
  const stillOnFreshLogin = ()=> ui.view==='login' && !session.userId;
  let stateFetchFailed = false;

  try{
    const [stateSettled, sessionSettled] = await withTimeout(Promise.allSettled([
      storageAdapter.get(STORAGE_KEY),
      (sessionAdapter ? sessionAdapter.get(SESSION_KEY) : Promise.resolve(null)),
    ]), 4000);

    let stateRes = null;
    if(stateSettled.status === 'fulfilled'){
      stateRes = stateSettled.value;
    } else {
      // The fetch itself failed (timeout, network, RLS, anything) — this is NOT the
      // same thing as "nothing has ever been saved here." Treating a failed fetch as
      // "empty" is exactly what let this app overwrite real Supabase data with fresh
      // seed data in the past. From here on, a failed fetch always means "we don't
      // know what's there" — never "there's nothing there."
      stateFetchFailed = true;
      console.error('Fetching saved state failed:', stateSettled.reason);
    }
    const sessionRes = (sessionSettled && sessionSettled.status === 'fulfilled') ? sessionSettled.value : null;

    let parsedState = stateRes && stateRes.value ? JSON.parse(stateRes.value) : null;
    const parsedSession = sessionRes && sessionRes.value ? JSON.parse(sessionRes.value) : null;

    // One-time migration: earlier versions of this app saved the shared app data under
    // Claude's "personal" storage bucket instead of "shared". Compare RICHNESS, not just
    // validity — a brief window existed where the new shared bucket could have been
    // seeded with fresh demo data before this migration existed, which would otherwise
    // permanently mask real legacy data sitting in the old bucket.
    if(HAS_CLAUDE_STORAGE && !supaClient){
      try{
        const legacyRes = await withTimeout(window.storage.get(STORAGE_KEY, false), 4000);
        const legacyState = legacyRes && legacyRes.value ? JSON.parse(legacyRes.value) : null;
        if(isValidState(legacyState) && stateRichness(legacyState) > stateRichness(parsedState)){
          parsedState = legacyState;
        }
      }catch(e){ /* no legacy data to recover, that's fine */ }
    }

    if(isValidState(parsedState) && stillOnFreshLogin()){
      try{
        state = normalizeState(parsedState);
      }catch(normErr){
        // A bug in a migration must never cost real data — fall back to the raw,
        // un-migrated (but real) state rather than silently leaving the stale seed
        // data in memory. Surface it so it's never silently invisible, on whichever
        // screen actually ends up showing (login, if no session to resume; the app
        // shell, if there is).
        console.error('normalizeState failed — using raw saved data as a fallback:', normErr);
        state = parsedState;
        const migrationMsg = 'A data-migration step hit an error and was skipped: ' + describeError(normErr) + '. Your saved data is still intact — this only means the newest features may not show correctly until this is fixed.';
        ui.migrationError = migrationMsg;
        ui.loginError = migrationMsg;
      }
      if(parsedSession && typeof parsedSession==='object' && parsedSession.userId && state.users.find(u=>u.id===parsedSession.userId)){
        session = parsedSession;
        ui.view = 'home';
        try{
          runSummaryEngine();
          checkAndShowSummaryPopup();
        }catch(summaryErr){
          // Never let a bug in the newer Summary feature block the rest of the app
          // from loading and showing real data.
          console.error('Summary engine failed (non-fatal):', summaryErr);
        }
        loadAiConversationHistory(session.userId); // this path (session restored on page load/refresh) was missing this call entirely
      }
      render();
      persist(); // ensures a migrated legacy state gets written into the shared bucket right away
    } else if(!isValidState(parsedState) && !stateFetchFailed){
      // Only safe to treat this as "genuinely nothing saved yet" when the fetch itself
      // definitely succeeded and found no row — never when the fetch failed, since a
      // failure tells us nothing about whether real data exists.
      persist();
    } else if(stateFetchFailed){
      // The fetch failed — do NOT touch Supabase. Show an error and leave whatever is
      // there completely alone; refreshing (once connectivity is fine) will find it.
      const msg = 'Could not load your saved data this time. Nothing was changed or overwritten — refresh to try again.';
      ui.saveError = msg;
      ui.loginError = msg;
      render();
    }
  }catch(e){
    // Storage never responded in time, or something else unexpected failed. The seed
    // data already on screen keeps the app usable, but the person needs to know their
    // real data didn't load — silence here is exactly what made past incidents
    // confusing ("where did my data go?") instead of obviously "still loading/retry".
    console.error('reconcileWithStorage failed:', e);
    const msg = 'Could not load your saved data (' + describeError(e) + '). What you see now may be starter/demo content, not your real data. Try refreshing — if this keeps happening, your data is very likely still safe in Supabase, just not reachable from this page load.';
    ui.saveError = msg;
    ui.loginError = ui.loginError || msg;
    render();
  }
}

function describeError(e){
  if(!e) return 'unknown error';
  if(typeof e === 'string') return e;
  const parts = [e.message, e.details, e.hint, e.code].filter(Boolean);
  return parts.length ? parts.join(' | ') : JSON.stringify(e);
}

// Every persist() call is chained after the previous one, so saves always land in the
// order they were made — rapid successive edits (like adding three headings quickly)
// used to be able to finish out of order over the network, letting an earlier, staler
// write overwrite a later, more complete one. Chaining removes that race entirely.
let persistChain = Promise.resolve();
function persist(){
  persistChain = persistChain.then(async ()=>{
    if(!HAS_STORAGE) return;
    try{
      await storageAdapter.set(STORAGE_KEY, JSON.stringify(state));
      if(ui.saveError){ ui.saveError = null; render(); }
    }
    catch(e){
      const msg = describeError(e);
      console.error('save failed:', msg);
      ui.saveError = msg;
      render();
    }
  });
  return persistChain;
}
async function persistSession(){
  if(!sessionAdapter) return;
  try{ await sessionAdapter.set(SESSION_KEY, JSON.stringify(session)); }
  catch(e){ /* ignore */ }
}

/* ============================== DERIVED LOGIC ============================== */

function currentUser(){ return state.users.find(u=>u.id===session.userId) || null; }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

// null = unrestricted (sees everything). Otherwise an array of project ids the
// current user is allowed to see: admins see everything, viewers see whatever
// the admin assigned them ('all' or a specific list), and regular members only
// see projects where they (or their team) actually have a task assigned.
function accessibleProjectIds(){
  const u = currentUser();
  if(!u) return [];
  if(u.role==='admin') return null;
  if(u.role==='viewer'){
    if(u.viewerProjectIds==='all') return null;
    return Array.isArray(u.viewerProjectIds) ? u.viewerProjectIds : [];
  }
  const ids = new Set();
  state.tasks.forEach(t=>{
    if((t.assignedType==='user' && t.assignedId===u.id) || (t.assignedType==='team' && t.assignedId===u.teamId)){
      ids.add(t.projectId);
    }
    if(t.blockedByUserId===u.id) ids.add(t.projectId);
  });
  state.projects.forEach(p=>{
    if(Array.isArray(p.taggedUserIds) && p.taggedUserIds.includes(u.id)) ids.add(p.id);
  });
  return Array.from(ids);
}
function visibleProjects(){
  const ids = accessibleProjectIds();
  return ids===null ? state.projects : state.projects.filter(p=>ids.includes(p.id));
}
function isProjectFullyClosed(projectId){
  const tasks = projectTasks(projectId);
  return tasks.length>0 && tasks.every(t=>t.status==='closed');
}
function isProjectOnTrack(projectId){
  const tasks = projectTasks(projectId).filter(t=>t.status!=='closed');
  return !tasks.some(t=>isTaskDelayed(t));
}
// For a fully-closed workstream, how many days from its earliest task's start to
// its latest task's close — null if it isn't fully closed or is missing dates.
function closedProjectDurationDays(projectId){
  if(!isProjectFullyClosed(projectId)) return null;
  const tasks = projectTasks(projectId);
  const starts = tasks.map(t=>t.startDate).filter(Boolean).sort();
  const closes = tasks.map(t=>t.closedDate).filter(Boolean).sort();
  if(!starts.length || !closes.length) return null;
  return { days: Math.max(daysBetween(starts[0], closes[closes.length-1]), 0), closedDate: closes[closes.length-1] };
}
function quarterKeyOf(dateIso){
  const [y,m] = dateIso.split('-').map(Number);
  return `${y}-Q${Math.ceil(m/3)}`;
}
function currentAndLastQuarterKeys(todayIso){
  const [y,m] = todayIso.split('-').map(Number);
  const q = Math.ceil(m/3);
  let lastY=y, lastQ=q-1;
  if(lastQ===0){ lastQ=4; lastY=y-1; }
  return { current: `${y}-Q${q}`, last: `${lastY}-Q${lastQ}` };
}
// The full metrics set for the Workstream module widgets — scoped to whatever
// workstreams the current person can actually see, matching the real Workstream
// page, and computed fresh every time this is called, never cached or stale.
function computeWorkstreamWidgetMetrics(){
  const projects = visibleProjects();
  const activeProjects = projects.filter(p=>!isProjectFullyClosed(p.id));
  const onTrackCount = activeProjects.filter(p=>isProjectOnTrack(p.id)).length;
  const onTrackPct = activeProjects.length ? Math.round((onTrackCount/activeProjects.length)*100) : 0;

  const visibleIds = new Set(projects.map(p=>p.id));
  const relevantTasks = state.tasks.filter(t=>visibleIds.has(t.projectId) && t.status!=='closed');
  const overdueCount = relevantTasks.filter(t=>isTaskDelayed(t)).length;
  const blockedCount = relevantTasks.filter(t=>t.blockedByUserId || t.blockedByTeamId).length;

  // Average close-duration, and how it's trending this quarter vs last — based on
  // real closed-workstream data, not an estimate. Gracefully reports when there
  // isn't enough data yet rather than showing a misleading or broken percentage.
  const durations = projects.map(p=>closedProjectDurationDays(p.id)).filter(Boolean);
  const { current: curQ, last: lastQ } = currentAndLastQuarterKeys(todayISO());
  const curQDurations = durations.filter(d=>quarterKeyOf(d.closedDate)===curQ).map(d=>d.days);
  const lastQDurations = durations.filter(d=>quarterKeyOf(d.closedDate)===lastQ).map(d=>d.days);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const curQAvg = avg(curQDurations);
  const lastQAvg = avg(lastQDurations);
  // Never leave these blank — 0 is an honest, real value when there's nothing to
  // average yet, rather than a vague placeholder message.
  let avgDurationLabel = 'Avg: 0 days';
  let quarterTrendLabel = '0% vs Last Quarter';
  let quarterTrendIsImprovement = null;
  if(curQAvg!=null){
    avgDurationLabel = `Avg: ${Math.round(curQAvg)} days`;
    if(lastQAvg!=null && lastQAvg>0){
      const pctChange = Math.round(((curQAvg-lastQAvg)/lastQAvg)*100);
      quarterTrendIsImprovement = pctChange<=0; // faster (fewer days) is the improvement
      quarterTrendLabel = `${pctChange<=0?'↓':'↑'} ${Math.abs(pctChange)}% vs Last Quarter`;
    }
  }

  return {
    activeCount: activeProjects.length,
    onTrackCount, onTrackPct,
    overdueCount, blockedCount,
    avgDurationLabel, quarterTrendLabel, quarterTrendIsImprovement,
  };
}

// Today's Attendance widget — reuses the exact same "who counts as an employee"
// scope (state.users, excluding viewers) and the exact same Weekly Off definition
// (isWeekendISO) the real Attendance page itself already uses, rather than
// inventing separate rules that could quietly drift out of sync with it. Only
// Leave and Holiday count as absent here — WFH still counts as present, since
// someone working from home is still working, not away.
function computeTodaysAttendanceWidget(){
  const todayIso = todayISO();
  if(isWeekendISO(todayIso)) return { isWeeklyOff: true, pct: null, totalEmployees: 0, presentCount: 0, onLeave: [], onHoliday: [] };
  const employees = state.users.filter(u=>u.role!=='viewer');
  if(!employees.length) return { isWeeklyOff: false, pct: null, totalEmployees: 0, presentCount: 0, onLeave: [], onHoliday: [] };
  const onLeave = [], onHoliday = [];
  employees.forEach(u=>{
    const rec = getAttendance(u.id, todayIso);
    if(rec==='L') onLeave.push(u.name);
    else if(rec==='H') onHoliday.push(u.name);
  });
  const presentCount = employees.length - onLeave.length - onHoliday.length;
  const pct = Math.round((presentCount / employees.length) * 100);
  return { isWeeklyOff:false, pct, totalEmployees: employees.length, presentCount, onLeave, onHoliday };
}

// Team Capacity widget — computed independently from activeAssignmentsData()
// rather than reusing it directly, because that function also restricts a regular
// Member to seeing only their own row (appropriate for a page showing everyone's
// detailed task list, not appropriate here) — an aggregate count of how many
// people are occupied vs free isn't the same privacy concern as seeing someone
// else's individual assignments. Still respects the same workstream-visibility
// scope (accessibleProjectIds) as every other widget, and the same "openCount"
// definition of occupied the real Active Assignments page uses.
// HODs are deliberately excluded: they aren't usually assigned tasks directly, so
// counting them would make everyone assume they have spare capacity when they're
// actually busy managing — the opposite of what this widget is for.
function computeTeamCapacityWidget(){
  const accessIds = accessibleProjectIds();
  const scopedTasks = accessIds===null ? state.tasks : state.tasks.filter(t=>accessIds.includes(t.projectId));
  const staff = state.users.filter(u=>u.role==='member');
  const freeNames = [], occupiedNames = [];
  staff.forEach(u=>{
    const openCount = scopedTasks.filter(t=>
      t.status!=='closed' && ((t.assignedType==='user' && t.assignedId===u.id) || (t.assignedType==='team' && t.assignedId===u.teamId))
    ).length;
    (openCount===0 ? freeNames : occupiedNames).push(u.name);
  });
  return { total: staff.length, freeCount: freeNames.length, occupiedCount: occupiedNames.length, freeNames, occupiedNames };
}

// A single widget card, matching the reference layout: a large icon on the left,
// vertically centered against a text column on the right (label, number, trend),
// the whole composition centered together rather than stacked top-to-bottom.
function widgetBorder(id){
  const c = DASHBOARD_WIDGET_COLORS[id];
  if(!c || !c.startsWith('#')) return 'var(--line)';
  // A visibly-colored border in the widget's own color, stronger than the
  // background tint so it reads clearly, complementing the glow around it.
  return `${c}80`;

function moduleSourceLabel(id){

// Once a task is closed, only admins can open/edit it again — everyone else loses
// access at that point, even if it was originally assigned to them.
function canEditTask(t){
  const cu = currentUser();
  if(isAdmin()) return true;
  if(!cu || cu.role==='viewer') return false;
  const isAssignedToMe = (t.assignedType==='user' && t.assignedId===cu.id) || (t.assignedType==='team' && t.assignedId===cu.teamId);
  return isAssignedToMe && t.status!=='closed';
}

function projectTasks(projectId){ return state.tasks.filter(t=>t.projectId===projectId); }

function taskDuration(t, useCurrent){
  const end = useCurrent ? effectiveEndDate(t) : t.originalEndDate;
  if(!t.startDate || !end) return 0;
  return Math.max(daysBetween(t.startDate, end), 0);
}

function buildChains(tasks){
  const roots = tasks.filter(t=>!t.predecessorId);
  return roots.map(root=>{
    const chain = [root];
    let cur = root;
    while(true){
      const next = tasks.find(t=>t.predecessorId===cur.id);
      if(!next) break;
      chain.push(next); cur = next;
    }
    return chain;
  });
}

function chainSum(chain, useCurrent){
  return chain.reduce((sum,t)=> sum + taskDuration(t, useCurrent), 0);
}

function projectTimeline(projectId){
  const tasks = projectTasks(projectId);
  if(tasks.length === 0){
    return { chains:[], originalTotal:0, currentTotal:0, delay:0, isRed:false, criticalIndex:-1, originalDeadline:null, currentDeadline:null };
  }
  const chains = buildChains(tasks);
  const origSums = chains.map(c=>chainSum(c,false));
  const curSums = chains.map(c=>chainSum(c,true));
  const originalTotal = Math.max(...origSums, 0);
  const currentTotal = Math.max(...curSums, 0);
  const delay = currentTotal - originalTotal;
  const isRed = tasks.some(t=>isTaskDelayed(t));
  const criticalIndex = curSums.indexOf(Math.max(...curSums));
  // The deadline shown on the dashboard should be the actual latest task date on record,
  // not an assumed project-start-plus-duration figure — this always matches what's on the tasks.
  const originalDeadline = tasks.reduce((max,t)=> (t.originalEndDate && (!max || t.originalEndDate > max)) ? t.originalEndDate : max, null);
  const currentDeadline = tasks.reduce((max,t)=> { const e = effectiveEndDate(t); return (e && (!max || e > max)) ? e : max; }, null);
  return { chains, origSums, curSums, originalTotal, currentTotal, delay, isRed, criticalIndex, originalDeadline, currentDeadline };
}

function taskStatusColor(t){
  if(isTaskDelayed(t)) return 'red';
  if(t.status==='closed') return 'green';

function waLink(phone, text){
  const digits = (phone||'').replace(/[^0-9]/g,'');
  const encodedText = text ? 'text='+encodeURIComponent(text) : '';
  return digits ? `https://wa.me/${digits}${encodedText?'?'+encodedText:''}` : `https://wa.me/${encodedText?'?'+encodedText:''}`;
}
function entityName(assignedType, assignedId){
  if(assignedType==='team'){ const tm = state.teams.find(x=>x.id===assignedId); return tm ? tm.name : 'Unassigned'; }
  const u = state.users.find(x=>x.id===assignedId);
  if(!u) return 'Unassigned';
  const tm = u.teamId ? state.teams.find(x=>x.id===u.teamId) : null;
  return tm ? `${u.username}-${tm.name}` : u.name;
}

function progressByEntity(projectId){
  const tasks = projectTasks(projectId);
  const map = {};
  tasks.forEach(t=>{
    const key = t.assignedType+':'+t.assignedId;
    if(!map[key]) map[key] = { key, type:t.assignedType, id:t.assignedId, name:entityName(t.assignedType,t.assignedId), total:0, closed:0, closedOnTime:0, closedDelayed:0, delayDays:0, red:false };
    map[key].total++;
    if(t.status==='closed'){
      map[key].closed++;
      if(isTaskDelayed(t)){
        map[key].closedDelayed++;
        map[key].delayDays += Math.max(daysBetween(t.originalEndDate, effectiveEndDate(t)), 0);
      } else {
        map[key].closedOnTime++;
      }
    }
    if(isTaskDelayed(t)) map[key].red = true;
  });
  return Object.values(map);
}

function taskDerivedStatus(t){
  const delayed = isTaskDelayed(t);
  if(t.status==='closed') return delayed ? 'closed-late' : 'closed-on-time';
  return delayed ? 'open-delayed' : 'open-on-track';
}

// The circuit-brain icon markup, shared between the idle bubble and the "thinking"
// state while waiting on a response. Full inline markup (not <use>) deliberately —
// referencing shared defs via <use> doesn't reliably carry CSS-driven color/animation
// across all browsers, confirmed the hard way while designing this.
// A small, focused markdown renderer for Workspace CoPilot messages — handles tables and
// bold text specifically, since those are what the AI actually produces for
// structured data like the employee directory. Not a full markdown implementation
// on purpose; just enough to make the two things that matter here readable.
function renderMarkdownLite(text){
  const escaped = (text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = escaped.split('\n');
  let html = '';
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    // A markdown table: a header row, a separator row (|---|---|), then data rows —
    // all lines starting and containing at least one pipe.
    if(line.trim().startsWith('|') && lines[i+1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      const headerCells = line.split('|').map(c=>c.trim()).filter((c,idx,arr)=> !(idx===0&&c==='') && !(idx===arr.length-1&&c===''));
      let tableRows = `<tr>${headerCells.map(c=>`<th>${applyInlineMd(c)}</th>`).join('')}</tr>`;
      i += 2; // skip header + separator
      while(i < lines.length && lines[i].trim().startsWith('|')){
        const cells = lines[i].split('|').map(c=>c.trim()).filter((c,idx,arr)=> !(idx===0&&c==='') && !(idx===arr.length-1&&c===''));
        tableRows += `<tr>${cells.map(c=>`<td>${applyInlineMd(c)}</td>`).join('')}</tr>`;
        i++;
      }
      html += `<table class="ai-msg-table">${tableRows}</table>`;
      continue;
    }
    html += (html ? '<br>' : '') + applyInlineMd(line);
    i++;
  }
  return html;
}
function applyInlineMd(s){
  const withBold = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return withBold.replace(/\[\[est:(.+?)\]\]/g, '<span class="ai-est-flag" title="This figure was calculated or estimated by the AI itself, not pulled directly from your data — worth double-checking.">⚠ $1</span>');
}

// Renders the uploaded animation exactly as provided — no color or timing changes
// to the animation itself — sized to match the 30x30px the previous hand-built icon
// used. Only plays while Workspace CoPilot is actually generating a response;
// otherwise it sits still on its first frame, except for a periodic single loop
// every 10 seconds while closed (see startBubbleIdlePulse below). A fresh instance
// is created every time this state changes (renderAiAgentWidget already re-runs
// whenever aiAgentThinking flips), so setting autoplay based on that alone is
// enough — nothing about the animation's own frames or colors is touched either way.
let workspaceCopilotLottieInstances = {};
function initWorkspaceCopilotLottie(){
  if(typeof lottie === 'undefined') return; // library failed to load — fail quietly, rest of the widget still works
  ['aiBubbleLottie','aiHeaderLottie'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(workspaceCopilotLottieInstances[id]) workspaceCopilotLottieInstances[id].destroy(); // avoid piling up instances across re-renders
    workspaceCopilotLottieInstances[id] = lottie.loadAnimation({
      container: el,
      renderer: 'svg',
      loop: true,
      autoplay: aiAgentThinking,
      animationData: WORKSPACE_COPILOT_LOTTIE,
    });
  });
}

// Every 10 seconds, if the panel is closed and nothing's actively being generated,
// play exactly one loop of the bubble's icon as a gentle "still here" pulse, then
// let it settle back to still — never touching the animation itself, just when it
// plays. Started once, keeps running for the life of the page.
function triggerBubbleIdlePulse(){
  if(ui.aiAgentOpen || aiAgentThinking) return;
  const inst = workspaceCopilotLottieInstances['aiBubbleLottie'];
  if(!inst) return;
  const onLoopComplete = ()=>{ inst.pause(); inst.removeEventListener('loopComplete', onLoopComplete); };
  inst.addEventListener('loopComplete', onLoopComplete);
  inst.goToAndPlay(0, true);
}
setInterval(triggerBubbleIdlePulse, 10000);
// Browsers heavily throttle setInterval timers in tabs that are backgrounded or
// not actively focused — often to once a minute or slower — as a battery-saving
// measure. That's outside anything JS can override, but this at least means the
// pulse reliably fires the moment someone actually comes back to the tab, rather
// than depending only on a timer that may have been sitting throttled while away.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') triggerBubbleIdlePulse();
});

// ---- Reminders: live notification while the app is open ----
// This can only ever fire while someone actually has the workspace open in their
// browser — there's no real push-notification capability in a plain web page.
// If nobody's logged in when a reminder is due, nothing happens until they next
// open the app, at which point this same check picks it up as overdue.
let reminderPopupQueue = [];
let reminderPopupShowing = null; // the reminder id currently in the popup, or null
let reminderPopupStage = 'info'; // 'info' -> initial popup, 'confirm' -> close-or-snooze choice
function effectiveReminderDueDate(r){
  if(r.snoozedUntil) return new Date(r.snoozedUntil.replace('T',' ')+':00');
  return reminderDueDateObj(r.nextDueISO, r.nextDueTime);
}
function checkDueReminders(){
  const cu = currentUser();
  if(!cu) return;
  const now = nowIST();
  myReminders().forEach(r=>{
    if(!r.active) return;
    if(reminderPopupQueue.includes(r.id) || reminderPopupShowing===r.id) return;
    if(effectiveReminderDueDate(r) <= now) reminderPopupQueue.push(r.id);
  });
  if(!reminderPopupShowing && reminderPopupQueue.length) advanceReminderPopupQueue();
}
function advanceReminderPopupQueue(){
  reminderPopupShowing = reminderPopupQueue.shift() || null;
  reminderPopupStage = 'info';
  renderReminderPopup();
}
function renderReminderPopup(){
  const root = document.getElementById('reminderPopupRoot');
  if(!root) return;
  if(!reminderPopupShowing){ root.innerHTML = ''; return; }
  const r = state.reminders.find(x=>x.id===reminderPopupShowing);
  if(!r){ reminderPopupShowing = null; root.innerHTML = ''; return; }
  const dt = reminderDisplayDateTime({ dateISO: r.nextDueISO, time: r.nextDueTime });
  const contentHtml = !r.content ? '' :
    r.content.type==='text' ? `<div style="font-size:13px;color:var(--paper-dim);margin-top:8px;">${r.content.text}</div>` :
    r.content.type==='link' ? `<div style="margin-top:8px;"><a href="${r.content.url}" target="_blank" rel="noopener">${r.content.url}</a></div>` :
    r.content.type==='image' ? `<img src="${r.content.fileUrl}" style="max-width:220px;border-radius:8px;margin-top:8px;display:block;">` :
    `<div style="margin-top:8px;"><a href="${r.content.fileUrl}" target="_blank" rel="noopener">${r.content.fileName}</a></div>`;

  if(reminderPopupStage==='info'){
    root.innerHTML = `
      <div style="position:fixed;top:24px;right:24px;z-index:200;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.24);padding:18px;">
