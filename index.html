          ${t.weekendWork ? `<div style="margin:6px 0;">${pill('amber','Includes weekend work')}</div>` : ''}
          ${t.checklistRecord ? `<div class="field"><label>Checklist confirmed</label><div class="hint">Completed by ${t.checklistRecord.completedByName} on ${fmtDate(t.checklistRecord.completedAt)}${t.checklistRecord.items.map(i=>`<br>✓ ${i.text}`).join('')}</div></div>` : ''}
          ${admin ? `<div class="hint">To correct these dates, use "Amend timeline" below — it's kept separate from Save so closing or editing a task never silently changes the permanent record.</div>` : ''}
          `}
          <div class="field"><label>Reason — why this much time?</label><textarea id="tfReason" placeholder="Explain the estimate...">${t.reason||''}</textarea></div>
          <div class="field"><label>Assign to</label><select id="tfAssignee" ${admin?'':'disabled'}>${assigneeOptions(t.assignedType,t.assignedId)}</select></div>
          ${admin ? `<div class="field"><label>Depends on</label><select id="tfPredecessor">${predecessorOptions(t.projectId,t.id,t.predecessorId)}</select></div>` : ''}
          <div class="field">
            <label>Status</label>
            <select id="tfStatus">
              <option value="open" ${t.status==='open'?'selected':''}>Open</option>
              <option value="closed" ${t.status==='closed'?'selected':''}>Closed</option>
            </select>
          </div>
          ${t.extensionHistory && t.extensionHistory.length ? `<div class="field"><label>Extension history</label>${t.extensionHistory.map(h=>`<div class="hint">→ moved to ${fmtDate(h.newEndDate)}${h.category?' · '+h.category:''} — ${h.reason||'no reason given'}</div>`).join('')}</div>` : ''}
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            ${admin ? `<button type="button" class="btn btn-danger" data-delete-task="${t.id}">Delete</button>` : ''}
            ${admin && !firstTimeSave ? `<button type="button" class="btn" id="amendTimelineBtn">Amend timeline</button>` : ''}
            <button type="button" id="tfSubmitBtn" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  if(firstTimeSave){
    const hintEl = document.getElementById('tfDateHint');
    const updateHint = ()=>{ hintEl.textContent = dateRangeHint(document.getElementById('tfStart').value, document.getElementById('tfEnd').value); };
    document.getElementById('tfStart').addEventListener('input', updateHint);
    document.getElementById('tfEnd').addEventListener('input', updateHint);
  }
  runOnClickAndEnter('taskForm', 'tfSubmitBtn', ()=>{
    const titleEl = document.getElementById('tfTitle');
    if(!titleEl.value.trim()){ titleEl.focus(); return; }
    let sVal, eVal;
    if(firstTimeSave){
      sVal = document.getElementById('tfStart').value;
      eVal = document.getElementById('tfEnd').value;
      if(!sVal || !eVal){ return; }
    }
    const commit = ()=>{
      t.title = titleEl.value.trim();
      t.description = document.getElementById('tfDesc').value.trim();
      t.reason = document.getElementById('tfReason').value.trim();
      t.status = document.getElementById('tfStatus').value;
      if(t.status==='closed' && !t.closedDate) t.closedDate = todayISO();
      if(t.status==='open') t.closedDate = null;
      if(firstTimeSave){
        t.startDate = sVal;
        t.endDate = eVal;
        t.originalEndDate = eVal;
        t.datesLocked = true;
        if(document.getElementById('tfWeekendWork').checked) t.weekendWork = true;
      }
      if(admin){
        const [type,id] = document.getElementById('tfAssignee').value.split(':');
        t.assignedType = type; t.assignedId = id;
        t.predecessorId = document.getElementById('tfPredecessor').value || null;
      }
      touchTask(t);
      persist(); closeModal(); render();
    };
    const overlapThenCommit = ()=>{
      if(firstTimeSave){
        const assignedType = admin ? document.getElementById('tfAssignee').value.split(':')[0] : t.assignedType;
        const assignedId = admin ? document.getElementById('tfAssignee').value.split(':')[1] : t.assignedId;
        const overlaps = findOverlappingTasks(assignedType, assignedId, sVal, eVal, t.id);
        if(overlaps.length){ openOverlapConfirmModal(overlaps, commit); return; }
      }
      commit();
    };
    const pendingStatus = document.getElementById('tfStatus').value;
    const isClosingNow = t.status!=='closed' && pendingStatus==='closed';
    if(isClosingNow){
      const proj = state.projects.find(p=>p.id===t.projectId);
      const teamId = t.assignedType==='team' ? t.assignedId : (state.users.find(u=>u.id===t.assignedId)||{}).teamId;
      const team = teamId ? state.teams.find(tm=>tm.id===teamId) : null;
      const items = (team && Array.isArray(team.checklist)) ? team.checklist : [];
      if(proj && proj.requireChecklist && items.length){
        openChecklistGateModal(t, team, items, (record)=>{ t.checklistRecord = record; overlapThenCommit(); });
        return;
      }
    }
    overlapThenCommit();
  });
  const amendBtn = document.getElementById('amendTimelineBtn');
  if(amendBtn) amendBtn.addEventListener('click', ()=> openAmendTimelineModal(t.id));
  const delBtn = document.querySelector('[data-delete-task]');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    state.tasks = state.tasks.filter(x=>x.id!==t.id);
    state.tasks.forEach(x=>{ if(x.predecessorId===t.id) x.predecessorId=null; });
    persist(); closeModal(); render();
  });
}

function openAmendTimelineModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Amend timeline</h3>
        <div class="modal-sub">${t.title} — this directly rewrites the permanent record. Use with care.</div>
        <form id="amendForm">
          <div class="field-row">
            <div class="field"><label>Start date</label><input type="date" id="amStart" value="${t.startDate}" required></div>
            <div class="field"><label>Original agreed end date</label><input type="date" id="amOrigEnd" value="${t.originalEndDate}" required></div>
          </div>
          ${t.extended ? `<div class="field"><label>Extended end date</label><input type="date" id="amExtEnd" value="${t.endDate}" required></div>` : ''}
          <div class="hint" id="amDateHint">${dateRangeHint(t.startDate, t.originalEndDate)}</div>
          ${t.status==='closed' ? `<div class="field"><label>Closed date</label><input type="date" id="amClosedDate" value="${t.closedDate||''}" required></div><div class="hint">This date is what the delay shown on the workstream is measured against once a task is closed.</div>` : ''}
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="amWeekendWork" ${t.weekendWork?'checked':''}> This timeline includes weekend work</label>
          <div class="hint">This is separate from the normal Save action on purpose — closing or editing a task will never change these dates on its own.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="amendSubmitBtn" class="btn btn-danger">Save amended timeline</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  const amUpdateHint = ()=>{ document.getElementById('amDateHint').textContent = dateRangeHint(document.getElementById('amStart').value, document.getElementById('amOrigEnd').value); };
  document.getElementById('amStart').addEventListener('input', amUpdateHint);
  document.getElementById('amOrigEnd').addEventListener('input', amUpdateHint);
  runOnClickAndEnter('amendForm', 'amendSubmitBtn', ()=>{
    const start = document.getElementById('amStart').value;
    const origEnd = document.getElementById('amOrigEnd').value;
    const extEnd = t.extended ? document.getElementById('amExtEnd').value : null;
    const closedDateVal = t.status==='closed' ? document.getElementById('amClosedDate').value : null;
    if(!start || !origEnd || (t.extended && !extEnd) || (t.status==='closed' && !closedDateVal)) return;
    t.startDate = start;
    t.originalEndDate = origEnd;
    t.weekendWork = document.getElementById('amWeekendWork').checked;
    if(t.status==='closed'){
      t.closedDate = closedDateVal;
    }
    if(t.extended){
      t.endDate = extEnd;
    } else {
      t.endDate = origEnd;
    }
    touchTask(t);
    persist(); closeModal(); render();
  });
}

function openExtendModal(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const DELAY_CATEGORIES = ['Client delay','Dependency on another team','Scope change','Underestimated','Resource unavailable','Other'];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Extend date</h3>
        <div class="modal-sub">${t.title} — currently agreed for ${fmtDate(t.endDate)}</div>
        <form id="extendForm">
          <div class="field"><label>New end date</label><input type="date" id="exDate" min="${addDays(t.endDate,1)}" value="${addDays(t.endDate,1)}" required></div>
          <div class="hint" id="exDateHint">${dateRangeHint(t.startDate, addDays(t.endDate,1))}</div>
          <div class="field"><label>Why is this late?</label><select id="exCategory">${DELAY_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
          <div class="field"><label>Reason for the extension</label><textarea id="exReason" placeholder="What pushed this back?" required></textarea></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:10px 0 4px;"><input type="checkbox" id="exWeekendWork" ${t.weekendWork?'checked':''}> This includes weekend work</label>
          <div class="hint">The original date (${fmtDate(t.originalEndDate)}) stays on record. This task, its chain and the project dashboard will switch to red.</div>
          <div class="login-error" id="exError"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="exSubmitBtn" class="btn btn-danger">Confirm extension</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  document.getElementById('exDate').addEventListener('input', ()=>{
    document.getElementById('exDateHint').textContent = dateRangeHint(t.startDate, document.getElementById('exDate').value);
  });
  runOnClickAndEnter('extendForm', 'exSubmitBtn', ()=>{
    const newDate = document.getElementById('exDate').value;
    const reason = document.getElementById('exReason').value.trim();
    const category = document.getElementById('exCategory').value;
    const errEl = document.getElementById('exError');
    if(!newDate){ errEl.textContent = 'Pick a new end date before confirming.'; return; }
    if(newDate <= t.endDate){ errEl.textContent = `The new date must be after the current agreed date (${fmtDate(t.endDate)}).`; return; }
    if(!reason){ errEl.textContent = 'Add a reason for the extension.'; return; }
    errEl.textContent = '';
    t.extensionHistory = t.extensionHistory || [];
    t.extensionHistory.push({date: todayISO(), newEndDate:newDate, reason, category});
    t.lastDelayCategory = category;
    t.endDate = newDate;
    t.extended = true;
    if(document.getElementById('exWeekendWork').checked) t.weekendWork = true;
    touchTask(t);
    persist(); closeModal(); render();
  });
}

function bindModalClose(){
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  document.querySelector('[data-backdrop]').addEventListener('click', (e)=>{ if(e.target.dataset.backdrop!==undefined && e.target===e.currentTarget) closeModal(); });
}

// Other still-open tasks for the same person whose date range overlaps the one being saved.
function findOverlappingTasks(assignedType, assignedId, start, end, excludeTaskId){
  if(!start || !end) return [];
  return state.tasks.filter(o=>
    o.id!==excludeTaskId &&
    o.assignedType===assignedType && o.assignedId===assignedId &&
    o.status!=='closed' &&
    o.startDate && o.endDate &&
    start <= o.endDate && end >= o.startDate
  );
}

// A stacked confirmation shown on top of the task form (without closing it) when the
// dates just entered overlap another open task for the same person. "Change dates"
// simply dismisses this overlay so they can edit the form underneath; "Keep dates
// anyway" runs the save that was already prepared.
// Reverting a marked-worked weekend day back to a normal weekly off — a quick
// confirmation so admins don't lose the record with a single accidental click.
function openRevertWeekendConfirm(iso, onConfirm){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-backdrop" style="z-index:60;">
      <div class="modal">
        <h3>Change back to weekly off?</h3>
        <div class="modal-sub">${fmtDate(iso)} is currently marked as worked. Do you want to change it back to weekly off?</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="revertWeekendCancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="revertWeekendConfirm">Yes, change back</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const cleanup = ()=> div.remove();
  div.querySelector('#revertWeekendCancel').addEventListener('click', cleanup);
  div.querySelector('#revertWeekendConfirm').addEventListener('click', ()=>{ cleanup(); onConfirm(); });
}

function openOverlapConfirmModal(overlaps, onContinue){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-backdrop" style="z-index:60;">
      <div class="modal">
        <h3>Overlapping timeline</h3>
        <div class="modal-sub">These dates overlap ${overlaps.length} other open task${overlaps.length===1?'':'s'} already assigned to this person.</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin:14px 0;">
          ${overlaps.map(o=>`<div class="hint">→ ${o.title||'Untitled task'} (${fmtDate(o.startDate)} → ${fmtDate(o.endDate)})</div>`).join('')}
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="overlapChangeBtn">Change dates</button>
          <button type="button" class="btn btn-danger" id="overlapContinueBtn">Keep these dates anyway</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const cleanup = ()=> div.remove();
  div.querySelector('#overlapChangeBtn').addEventListener('click', cleanup);
  div.querySelector('#overlapContinueBtn').addEventListener('click', ()=>{ cleanup(); onContinue(); });

// Blocks closing a task until every one of the assigned team's checklist points is
// ticked — this workstream has "Require checklist" turned on. Records exactly what
// was ticked, by whom, and when, as a permanent snapshot on the task.
function openChecklistGateModal(t, team, items, onComplete){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-backdrop" style="z-index:60;">
      <div class="modal">
        <h3>Checklist required to close</h3>
        <div class="modal-sub">${team.name} team checklist for "${t.title||'this task'}" — tick every point before it can close.</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin:14px 0;">
          ${items.map(it=>`<label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;"><input type="checkbox" class="clGateCheck" value="${it.id}" style="margin-top:2px;"> <span>${it.text}</span></label>`).join('')}
        </div>
        <div class="hint" id="clGateHint">0 of ${items.length} checked</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="clGateCancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="clGateConfirm" disabled>Confirm &amp; close task</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const checks = div.querySelectorAll('.clGateCheck');
  const hint = div.querySelector('#clGateHint');
  const confirmBtn = div.querySelector('#clGateConfirm');
  const updateState = ()=>{
    const checkedCount = Array.from(checks).filter(c=>c.checked).length;
    hint.textContent = `${checkedCount} of ${items.length} checked`;
    confirmBtn.disabled = checkedCount !== items.length;
  };
  checks.forEach(c=>c.addEventListener('change', updateState));
  updateState();
  div.querySelector('#clGateCancel').addEventListener('click', ()=> div.remove());
  confirmBtn.addEventListener('click', ()=>{
    if(confirmBtn.disabled) return;
    const record = {
      completedBy: session.userId,
      completedByName: (currentUser()||{}).name || 'Unknown',
      completedAt: todayISO(),
      items: items.map(it=>({ id: it.id, text: it.text, checked: true }))
    };
    div.remove();
    onComplete(record);
  });
}

/* ============================== REPORTS ============================== */

function renderReports(){
  const accessIds = accessibleProjectIds();
  const scopedTasks = accessIds===null ? state.tasks : state.tasks.filter(t=>accessIds.includes(t.projectId));
  const scopedProjects = visibleProjects();

  const f = ui.reportFilters;
  let rows = scopedTasks.slice();
  if(f.project) rows = rows.filter(t=>t.projectId===f.project);
  if(f.team) rows = rows.filter(t=>t.assignedType==='team' && t.assignedId===f.team);
  if(f.user) rows = rows.filter(t=>t.assignedType==='user' && t.assignedId===f.user);
  if(f.status) rows = rows.filter(t=>taskDerivedStatus(t)===f.status);
  if(f.reason) rows = rows.filter(t=> f.reason==='Uncategorized' ? (t.extended && !t.lastDelayCategory) : t.lastDelayCategory===f.reason);

  const total = scopedTasks.length;
  const onTime = scopedTasks.filter(t=>!isTaskDelayed(t)).length;
  const late = scopedTasks.filter(t=>isTaskDelayed(t)).length;

  // leaderboard of delays by team/user, with repeat offenders flagged
  const lb = {};
  scopedTasks.filter(t=>isTaskDelayed(t)).forEach(t=>{
    const name = entityName(t.assignedType,t.assignedId);
    lb[name] = (lb[name]||0)+1;
  });
  const lbMax = Math.max(1, ...Object.values(lb));
  const lbRows = Object.entries(lb).sort((a,b)=>b[1]-a[1]).map(([name,count])=>`
    <div class="lb-row"><div class="lb-name">${name}${count>=3?' <span class="mono" style="color:var(--red);font-size:10px;">· REPEAT</span>':''}</div><div class="lb-bar"><span style="width:${count/lbMax*100}%;${count>=3?'background:var(--red);':''}"></span></div><div class="lb-count">${count} delay${count===1?'':'s'}</div></div>
  `).join('') || `<div class="muted" style="font-size:12px;">No delays recorded — nice.</div>`;

  // why things are late, aggregated across every extension on record in scope
  const reasonCounts = {};
  scopedTasks.forEach(t=>{
    (t.extensionHistory||[]).forEach(h=>{
      const cat = h.category || 'Uncategorized';
      reasonCounts[cat] = (reasonCounts[cat]||0)+1;
    });
  });
  const reasonMax = Math.max(1, ...Object.values(reasonCounts));
  const reasonRows = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>`
    <div class="lb-row" data-filter-reason="${cat}" style="cursor:pointer;${f.reason===cat?'background:var(--panel-hi);border-radius:6px;':''}">
      <div class="lb-name">${cat}</div><div class="lb-bar"><span style="width:${count/reasonMax*100}%;background:var(--amber);"></span></div><div class="lb-count">${count}×</div>
    </div>
  `).join('') || `<div class="muted" style="font-size:12px;">No extensions recorded yet.</div>`;

  const tableRows = rows.map(t=>{
    const ds = taskDerivedStatus(t);
    const labelMap = {'closed-on-time':['green','Closed on time'],'closed-late':['red','Closed late'],'open-on-track':['amber','Open · on track'],'open-delayed':['red','Open · delayed']};
    const [color,label] = labelMap[ds];
    const proj = state.projects.find(p=>p.id===t.projectId);
    const delayed = isTaskDelayed(t);
    const delayDays = delayed ? Math.max(daysBetween(t.originalEndDate, effectiveEndDate(t)), 0) : 0;
    return `<tr>
      <td>${proj ? proj.name : '—'}</td>
      <td><div class="task-title">${t.title||'Untitled'}</div></td>
      <td>${entityName(t.assignedType,t.assignedId)}</td>
      <td class="mono" style="font-size:11px;">${fmtDate(t.startDate)} → ${fmtDate(t.originalEndDate)}</td>
      <td class="mono" style="font-size:11px;${delayed?'color:var(--red)':''}">${t.extended ? fmtDate(t.endDate) : '—'}</td>
      <td class="mono" style="font-size:11px;">${t.lastDelayCategory || '—'}</td>
      <td>${pill(color,label)}</td>
      <td class="mono" style="font-size:11px;${delayDays>0?'color:var(--red)':''}">${delayDays>0 ? '-'+delayDays+'d' : '0d'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="eyebrow">Reports</div>
    <h1 class="page-title" style="margin-bottom:22px;">Who delivered, who slipped</h1>

    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${total}</div><div class="l">Total tasks</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--green);">${onTime}</div><div class="l">Never extended</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--red);">${late}</div><div class="l">Extended at least once</div></div>
    </div>

    <div class="grid g3" style="align-items:start;margin-bottom:22px;">
      <div class="card">
        <div class="section-title">Most delays, by team &amp; individual</div>
        ${lbRows}
      </div>
      <div class="card">
        <div class="section-title">Why things are late</div>
        <div class="muted" style="font-size:11px;margin-bottom:8px;margin-top:-4px;">Click a reason to see exactly which tasks it covers.</div>
        ${reasonRows}
      </div>
      <div class="card">
        <div class="section-title">Filter</div>
        <div class="filters">
          <select id="fProject"><option value="">All workstreams</option>${scopedProjects.map(p=>`<option value="${p.id}" ${f.project===p.id?'selected':''}>${p.name}</option>`).join('')}</select>
          <select id="fTeam"><option value="">All teams</option>${state.teams.map(t=>`<option value="${t.id}" ${f.team===t.id?'selected':''}>${t.name}</option>`).join('')}</select>
          <select id="fUser"><option value="">All individuals</option>${state.users.filter(u=>u.role!=='admin').map(u=>`<option value="${u.id}" ${f.user===u.id?'selected':''}>${u.name}</option>`).join('')}</select>
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="closed-on-time" ${f.status==='closed-on-time'?'selected':''}>Closed on time</option>
            <option value="closed-late" ${f.status==='closed-late'?'selected':''}>Closed late</option>
            <option value="open-on-track" ${f.status==='open-on-track'?'selected':''}>Open · on track</option>
            <option value="open-delayed" ${f.status==='open-delayed'?'selected':''}>Open · delayed</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      ${f.reason ? `<div class="banner"><span>Filtered to "${f.reason}" delays</span><button type="button" class="btn btn-sm btn-ghost" id="clearReasonFilter" style="margin-left:auto;">Clear ✕</button></div>` : ''}
      <table>
        <thead><tr><th>Workstream</th><th>Task</th><th>Assigned</th><th>Agreed window</th><th>Extended to</th><th>Why late</th><th>Status</th><th>Delay</th></tr></thead>
        <tbody>${tableRows || `<tr><td colspan="8" class="empty-state">No tasks match these filters.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function bindReports(){
  ['fProject','fTeam','fUser','fStatus'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      ui.reportFilters = {
        project: document.getElementById('fProject').value,
        team: document.getElementById('fTeam').value,
        user: document.getElementById('fUser').value,
        status: document.getElementById('fStatus').value,
        reason: ui.reportFilters.reason,
      };
      render();
    });
  });
  document.querySelectorAll('[data-filter-reason]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const cat = row.dataset.filterReason;
      ui.reportFilters.reason = (ui.reportFilters.reason===cat) ? '' : cat; // click again to clear
      render();
    });
  });
  const clearBtn = document.getElementById('clearReasonFilter');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ ui.reportFilters.reason=''; render(); });
}

/* ============================== ACTIVE ASSIGNMENTS ============================== */

// Per-member workload: what they're on right now, what's next, and a tentative
// date for when they'll be free of everything currently assigned to them.
function activeAssignmentsData(){
  const accessIds = accessibleProjectIds();
  const scopedTasks = accessIds===null ? state.tasks : state.tasks.filter(t=>accessIds.includes(t.projectId));
  const cu = currentUser();
  let members = state.users.filter(u=>u.role==='member');
  if(cu && cu.role==='member') members = members.filter(u=>u.id===cu.id); // members only ever see themselves here

  return members.map(u=>{
    const myTasks = scopedTasks.filter(t=>
      (t.assignedType==='user' && t.assignedId===u.id) ||
      (t.assignedType==='team' && t.assignedId===u.teamId)
    );
    const openTasks = myTasks
      .filter(t=>t.status!=='closed' && t.datesLocked) // a blank task with no timeline yet isn't real workload
      .slice()
      .sort((a,b)=> (effectiveEndDate(a)||'9999') < (effectiveEndDate(b)||'9999') ? -1 : 1);
    const closedTasks = myTasks
      .filter(t=>t.status==='closed')
      .slice()
      .sort((a,b)=> (b.closedDate||'') < (a.closedDate||'') ? -1 : 1);
    const current = openTasks[0] || null;
    const future = openTasks.slice(1);
    const freeBy = openTasks.reduce((max,t)=>{ const e=effectiveEndDate(t); return (e && (!max||e>max)) ? e : max; }, null);
    return { user:u, team: state.teams.find(tm=>tm.id===u.teamId), allTasks: myTasks, openTasks, closedTasks, current, future, freeBy, openCount: openTasks.length };
  });
}

function taskWorkloadStatus(t){
  if(t.blockedByTeamId){
    const teamName = (state.teams.find(tm=>tm.id===t.blockedByTeamId)||{}).name || 'Unknown team';
    return { color:'amber', label:'Blocked by '+teamName, tooltip: t.blockerReason||'no reason given' };
  }
  if(isTaskDelayed(t)) return { color:'red', label: t.extended?'Extended':'Overdue' };
  return { color:'green', label:'In progress' };
}

// closed / current / future — the three-way bucket used for both the row accent
// color and the calendar coloring.
function taskCategory(t, currentTaskId){
  if(t.status==='closed') return 'closed';
  if(t.id===currentTaskId) return 'current';
  return 'future';
}
const CATEGORY_COLOR = { closed:'#7C93B3', current:'var(--green)', future:'var(--amber)' };
const CATEGORY_LABEL = { closed:'Closed', current:'Current', future:'Future' };

function taskEffectiveRange(t){
  const end = t.status==='closed' ? (t.closedDate && t.closedDate>t.endDate ? t.closedDate : t.endDate) : effectiveEndDate(t);
  return { start: t.startDate, end };
}

function taskOverlapsMonth(t, monthKey){
  if(!monthKey) return true;
  const {start,end} = taskEffectiveRange(t);
  if(!start || !end) return false;
  const [y,m] = monthKey.split('-').map(Number);
  const monthStart = `${monthKey}-01`;
  const monthEndD = new Date(y, m, 0);
  const monthEnd = `${monthEndD.getFullYear()}-${String(monthEndD.getMonth()+1).padStart(2,'0')}-${String(monthEndD.getDate()).padStart(2,'0')}`;
  return start <= monthEnd && end >= monthStart;
}

// Every month touched by any in-scope task, plus the current month, for the month filter dropdown.
function monthsInRange(rows){
  const set = new Set([todayISO().slice(0,7)]);
  rows.forEach(r=> r.allTasks.forEach(t=>{
    const {start,end} = taskEffectiveRange(t);
    if(!start || !end) return;
    let cur = new Date(start+'T00:00:00');
    const endD = new Date(end+'T00:00:00');
    let guard = 0;
    while(cur<=endD && guard<240){
      set.add(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
      cur.setMonth(cur.getMonth()+1);
      guard++;
    }
  }));
  return Array.from(set).sort();
}
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}

const CAL_COLOR = { closed:'#E6A560', current:'#E8D66B', future:'#7EB6E0', free:'#8FD69E' };

// Highest-priority task covering a given date (current > future > closed) — used to
// decide both the day's color and, for weekends, which task any marked work belongs to.
function findCoveringTask(row, iso, currentTaskId){
  const rank = { current:3, future:2, closed:1 };
  let best = null, bestRank = -1;
  row.allTasks.forEach(t=>{
    const {start,end} = taskEffectiveRange(t);
    if(!start || !end || iso<start || iso>end) return;
    const c = taskCategory(t, currentTaskId);
    if(rank[c] > bestRank){ bestRank = rank[c]; best = t; }
  });
  return best;
}

function buildCalendarHtml(row, monthKey, currentTaskId){
  const [y,m] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = new Date(y, m-1, 1).getDay();
  const dows = ['S','M','T','W','T','F','S'];
  const admin = isAdmin();
  // Fallback for attributing marked-worked weekend days when no task's own date range
  // covers that specific day — prefer the person's current task, else any task they have.
  const fallbackAttribution = (row.current || row.allTasks[0] || null);
  let cells = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const weekend = isWeekendISO(iso);
    const covering = findCoveringTask(row, iso, currentTaskId);
    let cat = null;
    let clickable = false;
    let attributionTask = null;
    if(weekend){
      attributionTask = covering || fallbackAttribution;
      const worked = attributionTask && Array.isArray(attributionTask.workedWeekendDates) && attributionTask.workedWeekendDates.includes(iso);
      if(worked) cat = taskCategory(attributionTask, currentTaskId);
      if(attributionTask && admin) clickable = true;
    } else {
      cat = covering ? taskCategory(covering, currentTaskId) : 'free';
    }
    const cls = `cal-day ${cat||''}${weekend?' weekend':''}${clickable?' admin-toggle':''}`;
    const toggleAttr = clickable ? ` data-cal-toggle="${iso}|${attributionTask.id}"` : '';
    const titleAttr = weekend ? (cat ? 'Worked this weekend — click to unmark' : (clickable ? 'Weekly off — click to mark as worked' : 'Weekly off')) : '';
    cells += `<div class="${cls}"${toggleAttr} title="${titleAttr}">${d}</div>`;
  }
  return `<div style="display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;">
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.closed};margin-right:5px;"></span>Closed</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.current};margin-right:5px;"></span>Current</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.future};margin-right:5px;"></span>Future</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLOR.free};margin-right:5px;"></span>Free</span>
      <span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--panel-raised);border:1px dashed var(--paper-faint);margin-right:5px;"></span>Weekly off${admin ? ' — click a weekend day to mark it worked' : ''}</span>
    </div>
    <div class="cal-grid">${cells}</div>`;
}

function renderAssignments(){
  const allRows = activeAssignmentsData();
  const availableCount = allRows.filter(r=>r.openCount===0).length;
  const working = allRows.filter(r=>r.openCount>0 && !r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId)).length;
  const atRisk = allRows.filter(r=>r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId)).length;

  const cu = currentUser();
  const isMemberSelf = cu && cu.role==='member';
  const viewBy = isMemberSelf ? 'individual' : (ui.assignmentsFilters.viewBy || 'individual'); // 'individual' | 'team'
  const userFilter = isMemberSelf ? cu.id : ui.assignmentsFilters.user;
  const teamFilter = isMemberSelf ? '' : ui.assignmentsFilters.team;
  const statusFilter = ui.assignmentsFilters.status; // 'current' | 'future' | 'closed' | 'available' | 'all'
  const monthFilter = ui.assignmentsFilters.month; // '' or 'YYYY-MM'
  const personFilter = ui.assignmentsFilters.personFilter; // '' | 'available' | 'working' | 'atrisk'

  let rows = allRows;
  let scoped = false;
  if(viewBy==='individual' && userFilter){ rows = allRows.filter(r=>r.user.id===userFilter); scoped = true; }
  else if(viewBy==='team' && teamFilter){ rows = allRows.filter(r=>r.team && r.team.id===teamFilter); scoped = true; }

  if(personFilter==='available') rows = rows.filter(r=>r.openCount===0);
  else if(personFilter==='working') rows = rows.filter(r=>r.openCount>0 && !r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId));
  else if(personFilter==='atrisk') rows = rows.filter(r=>r.openTasks.some(t=>isTaskDelayed(t)||t.blockedByTeamId));

  if(statusFilter==='available') rows = rows.filter(r=>r.openCount===0);
  else if(statusFilter==='current') rows = rows.filter(r=>!!r.current);
  else if(statusFilter==='future') rows = rows.filter(r=>r.future.length>0);
  else if(statusFilter==='closed') rows = rows.filter(r=>r.closedTasks.length>0);

  const showCalendarFor = scoped; // show each scoped card's own calendar, whether it's one person or a whole team
  const availableMonths = monthsInRange(allRows);

  const cards = rows.map(r=>{
    const headerStatus = r.openCount===0
      ? pill('green','Available')
      : (r.openTasks.some(t=>t.blockedByTeamId) ? pill('amber', 'Blocked')
        : r.openTasks.some(t=>isTaskDelayed(t)) ? pill('red','Delayed')
        : pill('green','On track'));

    let taskList;
    if(statusFilter==='closed') taskList = r.closedTasks;
    else if(statusFilter==='current') taskList = r.current ? [r.current] : [];
    else if(statusFilter==='future') taskList = r.future;
    else if(statusFilter==='available') taskList = [];
    else taskList = r.allTasks; // 'all'

    taskList = taskList.filter(t=>taskOverlapsMonth(t, monthFilter)).slice().sort((a,b)=>{
      const ea = taskEffectiveRange(a).start||'9999', eb = taskEffectiveRange(b).start||'9999';
      return ea<eb?-1:1;
    });

    const taskRowsHtml = taskList.map(t=>{
      const tp = state.projects.find(p=>p.id===t.projectId);
      const cat = taskCategory(t, r.current?r.current.id:null);
      const st = cat==='closed'
        ? pill(isTaskDelayed(t)?'red':'green', isTaskDelayed(t)?'Closed late':'Closed on time')
        : pill(taskWorkloadStatus(t).color, taskWorkloadStatus(t).label, taskWorkloadStatus(t).tooltip);
      const range = taskEffectiveRange(t);
      return `<tr data-open-project-row="${tp?tp.id:''}" style="cursor:pointer;">
        <td style="border-left:3px solid ${CATEGORY_COLOR[cat]};">
          <div class="task-title" style="font-size:13px;">${cat==='current'?'▸ ':''}${t.title||'Untitled task'}</div>
          <div class="task-desc">${tp?tp.name:''}</div>
        </td>
        <td class="mono" style="font-size:12px;">${fmtDate(t.startDate)} → ${fmtDate(range.end)}</td>
        <td>${pill(cat==='closed'?'green':cat==='current'?'green':'amber', CATEGORY_LABEL[cat])}</td>
        <td class="mono" style="font-size:12px;">${cat==='closed' ? fmtDate(t.closedDate) : '—'}</td>
        <td>${st}</td>
      </tr>`;
    }).join('');

    const emptyMsg = statusFilter==='available' ? 'Available — nothing currently assigned.' : 'Nothing to show for this filter.';

    return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
        <div class="userchip"><div class="initials">${initials(r.user.name)}</div>
          <div>
            <div style="font-weight:600;">${r.user.name}</div>
            <div class="muted" style="font-size:11px;">${r.team?r.team.name:'No team'}</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          ${headerStatus}
          <span class="mono" style="font-size:11px;color:var(--paper-faint);">${r.freeBy ? 'Available by '+fmtDate(r.freeBy) : 'Available now'}</span>
        </div>
      </div>
      ${taskList.length ? `
      <table>
        <thead><tr><th>Task</th><th>Timeline</th><th>Category</th><th>Closed</th><th>Status</th></tr></thead>
        <tbody>${taskRowsHtml}</tbody>
      </table>` : `<div class="empty-state" style="padding:20px;">${emptyMsg}</div>`}
      ${showCalendarFor ? `<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);"><div class="section-title" style="font-size:15px;margin-bottom:10px;">${monthLabel(monthFilter||todayISO().slice(0,7))}</div>${buildCalendarHtml(r, monthFilter||todayISO().slice(0,7), r.current?r.current.id:null)}</div>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="eyebrow">Active Assignments</div>
    <h1 class="page-title" style="margin-bottom:22px;">Who's working on what, and until when</h1>

    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${allRows.length}</div><div class="l">People tracked</div></div>
      <div class="stat-chip" data-person-filter="available" style="cursor:pointer;${personFilter==='available'?'border-color:var(--green);':''}"><div class="n" style="color:var(--green);">${availableCount}</div><div class="l">Available right now</div></div>
      <div class="stat-chip" data-person-filter="working" style="cursor:pointer;${personFilter==='working'?'border-color:var(--green);':''}"><div class="n" style="color:var(--green);">${working}</div><div class="l">Working, on track</div></div>
      <div class="stat-chip" data-person-filter="atrisk" style="cursor:pointer;${personFilter==='atrisk'?'border-color:var(--red);':''}"><div class="n" style="color:var(--red);">${atRisk}</div><div class="l">Delayed or blocked</div></div>
    </div>

    <div class="filters">
      ${!isMemberSelf ? `<select id="asgViewBy">
        <option value="individual" ${viewBy==='individual'?'selected':''}>View by individual</option>
        <option value="team" ${viewBy==='team'?'selected':''}>View by team</option>
      </select>` : ''}
      ${!isMemberSelf && viewBy==='individual' ? `<select id="asgUserFilter">
        <option value="">All employees</option>
        ${allRows.map(r=>`<option value="${r.user.id}" ${userFilter===r.user.id?'selected':''}>${r.user.name}</option>`).join('')}
      </select>` : ''}
      ${!isMemberSelf && viewBy==='team' ? `<select id="asgTeamFilter">
        <option value="">All teams</option>
        ${state.teams.map(t=>`<option value="${t.id}" ${teamFilter===t.id?'selected':''}>${t.name}</option>`).join('')}
      </select>` : ''}
      <select id="asgStatusFilter">
        <option value="current" ${statusFilter==='current'?'selected':''}>Current</option>
        <option value="future" ${statusFilter==='future'?'selected':''}>Future</option>
        <option value="closed" ${statusFilter==='closed'?'selected':''}>Closed</option>
        <option value="available" ${statusFilter==='available'?'selected':''}>Available</option>
        <option value="all" ${statusFilter==='all'?'selected':''}>All (Closed, Current, Future &amp; Available)</option>
      </select>
      <select id="asgMonthFilter">
        <option value="">All months</option>
        ${availableMonths.map(mk=>`<option value="${mk}" ${monthFilter===mk?'selected':''}>${monthLabel(mk)}</option>`).join('')}
      </select>
      <button type="button" class="btn btn-sm" id="asgResetBtn">Reset</button>
    </div>

    ${cards || `<div class="empty-state">No members to show yet.</div>`}
    <div class="footnote">"Available by" is the latest due date across everything currently assigned to that person. Calendars appear once you narrow down to a specific individual or team — pick a month filter to move them, otherwise they show the current month.</div>
  `;
}

function bindAssignments(){
  const vb = document.getElementById('asgViewBy');
  if(vb) vb.addEventListener('change', ()=>{ ui.assignmentsFilters.viewBy = vb.value; ui.assignmentsFilters.user=''; ui.assignmentsFilters.team=''; render(); });
  const uf = document.getElementById('asgUserFilter');
  if(uf) uf.addEventListener('change', ()=>{ ui.assignmentsFilters.user = uf.value; render(); });
  const tf = document.getElementById('asgTeamFilter');
  if(tf) tf.addEventListener('change', ()=>{ ui.assignmentsFilters.team = tf.value; render(); });
  const sf = document.getElementById('asgStatusFilter');
  if(sf) sf.addEventListener('change', ()=>{ ui.assignmentsFilters.status = sf.value; ui.assignmentsFilters.personFilter=''; render(); });
  const mf = document.getElementById('asgMonthFilter');
  if(mf) mf.addEventListener('change', ()=>{ ui.assignmentsFilters.month = mf.value; render(); });
  document.querySelectorAll('[data-open-project-row]').forEach(row=>{
    const id = row.dataset.openProjectRow;
    if(!id) return;
    row.addEventListener('click', ()=>{ ui.projectId = id; ui.view='project'; render(); });
  });
  document.querySelectorAll('[data-cal-toggle]').forEach(cell=>{
    cell.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!isAdmin()) return;
      const [iso, taskId] = cell.dataset.calToggle.split('|');
      const t = state.tasks.find(x=>x.id===taskId);
      if(!t) return;
      if(!Array.isArray(t.workedWeekendDates)) t.workedWeekendDates = [];
      const idx = t.workedWeekendDates.indexOf(iso);
      if(idx>=0){
        // reverting a worked weekend day back to weekly off — confirm first
        openRevertWeekendConfirm(iso, ()=>{
          const i2 = t.workedWeekendDates.indexOf(iso);
          if(i2>=0) t.workedWeekendDates.splice(i2,1);
          persist(); render();
        });
      } else {
        // marking a weekly off as worked is immediate, no confirmation needed
        t.workedWeekendDates.push(iso);
        persist(); render();
      }
    });
  });
  document.querySelectorAll('[data-person-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const val = chip.dataset.personFilter;
      if(ui.assignmentsFilters.personFilter===val) return; // already showing this — repeat clicks do nothing
      ui.assignmentsFilters.personFilter = val;
      ui.assignmentsFilters.status = val==='available' ? 'available' : 'current';
      render();
    });
  });
  const resetBtn = document.getElementById('asgResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    ui.assignmentsFilters = { viewBy:'individual', user:'', team:'', status:'current', month: todayISO().slice(0,7), personFilter:'' };
    render();
  });
}

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="section-title" style="margin-bottom:0;">Teams</div>
        <button class="btn btn-primary btn-sm" data-add-team>+ Create team</button>
      </div>
      <table><thead><tr><th>Team</th><th>Members</th><th>Checklist</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="empty-state">No teams yet.</td></tr>`}</tbody></table>
      <div class="footnote">Checklists only apply on workstreams where "Require checklist" was turned on when the workstream was created.</div>
    </div>`;
}

function renderAdminProjects(){
  const rows = state.projects.map(p=>{
    const tl = projectTimeline(p.id);
    return `<tr>
      <td>${p.name}</td>
      <td class="mono" style="font-size:12px;">${fmtDate(p.startDate)}</td>
      <td class="mono" style="font-size:12px;">${projectTasks(p.id).length} tasks</td>
      <td>${pill(tl.isRed?'red':'green', tl.isRed?'Delayed':'On track')}</td>
      <td><div class="row-actions"><button class="btn btn-sm" data-open-project="${p.id}">Open</button><button class="btn btn-sm btn-danger" data-del-project="${p.id}" data-project-name="${p.name.replace(/"/g,'&quot;')}" data-task-count="${projectTasks(p.id).length}">Delete</button></div></td>
    </tr>`;
  }).join('');
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="section-title" style="margin-bottom:0;">Workstreams</div>
        <button class="btn btn-primary btn-sm" data-add-project>+ Create workstream</button>
      </div>
      <table><thead><tr><th>Workstream</th><th>Started</th><th>Tasks</th><th>Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="empty-state">No workstreams yet.</td></tr>`}</tbody></table>
    </div>`;
}

function bindAdmin(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ ui.adminTab=b.dataset.tab; render(); }));
  document.querySelectorAll('[data-open-project]').forEach(b=>b.addEventListener('click', ()=>{ ui.projectId=b.dataset.openProject; ui.view='project'; render(); }));

  const addUser = document.querySelector('[data-add-user]');
  if(addUser) addUser.addEventListener('click', openAddUserModal);
  document.querySelectorAll('[data-user-team]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const u = state.users.find(x=>x.id===sel.dataset.userTeam);
      u.teamId = sel.value || null; persist(); render();
    });
  });
  document.querySelectorAll('[data-del-user]').forEach(b=>b.addEventListener('click', ()=>{
    state.users = state.users.filter(u=>u.id!==b.dataset.delUser); persist(); render();
  }));
  document.querySelectorAll('[data-view-creds]').forEach(b=>b.addEventListener('click', ()=>{
    const u = state.users.find(x=>x.id===b.dataset.viewCreds);
    showCredentialsModal(u);
  }));
  document.querySelectorAll('[data-edit-access]').forEach(b=>b.addEventListener('click', ()=>{
    openEditAccessModal(b.dataset.editAccess);
  }));
  document.querySelectorAll('[data-change-password]').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.changePassword) openChangePasswordModal(b.dataset.changePassword);
  }));
  const recoverBtn = document.getElementById('recoverLegacyBtn');
  if(recoverBtn) recoverBtn.addEventListener('click', checkForLegacyData);

  const addTeam = document.querySelector('[data-add-team]');
  if(addTeam) addTeam.addEventListener('click', openAddTeamModal);
  document.querySelectorAll('[data-del-team]').forEach(b=>b.addEventListener('click', ()=>{
    state.teams = state.teams.filter(t=>t.id!==b.dataset.delTeam);
    state.users.forEach(u=>{ if(u.teamId===b.dataset.delTeam) u.teamId=null; });
    persist(); render();
  }));
  document.querySelectorAll('[data-manage-checklist]').forEach(b=>b.addEventListener('click', ()=>{
    openManageChecklistModal(b.dataset.manageChecklist);
  }));

  const addProject = document.querySelector('[data-add-project]');
  if(addProject) addProject.addEventListener('click', openAddProjectModal);
  document.querySelectorAll('[data-del-project]').forEach(b=>b.addEventListener('click', ()=>{
    openDeleteProjectModal(b.dataset.delProject, b.dataset.projectName, b.dataset.taskCount);
  }));
}

function openDeleteProjectModal(projectId, projectName, taskCount){
  if(!isAdmin()) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Delete workstream?</h3>
        <div class="modal-sub">This can't be undone.</div>
        <p style="font-size:13px;color:var(--paper-dim);line-height:1.6;">
          This will permanently delete <b style="color:var(--paper);">${projectName}</b>
          and all ${taskCount} task${taskCount==1?'':'s'} in it — including timeline history and extension records.
        </p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteProjectBtn">Delete workstream</button>
        </div>
      </div>
    </div>`;
  bindModalClose();
  document.getElementById('confirmDeleteProjectBtn').addEventListener('click', ()=>{
    state.projects = state.projects.filter(p=>p.id!==projectId);
    state.tasks = state.tasks.filter(t=>t.projectId!==projectId);
    if(ui.projectId===projectId) ui.projectId = null;
    persist(); closeModal(); render();
  });
}

function randomPassword(){
  const words = ['orbit','delta','ridge','maple','coral','ember','quartz','vapor','tundra','pixel'];
  return words[Math.floor(Math.random()*words.length)] + Math.floor(100+Math.random()*900);
}

function openAddUserModal(){
  if(!isAdmin()) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Create user</h3>
        <div class="modal-sub">Generates a login the person can use right away.</div>
        <form id="userForm">
          <div class="field"><label>Full name</label><input id="uName" required></div>
          <div class="field"><label>Username</label><input id="uUsername" required></div>
          <div class="field"><label>Role</label>
            <select id="uRole">
              <option value="member">Member — assigned to a team, works on tasks</option>
              <option value="viewer">Viewer — read-only, no task assignments</option>
            </select>
          </div>
          <div class="field" id="uTeamField"><label>Team</label><select id="uTeam"><option value="">Unassigned</option>${state.teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
          <div class="field" id="uAccessField" style="display:none;">
            <label>Workstream access</label>
            <select id="uAccessMode">
              <option value="all">All workstreams</option>
              <option value="specific">Specific workstreams</option>
            </select>
            <div id="uAccessList" style="display:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;">
              ${state.projects.map(p=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;"><input type="checkbox" value="${p.id}" class="uAccessCheck"> ${p.name}</label>`).join('') || '<div class="hint">No workstreams exist yet.</div>'}
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin-top:12px;"><input type="checkbox" id="uCanSeeAssignments"> Can also view Active Assignments</label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="userSubmitBtn" class="btn btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  const roleSel = document.getElementById('uRole');
  const teamField = document.getElementById('uTeamField');
  const accessField = document.getElementById('uAccessField');
  const accessMode = document.getElementById('uAccessMode');
  const accessList = document.getElementById('uAccessList');
  roleSel.addEventListener('change', ()=>{
    const isViewer = roleSel.value==='viewer';
    teamField.style.display = isViewer ? 'none' : '';
    accessField.style.display = isViewer ? '' : 'none';
  });
  accessMode.addEventListener('change', ()=>{
    accessList.style.display = accessMode.value==='specific' ? 'flex' : 'none';
  });
  runOnClickAndEnter('userForm', 'userSubmitBtn', ()=>{
    const nameEl = document.getElementById('uName');
    const userEl = document.getElementById('uUsername');
    if(!nameEl.value.trim() || !userEl.value.trim()){ (nameEl.value.trim()?userEl:nameEl).focus(); return; }
    const isViewer = roleSel.value==='viewer';
    const u = { id: uid('u'), name: nameEl.value.trim(), username: userEl.value.trim(), password: randomPassword(), role: isViewer?'viewer':'member', teamId: isViewer ? null : (document.getElementById('uTeam').value || null) };
    if(isViewer){
      u.viewerProjectIds = accessMode.value==='all' ? 'all' : Array.from(document.querySelectorAll('.uAccessCheck:checked')).map(c=>c.value);
      u.viewerCanSeeAssignments = document.getElementById('uCanSeeAssignments').checked;
    }
    state.users.push(u); persist();
    showCredentialsModal(u);
  });
}

function openEditAccessModal(userId){
  if(!isAdmin()) return;
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;
  const currentIds = Array.isArray(u.viewerProjectIds) ? u.viewerProjectIds : [];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Edit access — ${u.name}</h3>
        <div class="modal-sub">Choose which workstreams this viewer can see.</div>
        <form id="accessForm">
          <div class="field">
            <select id="eaMode">
              <option value="all" ${u.viewerProjectIds==='all'?'selected':''}>All workstreams</option>
              <option value="specific" ${u.viewerProjectIds!=='all'?'selected':''}>Specific workstreams</option>
            </select>
            <div id="eaList" style="margin-top:10px;display:${u.viewerProjectIds==='all'?'none':'flex'};flex-direction:column;gap:6px;">
              ${state.projects.map(p=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;"><input type="checkbox" value="${p.id}" class="eaCheck" ${currentIds.includes(p.id)?'checked':''}> ${p.name}</label>`).join('') || '<div class="hint">No workstreams exist yet.</div>'}
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin-top:12px;"><input type="checkbox" id="eaCanSeeAssignments" ${u.viewerCanSeeAssignments?'checked':''}> Can also view Active Assignments</label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="eaSubmitBtn" class="btn btn-primary">Save access</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  const eaMode = document.getElementById('eaMode');
  const eaList = document.getElementById('eaList');
  eaMode.addEventListener('change', ()=>{ eaList.style.display = eaMode.value==='specific' ? 'flex' : 'none'; });
  runOnClickAndEnter('accessForm', 'eaSubmitBtn', ()=>{
    u.viewerProjectIds = eaMode.value==='all' ? 'all' : Array.from(document.querySelectorAll('.eaCheck:checked')).map(c=>c.value);
    u.viewerCanSeeAssignments = document.getElementById('eaCanSeeAssignments').checked;
    persist(); closeModal(); render();
  });
}

function showCredentialsModal(u){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Login for ${u.name}</h3>
        <div class="modal-sub">Share this with them directly. Passwords aren't shown again after this.</div>
        <div class="credential-box"><span>URL / username</span><span class="mono">${u.username}</span></div>
        <div class="credential-box" style="margin-top:8px;"><span>Password</span><span class="mono">${u.password}</span></div>
        <div class="modal-actions"><button class="btn btn-primary" data-close>Done</button></div>
      </div>
    </div>`;
  bindModalClose();
  document.querySelector('[data-close]').addEventListener('click', ()=>{ closeModal(); render(); });
}

function openChangePasswordModal(userId){
  if(!isAdmin()) return;
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;
  const isSelf = u.id===session.userId;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Change password</h3>
        <div class="modal-sub">${isSelf ? 'Set a new password for your own account.' : `For ${u.name} (${u.username})`}</div>
        <form id="pwForm">
          <div class="field"><label>New password</label><input id="pwNew" type="text" required></div>
          <div class="field"><label>Confirm password</label><input id="pwConfirm" type="text" required></div>
          <div class="hint">This replaces their current password immediately — they'll need to sign in with the new one next time.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="pwSubmitBtn" class="btn btn-primary">Update password</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  runOnClickAndEnter('pwForm', 'pwSubmitBtn', ()=>{
    const p1 = document.getElementById('pwNew').value;
    const p2 = document.getElementById('pwConfirm').value;
    const errEl = document.getElementById('pwForm');
    if(!p1 || p1.length<4){ document.getElementById('pwNew').focus(); return; }
    if(p1!==p2){ document.getElementById('pwConfirm').focus(); return; }
    u.password = p1;
    persist(); closeModal(); render();
  });
}

function openAddTeamModal(){
  if(!isAdmin()) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Create team</h3>
        <form id="teamForm">
          <div class="field"><label>Team name</label><input id="tName" required></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="teamSubmitBtn" class="btn btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  runOnClickAndEnter('teamForm', 'teamSubmitBtn', ()=>{
    const nameEl = document.getElementById('tName');
    if(!nameEl.value.trim()){ nameEl.focus(); return; }
    state.teams.push({ id: uid('team'), name: nameEl.value.trim(), checklist:[] });
    persist(); closeModal(); render();
  });
}

function openManageChecklistModal(teamId){
  if(!isAdmin()) return;
  const t = state.teams.find(x=>x.id===teamId);
  if(!t) return;
  if(!Array.isArray(t.checklist)) t.checklist = [];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>${t.name} checklist</h3>
        <div class="modal-sub">Shown to whoever's assigned when they try to close a task, on any workstream where checklists are required. They must tick every point before the task can close.</div>
        <div id="clItemsWrap" style="display:flex;flex-direction:column;gap:8px;margin:14px 0;">
          ${t.checklist.map(item=>`
            <div class="field-row" data-cl-item="${item.id}" style="align-items:center;">
              <input type="text" class="clItemText" value="${item.text.replace(/"/g,'&quot;')}" style="flex:1;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--paper);font-size:13px;">
              <button type="button" class="icon-btn" data-remove-cl-item="${item.id}" title="Remove">✕</button>
            </div>`).join('') || '<div class="hint">No checklist points yet — add one below.</div>'}
        </div>
        <div class="field-row">
          <input type="text" id="clNewItem" placeholder="e.g. Confirm QA sign-off before closing" style="flex:1;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--paper);font-size:13px;">
          <button type="button" class="btn btn-sm" id="clAddBtn">+ Add point</button>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-primary" id="clSaveBtn">Save checklist</button>
        </div>
      </div>
    </div>`;
  bindModalClose();
  const rerender = ()=>{ closeModal(); openManageChecklistModal(teamId); };
  document.querySelectorAll('[data-remove-cl-item]').forEach(b=>{
    b.addEventListener('click', ()=>{
      t.checklist = t.checklist.filter(i=>i.id!==b.dataset.removeClItem);
      rerender();
    });
  });
  document.getElementById('clAddBtn').addEventListener('click', ()=>{
    const val = document.getElementById('clNewItem').value.trim();
    if(!val) return;
    t.checklist.push({ id: uid('cl'), text: val });
    rerender();
  });
  document.getElementById('clSaveBtn').addEventListener('click', ()=>{
    document.querySelectorAll('[data-cl-item]').forEach(row=>{
      const id = row.dataset.clItem;
      const item = t.checklist.find(i=>i.id===id);
      const val = row.querySelector('.clItemText').value.trim();
      if(item && val) item.text = val;
    });
    persist(); closeModal(); render();
  });
}

function openAddProjectModal(){
  if(!isAdmin()) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal">
        <h3>Create workstream</h3>
        <form id="projForm">
          <div class="field"><label>Workstream name</label><input id="pName" required></div>
          <div class="field"><label>Start date</label><input type="date" id="pStart" value="${todayISO()}" required></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin:6px 0;"><input type="checkbox" id="pRequireChecklist"> Require each team's checklist before tasks can be closed</label>
          <div class="hint">If on, anyone closing a task here has to tick their team's checklist points first (set those up under Admin → Teams). Leave off for workstreams that don't need it.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancel</button>
            <button type="button" id="projSubmitBtn" class="btn btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>`;
  bindModalClose();
  runOnClickAndEnter('projForm', 'projSubmitBtn', ()=>{
    const nameEl = document.getElementById('pName');
    const startEl = document.getElementById('pStart');
    if(!nameEl.value.trim() || !startEl.value){ (nameEl.value.trim()?startEl:nameEl).focus(); return; }
    const p = { id: uid('proj'), name: nameEl.value.trim(), startDate: startEl.value, createdAt: todayISO(), requireChecklist: document.getElementById('pRequireChecklist').checked };
    state.projects.push(p); persist(); closeModal();
    ui.projectId = p.id; ui.view='project'; render();
  });
}

/* ============================== INIT ============================== */

(async function init(){
  loadAllInstant();
  render();
  reconcileWithStorage();
})();

// Keep the displayed clock live without disturbing anything else on screen —
// updates just the time text in place, on whichever of these elements currently exists.
setInterval(()=>{
  const t = nowTimeIST() + ' IST';
  const topbarEl = document.getElementById('topbarTime');
  if(topbarEl) topbarEl.textContent = t;
  const loginEl = document.getElementById('loginDateTime');
  if(loginEl) loginEl.textContent = `${fmtDate(todayISO())} · ${t}`;
}, 15000);
</script>
