        <div style="font-size:16px;font-weight:700;">${r.title}</div>
        ${contentHtml}
        <div style="font-size:11.5px;color:var(--paper-dim);font-family:var(--f-mono);margin-top:10px;">${dt.date} · ${dt.time}</div>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;">
          <button class="btn btn-sm btn-primary" id="remPopupCloseBtn">Close</button>
        </div>
      </div>`;
    document.getElementById('remPopupCloseBtn').addEventListener('click', ()=>{
      reminderPopupStage = 'confirm';
      renderReminderPopup();
    });
  } else {
    root.innerHTML = `
      <div style="position:fixed;top:24px;right:24px;z-index:200;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.24);padding:18px;">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Close it, or snooze it?</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <button class="btn btn-sm btn-ghost" data-snooze="15">Snooze 15m</button>
          <button class="btn btn-sm btn-ghost" data-snooze="30">Snooze 30m</button>
          <button class="btn btn-sm btn-ghost" data-snooze="60">Snooze 1h</button>
          <button class="btn btn-sm btn-ghost" data-snooze="180">Snooze 3h</button>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn-sm btn-primary" id="remPopupFinalCloseBtn">Close</button>
        </div>
      </div>`;
    root.querySelectorAll('[data-snooze]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        snoozeReminder(r, Number(btn.dataset.snooze));
        reminderPopupShowing = null;
        advanceReminderPopupQueue();
      });

      if(ui.view==='feature' && ui.featureNodeId==='h_reminders') render(); // refresh the list if they're looking at it
    });
  }
}

function bindAiAgentWidget(){
  const bubble = document.getElementById('aiBubbleBtn');
  if(bubble) bubble.addEventListener('click', ()=>{ ui.aiAgentOpen = !ui.aiAgentOpen; renderAiAgentWidget(); });
  const bubbleLabel = document.getElementById('aiBubbleLabel');
  if(bubbleLabel) bubbleLabel.addEventListener('click', ()=>{ ui.aiAgentOpen = true; renderAiAgentWidget(); });
  // Combined hover — since the label only ever appears alongside the bubble, hovering
  // either one triggers the same reaction on both, so they read as one connected
  // element rather than two independent pieces that happen to sit near each other.
  if(bubble && bubbleLabel){
    bubble.addEventListener('mouseenter', ()=> bubbleLabel.classList.add('ai-bubble-hover-active'));
    bubble.addEventListener('mouseleave', ()=> bubbleLabel.classList.remove('ai-bubble-hover-active'));
    bubbleLabel.addEventListener('mouseenter', ()=> bubble.classList.add('ai-bubble-hover-active'));
    bubbleLabel.addEventListener('mouseleave', ()=> bubble.classList.remove('ai-bubble-hover-active'));
  }
  const closeBtn = document.getElementById('aiPanelCloseBtn');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ ui.aiAgentOpen = false; renderAiAgentWidget(); });
  const minimizeBtn = document.getElementById('aiPanelMinimizeBtn');
  if(minimizeBtn) minimizeBtn.addEventListener('click', ()=>{ ui.aiAgentMinimized = !ui.aiAgentMinimized; renderAiAgentWidget(); });
  const shrinkBtn = document.getElementById('aiPanelShrinkBtn');
  if(shrinkBtn) shrinkBtn.addEventListener('click', ()=>{ ui.aiAgentHeightVh = Math.max(25, ui.aiAgentHeightVh - 10); renderAiAgentWidget(); });
  const growBtn = document.getElementById('aiPanelGrowBtn');
  if(growBtn) growBtn.addEventListener('click', ()=>{ ui.aiAgentHeightVh = Math.min(90, ui.aiAgentHeightVh + 10); renderAiAgentWidget(); });
  const sendBtn = document.getElementById('aiPanelSendBtn');
  const input = document.getElementById('aiPanelInput');
  if(sendBtn && input){
    sendBtn.addEventListener('click', submitAiAgentQuestion);
    input.addEventListener('input', ()=>{ aiAgentDraftText = input.value; });
    input.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submitAiAgentQuestion(); }
    });
  }
}

async function loadAiConversationHistory(userId){
  aiAgentMessages = []; // always start clean — never inherit whatever was here before, even if a fetch fails or finds nothing
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ai_conversations?user_id=eq.${userId}&select=messages`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer '+SUPABASE_ANON_KEY },
    });
    const rows = await res.json();
    if(Array.isArray(rows) && rows[0] && Array.isArray(rows[0].messages)){
      const cutoff = Date.now() - AI_HISTORY_RETENTION_DAYS*24*60*60*1000;
      // A message saved before timestamps existed has no 'at' field — treated as
      // past the cutoff, so it doesn't linger indefinitely just because it predates
      // this feature.
      aiAgentMessages = rows[0].messages.filter(m=> m.at && new Date(m.at).getTime() >= cutoff);
      renderAiAgentWidget();
    }
  }catch(e){ /* best-effort — a fresh, empty conversation is a fine fallback */ }
}

// Describes whatever the person is currently looking at, in a form both readable
// for a UI indicator and useful to hand to the backend as extra context — so asking
// "why is this delayed" while viewing a specific workstream doesn't require naming it.
// Formats a message's stored timestamp for display in the chat — just the time if
// it's from today, or the date plus time if it's from an earlier day (messages can
// be up to 10 days old, per the retention window).
function formatMessageTimestamp(atIso){
  if(!atIso) return '';
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  const d = new Date(new Date(atIso).getTime() + IST_OFFSET_MS);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  const msgDateIso = d.toISOString().slice(0,10);
  if(msgDateIso === todayISO()){
    return `${hh}:${mm}`;
  }
  const day = d.getUTCDate();
  const suffix = (day%10===1 && day!==11) ? 'st' : (day%10===2 && day!==12) ? 'nd' : (day%10===3 && day!==13) ? 'rd' : 'th';
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${day}${suffix} ${monthNames[d.getUTCMonth()]} , ${hh}:${mm}`;
}

async function submitAiAgentQuestion(){
  const input = document.getElementById('aiPanelInput');
  if(!input) return;
  const question = input.value.trim();
  if(!question || aiAgentThinking) return;
  const cu = currentUser();
  if(!cu) return;
  // Capture prior turns before adding this new question, so the backend can use them
  // for multi-turn memory — errors aren't real conversation turns, so they're excluded.
  const history = aiAgentMessages.filter(m=>m.role==='user' || m.role==='assistant');
  aiAgentMessages.push({role:'user', text:question, at: new Date().toISOString()});
  aiAgentThinking = true;
  aiAgentDraftText = '';
  renderAiAgentWidget();
  const newInput = document.getElementById('aiPanelInput');
  if(newInput) newInput.value = '';
  try{
    const res = await fetch(AI_AGENT_FUNCTION_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify({ question, userId: cu.id, history, pageContext: currentAiAgentContext() }),
    });
    const data = await res.json();
    if(data.error){
      aiAgentMessages.push({role:'error', text:data.error, at: new Date().toISOString()});
    } else {
      aiAgentMessages.push({role:'assistant', text:data.answer || 'No response received.', at: new Date().toISOString()});
    }
  } catch(e){
    aiAgentMessages.push({role:'error', text:'Could not reach Workspace CoPilot — check your connection and try again. (If you are viewing this through a Claude preview link rather than your real published site, outbound calls like this are expected to fail there.)', at: new Date().toISOString()});
  }
  aiAgentThinking = false;
  renderAiAgentWidget();
}

function bindLogin(){
  // belt-and-suspenders: if state is missing/corrupt by the time the login page shows, repair it now
  if(!state || !Array.isArray(state.users) || state.users.length === 0){
    state = seedState();
    persist();
  }
  const resetBtn = document.getElementById('resetDataBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      state = seedState();
      session = { userId:null };
      try{ await persist(); }catch(e){}
      try{ await persistSession(); }catch(e){}
      ui.loginError = 'App data reset to the demo defaults.';
      render();
    });
  }
  runOnClickAndEnter('loginForm', 'loginSubmitBtn', ()=>{
    try{
      const uEl = document.getElementById('loginUser');
      const pEl = document.getElementById('loginPass');
      const u = uEl.value.trim().toLowerCase();
      const p = pEl.value.trim();
      if(!u || !p){ ui.loginError = 'Enter both a username and a password.'; render(); return; }
      if(!state || !Array.isArray(state.users) || state.users.length===0){ state = seedState(); persist(); }
      const match = state.users.find(x=> x.username.toLowerCase()===u && x.password===p);
      if(!match){ ui.loginError = 'Username or password not recognized. Check for extra spaces or try one of the demo logins below.'; render(); return; }
      session.userId = match.id; persistSession();
      ui.loginError='';
      ui.view='home';
      try{
        runSummaryEngine();
        checkAndShowSummaryPopup();
      }catch(summaryErr){
        console.error('Summary engine failed (non-fatal):', summaryErr);
      }
      render();
      loadAiConversationHistory(match.id); // fire-and-forget — never delays login itself
    }catch(err){
      ui.loginError = 'Sign-in hit an unexpected error: ' + (err && err.message ? err.message : err);
      render();
    }
  });
}

// All descendant node IDs under a given node, recursively — used so that landing on a
// Heading found by name shows everything underneath it expanded, not just one level.
// Splits a query into individual words and checks that every one of them appears
// somewhere in the haystack, in any order, not necessarily adjacent — so "figma
// wallet" matches "...Figma...JCE Wallet Mobile App..." even though those two words
// aren't next to each other in the original text.
function queryTerms(query){
  return query.trim().toLowerCase().split(/\s+/).filter(Boolean);
}
function matchesAllTerms(haystack, terms){
  if(!terms.length) return false;
  const h = haystack.toLowerCase();
  return terms.every(term => h.includes(term));
}

function allDescendantNodeIds(nodeId){
  const ids = [];
  featureChildren(nodeId).forEach(child=>{
    ids.push(child.id);
    ids.push(...allDescendantNodeIds(child.id));
  });
  return ids;
}

// Full Workspace Search — covers everything that's genuinely text-based and within
// the searching user's own access: workstream names, task text, Repository/FAI/Policies
// content (full text for Text/Link, title-only for Image/Document/Video since their
// contents aren't extracted), workstream-level content, and Daily/Weekly Summaries.
function searchWorkspace(query){
  const terms = queryTerms(query);
  if(!terms.length) return [];
  const visibleProjIds = new Set(visibleProjects().map(p=>p.id));

  // Keyed by the exact displayed path — when a Heading's own name matches AND a
  // content item living directly inside it (with no title of its own) produces the
  // identical path, they're the same effective destination and should show once, not
  // twice. Whichever result actually has a destination to show (a URL) wins.
  const resultMap = new Map();
  function addResult(r){
    const existing = resultMap.get(r.label);
    if(!existing || (r.url && !existing.url)) resultMap.set(r.label, r);
  }

  visibleProjects().forEach(p=>{
    if(matchesAllTerms(p.name, terms)){
      addResult({type:'Workstream', label:p.name, go:()=>{ ui.projectId=p.id; ui.view='project'; render(); }});
    }
  });

  // Module / Heading / Sub Heading names themselves — landing on one expands
  // everything nested underneath it (its own content and every descendant), so
  // whatever the person was looking for is immediately visible.
  state.featureNodes.forEach(node=>{
    if(!canSeeNode(node.id)) return;
    if(!matchesAllTerms(node.name, terms)) return;
    const typeLabel = node.nodeType==='feature' ? 'Module' : node.nodeType==='heading' ? 'Heading' : 'Sub Heading';
    const pathStr = featureNodePath(node.id).map(n=>n.name).join('>');
    addResult({type:typeLabel, label:pathStr, go:()=>{
      ui.expandNodeIds = [node.id, ...allDescendantNodeIds(node.id)];
      if(node.systemView){ ui.view = node.systemView; }
      else { ui.view='feature'; ui.featureNodeId=node.id; }
      render();
    }});
  });

  state.tasks.forEach(t=>{
    if(!visibleProjIds.has(t.projectId)) return;
    const haystack = [t.title, t.description, t.reason, t.blockerReason].filter(Boolean).join(' ');
    if(matchesAllTerms(haystack, terms)){
      const proj = state.projects.find(p=>p.id===t.projectId);
      addResult({type:'Task', label:(t.title||'Untitled task')+(proj?'>'+proj.name:''), go:()=>{ ui.projectId=t.projectId; ui.view='project'; render(); openTaskDetailsModal(t.id); }});
    }
  });

  // Content items match on the combination of their own text AND the path they live
  // under — so a term like "figma" (only present in the ancestor Heading's name) can
  // combine with a term like "wallet" (only present in the item's own title).
  state.featureNodes.forEach(node=>{
    if(!canSeeNode(node.id)) return;
    const pathStr = featureNodePath(node.id).map(n=>n.name).join('>');
    (node.contentItems||[]).forEach(item=>{
      const haystack = [pathStr, item.title, item.fileName, item.type==='text'?item.text:'', item.type==='link'?item.url:''].filter(Boolean).join(' ');
      if(matchesAllTerms(haystack, terms)){
        const fullLabel = item.title ? `${pathStr}>${item.title}` : pathStr;
        const ancestorIds = featureNodePath(node.id).map(n=>n.id);
        addResult({type:'Content', label:fullLabel, url: (item.type==='link'?item.url:null), go:()=>{
          ui.expandNodeIds = ancestorIds;
          ui.view='feature'; ui.featureNodeId=node.id;
          render();
          openContentItemPreviewModal(node.id, item.id);
        }});
      }
    });
  });

  visibleProjects().forEach(p=>{
    (p.contentItems||[]).forEach(item=>{
      const haystack = [p.name, item.title, item.fileName, item.type==='text'?item.text:''].filter(Boolean).join(' ');
      if(matchesAllTerms(haystack, terms)){
        const fullLabel2 = item.title ? `Workstream>${p.name}>${item.title}` : `Workstream>${p.name}`;
        addResult({type:'Workstream content', label:fullLabel2, url:(item.type==='link'?item.url:null), go:()=>{ ui.projectId=p.id; ui.view='project'; render(); openProjectContentPreviewModal(p.id, item.id); }});
      }
    });
  });

  searchAllSummaries(query).forEach(r=>{
    const label = r.kind==='daily' ? `${r.workstream.title}>${fmtDate(r.date)} (daily summary)` : `${r.workstream.title}>week of ${fmtDate(r.weekStart)} (weekly summary)`;
    addResult({type:'Summary', label, go:()=>{
      if(r.kind==='daily') openSummaryPopup('daily', state.dailySummaries[r.date]);
      else openSummaryPopup('weekly', state.weeklySummaries[r.weekStart]);
    }});
  });

  return Array.from(resultMap.values());
}

function renderPortfolio(){
  const allProjects = visibleProjects();
  const today0 = todayISO();
  let summaries = allProjects.map(p=>{
    const tl = projectTimeline(p.id);
    const tasks = projectTasks(p.id);
    const closed = tasks.filter(t=>t.status==='closed').length;
    const pct = tasks.length ? Math.round(closed/tasks.length*100) : 0;
    const isClosedProject = tasks.length>0 && closed===tasks.length;
    const isFutureProject = p.startDate > today0;
    return { p, tl, tasks, closed, pct, isClosedProject, isFutureProject };
  });

  const filter = ui.portfolioFilter || 'open';
  const filtered = summaries.filter(s=>{
    if(filter==='all') return true;
    if(filter==='closed') return s.isClosedProject;
    if(filter==='future') return s.isFutureProject;
    return !s.isClosedProject && !s.isFutureProject; // 'open' — default
  });

  const onTrack = filtered.filter(s=>!s.tl.isRed).length;
  const delayed = filtered.filter(s=>s.tl.isRed).length;
  const tasksTracked = filtered.reduce((sum,s)=>sum+s.tasks.length, 0);

  const cards = filtered.map(s=>{
    const status = s.tl.isRed ? 'red':'green';
    const deadline = s.tl.originalDeadline || addDays(s.p.startDate, s.tl.originalTotal);
    const blockingTeams = blockedTeamsForProject(s.p.id);
    const delayNames = status==='red' ? delayResponsibleNames(s.p.id) : [];
    const lastClosedDate = s.isClosedProject ? s.tasks.reduce((max,t)=> (t.closedDate && (!max || t.closedDate > max)) ? t.closedDate : max, null) : null;
    return `
    <div class="proj-card status-${status}" data-open-project="${s.p.id}">
      <div class="pname" style="margin:2px 0 4px;">${s.p.name}</div>
      <div class="eyebrow" style="margin-bottom:10px;">${s.tasks.length} task${s.tasks.length===1?'':'s'}</div>
      <div style="margin-bottom:10px;">${pill(s.isClosedProject?'green':'amber', s.isClosedProject?'Closed':(s.isFutureProject?'Future':'Open'))}</div>
      <div class="proj-meta" style="margin-top:0;">
        <span>STARTED <b style="color:var(--paper);">${fmtDate(s.p.startDate)}</b></span>
        <span>DEADLINE <b style="color:var(--paper);">${fmtDate(deadline)}</b></span>
      </div>
      ${lastClosedDate ? `<div class="proj-meta" style="margin-top:4px;"><span>CLOSED <b style="color:var(--paper);">${fmtDate(lastClosedDate)}</b></span></div>` : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
        ${pill(status, status==='red' ? `Delayed ${s.tl.delay}d${delayNames.length ? ' by '+delayNames.join(', ') : ''}` : 'On agreed timeline')}
        ${blockingTeams.length ? `<span class="pill pill-blocker pill-blink" title="${blockedDetailForProject(s.p.id).replace(/"/g,'&quot;')}"><span class="dot"></span>Blocked by ${blockingTeams.join(', ')}</span>` : ''}
      </div>
      <div class="proj-meta" style="margin-top:14px;">
        <span>${s.pct}% PROGRESS</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${status==='red'?'red':''}" style="width:${s.pct}%"></div></div>
    </div>`;
  }).join('');

  return `
    <div class="eyebrow">Workstream</div>
    <h1 class="page-title" style="margin-bottom:16px;">All workstreams, one board</h1>

    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${filtered.length}</div><div class="l">Workstreams</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--green);">${onTrack}</div><div class="l">On agreed timeline</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--red);">${delayed}</div><div class="l">Delayed</div></div>
      <div class="stat-chip"><div class="n">${tasksTracked}</div><div class="l">Tasks tracked</div></div>
    </div>

    <div class="filters">
      <select id="portfolioFilter">
        <option value="open" ${filter==='open'?'selected':''}>Open workstreams</option>
        <option value="closed" ${filter==='closed'?'selected':''}>Closed workstreams</option>
        <option value="future" ${filter==='future'?'selected':''}>Future workstreams</option>
        <option value="all" ${filter==='all'?'selected':''}>All workstreams</option>
      </select>
    </div>

    <div class="grid g3">
      ${cards || `<div class="empty-state"><div class="et">No workstreams to show</div>${allProjects.length ? 'Try a different filter.' : 'Create one from Admin.'}</div>`}
    </div>
    ${isAdmin() ? `<div style="margin-top:22px;"><button class="btn btn-primary" data-nav="admin">+ New workstream</button></div>` : ''}
  `;
}

/* ============================== FEATURE TREE (Knowledge system) ============================== */

function featureChildren(parentId){
  return state.featureNodes.filter(n=>n.parentId===parentId).sort((a,b)=>(a.order||0)-(b.order||0));
}
function featureNode(id){ return state.featureNodes.find(n=>n.id===id); }
function featureNodePath(id){
  const path=[]; let cur=featureNode(id);
  while(cur){ path.unshift(cur); cur = cur.parentId ? featureNode(cur.parentId) : null; }
  return path;
}
// A node is explicitly granted if it's in this user's own access list.
function hasDirectNodeAccess(userId, nodeId){
  const arr = (state.userAccess && state.userAccess[userId]) || [];
  return arr.includes(nodeId);
}
// A node should be visible if it's directly granted, OR if something granted lives
// underneath it — otherwise a granted Sub Heading would be unreachable because its
// parent Module/Feature/Heading was never itself ticked.
function hasNodeAccessOrDescendant(userId, nodeId){
  if(hasDirectNodeAccess(userId, nodeId)) return true;
  return featureChildren(nodeId).some(child => hasNodeAccessOrDescendant(userId, child.id));
}
// The single check to use anywhere a node's visibility matters — admins always pass.
function canSeeNode(nodeId){
  if(isAdmin()) return true;
  const cu = currentUser();
  if(!cu) return false;
  // Summary module is granted at the module level only — Year and Month nodes
  // underneath it are never individually ticked; once someone has the module, they
  // see everything in it (filtered by their own workstream access, same as always).
  const path = featureNodePath(nodeId);
  if(path.some(n=>n.id==='feat_summary')){
    return hasDirectNodeAccess(cu.id, 'feat_summary');
  }
  return hasNodeAccessOrDescendant(cu.id, nodeId);
}
// Root Modules a non-admin can see at all — new Modules are invisible to everyone
// until explicitly granted, by construction (they simply won't be in anyone's list yet).
function rootFeatureNodesVisible(){
  const roots = state.featureNodes.filter(n=>n.parentId===null && n.id!=='feat_ai_agent').sort((a,b)=>(a.order||0)-(b.order||0));
  return roots.filter(n=>canSeeNode(n.id));
}
function nextOrderFor(parentId){
  const sibs = featureChildren(parentId);
  return sibs.length ? Math.max(...sibs.map(s=>s.order||0))+1 : 1;
}
function countDescendants(nodeId){
  let count=0;
  featureChildren(nodeId).forEach(k=>{ count += 1 + countDescendants(k.id); });
  return count;
}
function deleteNodeCascade(nodeId){
  featureChildren(nodeId).forEach(k=> deleteNodeCascade(k.id));
  state.featureNodes = state.featureNodes.filter(n=>n.id!==nodeId);
}

/* ============================== ATTENDANCE SHEET (special Heading view) ============================== */

const ATT_STATUS = { P:{label:'Present',color:'#1F8A47'}, L:{label:'Leave',color:'#B8791A'}, WFH:{label:'Work from home',color:'#3D74A8'}, NS:{label:'No show',color:'#B8362D'}, H:{label:'Holiday',color:'#7A4F96'}, CO:{label:'Comp off',color:'#347F77'} };

function attendanceKey(userId, date){ return userId+'|'+date; }
function getAttendance(userId, date){ return state.attendance[attendanceKey(userId,date)] || null; }

// For a task assigned to a specific person, summarizes any Leave/WFH days across its
// active date range — from start date through today if still open (so it keeps
// growing day by day while the task remains open), or through its actual close date
// if closed. Only Leave and WFH are considered; every other status is ignored.
// Consecutive days of the same status collapse into one range rather than listing
// each day separately.
// Who can see Leave/WFH badges on a workstream's Handoff Rail: admins always; anyone
// who actually has a task of their own in this specific workstream; and viewers who've
// been explicitly granted read-only access to this workstream, even without a task of
// their own there. Nobody else — general workstream visibility alone isn't enough.
function canSeeAttendanceBadges(projectId){
  if(isAdmin()) return true;
  const cu = currentUser();
  if(!cu) return false;
  const hasOwnTask = state.tasks.some(t=>t.projectId===projectId && (
    (t.assignedType==='user' && t.assignedId===cu.id) ||
    (t.assignedType==='team' && t.assignedId===cu.teamId)
  ));
  if(hasOwnTask) return true;
  if(cu.role==='viewer'){
    if(cu.viewerProjectIds==='all') return true;
    if(Array.isArray(cu.viewerProjectIds) && cu.viewerProjectIds.includes(projectId)) return true;
  }
  return false;
}

function taskAttendanceSummary(t){
  if(t.assignedType!=='user' || !t.assignedId || !t.startDate) return null;
  const rangeEnd = t.status==='closed' ? (t.closedDate||t.startDate) : todayISO();
  if(rangeEnd < t.startDate) return null;
  const days = [];
  let cur = t.startDate;
  while(cur <= rangeEnd){
    const status = getAttendance(t.assignedId, cur);
    if(status==='L' || status==='WFH') days.push({date:cur, status});
    cur = addDays(cur, 1);
  }
  if(!days.length) return null;
  // Group consecutive days sharing the same status into ranges
  const groups = [];
  days.forEach(d=>{
    const last = groups[groups.length-1];
    if(last && last.status===d.status && addDays(last.end,1)===d.date){
      last.end = d.date;
    } else {
      groups.push({status:d.status, start:d.date, end:d.date});
    }
  });
  const label = groups.map(g=>{
    const statusName = g.status==='L' ? 'Leave' : 'WFH';
    return g.start===g.end ? `${statusName} ${fmtDateOrdinal(g.start)}` : `${statusName} ${fmtDateOrdinal(g.start)} till ${fmtDateOrdinal(g.end)}`;
  }).join(', ');
  return { groups, label, hasLeave: groups.some(g=>g.status==='L'), hasWFH: groups.some(g=>g.status==='WFH') };
}
function setAttendanceValue(userId, date, status){
  const key = attendanceKey(userId,date);
  if(status) state.attendance[key] = status; else delete state.attendance[key];
}
// Always the current month plus the two before it — a rolling window, not dependent
// on whether data actually exists for those months yet.
function last3Months(){
  const [y,m] = todayISO().split('-').map(Number);
  const months = [];
  for(let i=0;i<3;i++){
    let mm=m-i, yy=y;
    while(mm<1){ mm+=12; yy--; }
    months.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return months;
}
function monthLabelLong(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
}

function renderAttendanceSheet(node){
  const months = last3Months();
  const monthKey = (ui.attendanceMonth && months.includes(ui.attendanceMonth)) ? ui.attendanceMonth : months[0];
  const [y,m] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const admin = isAdmin();

  // Admins see the whole team; anyone else only ever sees their own attendance row.
  const rows = admin ? state.users.filter(u=>u.role!=='viewer') : (cu ? [cu] : []);

  const dayHeaders = Array.from({length:daysInMonth},(_,i)=>{
    const day=i+1;

    return `<th class="att-daycol${isWeekendISO(dateISO)?' att-weekend-col':''}">${day}</th>`;
  }).join('');

  const bodyRows = rows.map(u=>{
    const cells = Array.from({length:daysInMonth},(_,i)=>{
      const day=i+1;

      const weekend = isWeekendISO(dateISO);

      } else {

      }
      const clickAttr = admin ? (weekend ? ` data-att-weekend="${u.id}|${dateISO}"` : ` data-att-weekday="${u.id}|${dateISO}"`) : '';
      const cls = `att-cell${weekend?' att-weekend':''}${admin?' att-clickable':''}`;

    }).join('');
    return `<tr><td style="width:70px;font-family:var(--f-mono);font-size:11px;white-space:nowrap;">${u.employeeId||''}</td><td class="att-name">${u.name}</td>${cells}</tr>`;

  const legend = Object.entries(ATT_STATUS).map(([code,v])=>
    `<span style="font-size:11px;color:var(--paper-dim);margin-right:14px;"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${v.color};margin-right:5px;"></span>${code} = ${v.label}</span>`
  ).join('') + `<span style="font-size:11px;color:var(--paper-dim);"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--panel-raised);border:1px dashed var(--paper-faint);margin-right:5px;"></span>WO = Weekly off${admin?' — click to mark Present, click again to revert':''}</span>`;

  return `
    <div class="eyebrow">Heading</div>
    <h1 class="page-title" style="margin-bottom:4px;">${node.name}</h1>
    <div class="muted" style="font-size:15px;font-family:var(--f-display);margin-bottom:16px;">${monthLabelLong(monthKey)}</div>

    <div class="filters" style="margin-bottom:14px;">
      <select id="attMonthSelect">
        ${months.map(mk=>`<option value="${mk}" ${mk===monthKey?'selected':''}>${monthLabelLong(mk)}</option>`).join('')}
      </select>
    </div>

    <div style="margin-bottom:14px;">${legend}</div>

    <div class="att-wrap">
      <table class="att-table">
        <thead><tr><th style="width:70px;font-family:var(--f-mono);font-size:11px;white-space:nowrap;">Employee ID</th><th class="att-name-col">Name</th>${dayHeaders}</tr></thead>
        <tbody>${bodyRows || `<tr><td colspan="${daysInMonth+2}" class="empty-state">No one to show yet.</td></tr>`}</tbody>
      </table>
    </div>
    ${!admin ? '<div class="footnote">Only admins can enter attendance.</div>' : ''}
  `;
}

function bindAttendanceSheet(){
  const sel = document.getElementById('attMonthSelect');
  if(sel) sel.addEventListener('change', ()=>{ ui.attendanceMonth = sel.value; render(); });

  document.querySelectorAll('[data-att-weekday]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [userId,date] = el.dataset.attWeekday.split('|');
      const cur = getAttendance(userId,date);
      const cycle = ['','P','L','WFH','NS','H'];
      const next = cycle[(cycle.indexOf(cur||'')+1) % cycle.length];
      setAttendanceValue(userId,date, next || null);
      persist(); render();
    });
  });

  document.querySelectorAll('[data-att-weekend]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [userId,date] = el.dataset.attWeekend.split('|');
      const cur = getAttendance(userId,date);
      if(cur){
        openRevertAttendanceConfirm(date, ()=>{ setAttendanceValue(userId,date,null); persist(); render(); }, ATT_STATUS[cur]?ATT_STATUS[cur].label:cur);
      } else {
        setAttendanceValue(userId,date,'P');
        persist(); render();
      }
    });
  });
}

// "X yr Y mo" from a Date-of-Joining to today — purely for display.
function tenureLabel(doj){
  if(!doj) return '—';
  const start = new Date(doj+'T00:00:00');
  const now = new Date(todayISO()+'T00:00:00');
  if(isNaN(start.getTime()) || start > now) return '—';
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  if(now.getDate() < start.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  const parts = [];
  if(years>0) parts.push(`${years} yr`);
  parts.push(`${months} mo`);
  return parts.join(' ');
}
// A review is overdue once a full year has passed since the last appraisal date.
function isAppraisalOverdue(lastDate){
  if(!lastDate) return false;
  return todayISO() > addDays(lastDate, 365);
}
function fmtMoney(n){

}

/* ============================== DAILY & WEEKLY SUMMARY ENGINE ============================== */

// A workstream counts as "open" for summary purposes unless every one of its tasks is closed.
function isProjectOpenForSummary(p){
  const tasks = projectTasks(p.id);
  return !(tasks.length>0 && tasks.every(t=>t.status==='closed'));
}

// Captures today's state for every open workstream, once per calendar day. Cheap to
// call on every load — it no-ops instantly once today's snapshot already exists.
function captureSnapshotIfNeeded(){
  const today = todayISO();
  let changed = false;
  state.projects.filter(isProjectOpenForSummary).forEach(p=>{
    const key = p.id+'|'+today;
    if(state.dailySnapshots[key]) return;
    const tasks = projectTasks(p.id);
    const tl = projectTimeline(p.id);
    const closed = tasks.filter(t=>t.status==='closed').length;
    const overdue = tasks.filter(t=>t.status!=='closed' && isTaskDelayed(t)).length;
    state.dailySnapshots[key] = {
      projectId: p.id, date: today,
      progressPct: tasks.length ? Math.round(closed/tasks.length*100) : 0,
      isRed: tl.isRed, delay: tl.delay,
      totalTasks: tasks.length, closedTasks: closed, overdueTasks: overdue,
      extended: tasks.filter(t=>t.extended).map(t=>({
        taskId: t.id, title: t.title,
        reason: (t.extensionHistory && t.extensionHistory.length) ? t.extensionHistory[t.extensionHistory.length-1].reason : ''
      })),
      blockers: tasks.filter(t=>t.blockedByUserId).map(t=>({
        taskId: t.id, taskTitle: t.title, blockedByUserId: t.blockedByUserId,
        assignedName: entityName(t.assignedType, t.assignedId), blockerReason: t.blockerReason
      }))
    };
    changed = true;
  });
  if(changed) persist();
}

// Adds the Year Heading and Month Sub Heading under the Summary module if this is the
// first summary ever generated for that year/month. Negative order values make the
// latest year/month sort first, since siblings sort ascending by order.
function ensureSummaryYearMonth(dateISO){
  const year = dateISO.slice(0,4);
  const monthKey = dateISO.slice(0,7);
  let yearNode = state.featureNodes.find(n=>n.parentId==='feat_summary' && n.nodeType==='heading' && n.name===year);
  if(!yearNode){
    yearNode = {id: uid('syear'), name: year, nodeType:'heading', parentId:'feat_summary', order: -Number(year), contentItems:[], description:''};
    state.featureNodes.push(yearNode);
  }
  const monthLabel = monthLabelLong(monthKey);
  let monthNode = state.featureNodes.find(n=>n.parentId===yearNode.id && n.name===monthLabel);
  if(!monthNode){
    monthNode = {id: uid('smonth'), name: monthLabel, nodeType:'subheading', parentId: yearNode.id, order: -Number(monthKey.replace('-','')), contentItems:[], description:'', specialView:'summaryCalendar', summaryMonthKey: monthKey};
    state.featureNodes.push(monthNode);
  }
}

// One workstream's entry within a generated summary — shared shape for daily and weekly.
function buildSummaryEntry(proj, snap, prevSnap){
  const isFullyClosed = snap.totalTasks>0 && snap.closedTasks===snap.totalTasks;
  const statusText = isFullyClosed ? 'Completed — all tasks closed' : (snap.isRed ? `Delay -${snap.delay}` : 'On Agreed timeline');
  let progressText;
  if(!prevSnap){
    progressText = 'First summary — no prior data to compare yet';
  } else if(snap.progressPct === prevSnap.progressPct){
    progressText = `No Progress, still at ${snap.progressPct}%`;
  } else {
    progressText = `Progress from ${prevSnap.progressPct}% to ${snap.progressPct}%`;
  }
  const taskStatusLines = [`${snap.closedTasks} of ${snap.totalTasks} tasks closed`];
  if(snap.overdueTasks>0) taskStatusLines.push(`${snap.overdueTasks} of ${snap.totalTasks} tasks is overdue`);
  (snap.extended||[]).forEach(e=>{
    taskStatusLines.push(`1 task timeline has been extended — "${e.title}": ${e.reason || 'no reason given'}`);
  });
  const prevBlockedTaskIds = new Set((prevSnap && prevSnap.blockers ? prevSnap.blockers : []).map(b=>b.taskId));
  const blockerLines = (snap.blockers||[]).map(b=>{
    const blockerName = entityName('user', b.blockedByUserId);
    return prevBlockedTaskIds.has(b.taskId)
      ? `Still being blocked by ${blockerName}: ${b.blockerReason || 'no reason given'}`
      : `${b.assignedName} has added ${blockerName} as blocker: ${b.blockerReason || 'no reason given'}`;
  });
  return { projectId: proj.id, title: proj.name, status: statusText, progress: progressText, taskStatusLines, blockerLines };
}

// Generates yesterday's daily summary the first time anyone opens the app on or after
// the day after — never generates the same date twice.
function generateDailySummaryIfNeeded(){
  const y = addDays(todayISO(), -1);
  if(state.dailySummaries[y]) return;
  const dayBefore = addDays(y, -1);
  const projectIds = new Set();
  Object.values(state.dailySnapshots).forEach(s=>{ if(s.date===y) projectIds.add(s.projectId); });
  if(projectIds.size===0) return;
  const workstreams = Array.from(projectIds).map(pid=>{
    const proj = state.projects.find(p=>p.id===pid);
    if(!proj) return null;
    const snap = state.dailySnapshots[pid+'|'+y];
    const prevSnap = state.dailySnapshots[pid+'|'+dayBefore] || null;
    return buildSummaryEntry(proj, snap, prevSnap);
  }).filter(Boolean);
  if(!workstreams.length) return;
  state.dailySummaries[y] = { date: y, generatedAt: todayISO(), workstreams };
  ensureSummaryYearMonth(y);
  persist();
}

// A week is always Monday-Friday. Given any date, returns that week's Monday.
function mondayOf(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

// Generates last week's summary every Monday, comparing that week's Friday snapshot
// (the last working day) to the Friday before it. Never regenerates the same week.
function generateWeeklySummaryIfNeeded(){
  const todayD = new Date(todayISO()+'T00:00:00');
  if(todayD.getDay() !== 1) return; // only ever runs on a Monday
  const lastFriday = addDays(todayISO(), -3);
  const lastMonday = mondayOf(lastFriday);
  if(state.weeklySummaries[lastMonday]) return;
  const priorFriday = addDays(lastMonday, -3);
  const projectIds = new Set();
  Object.values(state.dailySnapshots).forEach(s=>{ if(s.date===lastFriday) projectIds.add(s.projectId); });
  if(projectIds.size===0) return;
  const workstreams = Array.from(projectIds).map(pid=>{
    const proj = state.projects.find(p=>p.id===pid);
    if(!proj) return null;
    const snap = state.dailySnapshots[pid+'|'+lastFriday];
    const prevSnap = state.dailySnapshots[pid+'|'+priorFriday] || null;
    return buildSummaryEntry(proj, snap, prevSnap);
  }).filter(Boolean);
  if(!workstreams.length) return;
  state.weeklySummaries[lastMonday] = { weekStart: lastMonday, weekEnd: lastFriday, generatedAt: todayISO(), workstreams };
  ensureSummaryYearMonth(lastMonday);
  persist();
}

// Runs the whole engine — call once per app load, after state is loaded.
function runSummaryEngine(){
  captureSnapshotIfNeeded();
  generateDailySummaryIfNeeded();
  generateWeeklySummaryIfNeeded();
}

// Shows today's popup if it's past noon and this person hasn't seen it yet — daily on
// Tue-Sat (summarizing yesterday), weekly on Monday (summarizing last Mon-Fri). Silent
// on Sunday, and silent if nothing in the summary is visible to this particular viewer.
function checkAndShowSummaryPopup(){
  const cu = currentUser();
  if(!cu) return;
  const IST_OFFSET_MS = (5*60+30)*60*1000;
  const now = new Date(Date.now() + IST_OFFSET_MS);
  if(now.getUTCHours() < 12) return;
  const dow = now.getUTCDay();
  const today = todayISO();
  if(!state.summaryShownLog[cu.id]) state.summaryShownLog[cu.id] = {};
  const log = state.summaryShownLog[cu.id];

  if(dow===1){
    const lastFriday = addDays(today, -3);
    const lastMonday = mondayOf(lastFriday);
    if(log.lastWeeklyShown === lastMonday) return;
    const weekly = state.weeklySummaries[lastMonday];
    if(!weekly) return;
    log.lastWeeklyShown = lastMonday;
    persist();
    openSummaryPopup('weekly', weekly);
  } else if(dow>=2 && dow<=6){
    const yesterday = addDays(today, -1);
    if(log.lastDailyShown === yesterday) return;
    const daily = state.dailySummaries[yesterday];
    if(!daily) return;
    log.lastDailyShown = yesterday;
    persist();
    openSummaryPopup('daily', daily);
  }
}

function openSummaryPopup(kind, summaryData){
  const accessible = accessibleProjectIds();
  const visible = summaryData.workstreams.filter(w=> accessible===null || accessible.includes(w.projectId));
  if(!visible.length) return;
  const title = kind==='daily' ? 'Daily Workstream' : 'Weekly Workstream';
  const dateLabel = kind==='daily' ? fmtDate(summaryData.date) : `${fmtDate(summaryData.weekStart)} — ${fmtDate(summaryData.weekEnd)}`;
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-backdrop" style="z-index:70;">
      <div class="modal" style="max-width:640px;max-height:80vh;overflow-y:auto;">
        <h3>${title}</h3>

        ${renderSummaryBlocks(visible)}
        <div class="modal-actions"><button class="btn btn-primary" id="summaryPopupClose">Close</button></div>
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelector('#summaryPopupClose').addEventListener('click', ()=> div.remove());
}

// The calendar page for one Month sub-heading. Every date maps to whichever summary
// would have actually popped up on that date: Monday shows the week before's weekly
// summary, Tue-Sat show the prior day's daily summary, Sunday has nothing.
function renderSummaryCalendar(node){
  const monthKey = node.summaryMonthKey;
  const [y,m] = monthKey.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const firstDow = new Date(y,m-1,1).getDay();

  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('<div class="sumcal-cell sumcal-blank"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const dateISO = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(dateISO+'T00:00:00').getDay();
    let hasSummary = false;
    if(dow===1){
      const priorMonday = mondayOf(addDays(dateISO, -3));
      hasSummary = !!state.weeklySummaries[priorMonday];
    } else if(dow>=2 && dow<=6){
      hasSummary = !!state.dailySummaries[addDays(dateISO, -1)];
    }
    cells.push(`<div class="sumcal-cell${hasSummary?' sumcal-has-summary':''}"${hasSummary?` data-summary-date="${dateISO}"`:''}>${d}</div>`);
  }

  return `
    <div class="eyebrow">Summary Calendar</div>
    <h1 class="page-title" style="display:inline-block;margin-bottom:20px;background:var(--amber);color:#fff;padding:8px 18px;border-radius:9px;font-size:24px;box-shadow:0 2px 8px var(--amber-glow);">${node.name}</h1>
    <div class="hint" style="margin-bottom:14px;">Click a highlighted date to see the summary that appeared that day.</div>
    <div class="sumcal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="sumcal-dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div>
  `;
}

function bindSummaryCalendar(node){
  document.querySelectorAll('[data-summary-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const dateISO = cell.dataset.summaryDate;
      const dow = new Date(dateISO+'T00:00:00').getDay();
      if(dow===1){
        const priorMonday = mondayOf(addDays(dateISO, -3));
        const weekly = state.weeklySummaries[priorMonday];
        if(weekly) openSummaryPopup('weekly', weekly);
      } else {
        const daily = state.dailySummaries[addDays(dateISO, -1)];
        if(daily) openSummaryPopup('daily', daily);
      }
    });
  });
}

// Free-text search across every stored daily and weekly summary — matches workstream
// names, status text, progress lines, task lines, and blocker lines.
function searchAllSummaries(query){
  const terms = queryTerms(query);
  if(!terms.length) return [];
  const accessible = accessibleProjectIds();
  const results = [];
  Object.values(state.dailySummaries).forEach(summary=>{
    summary.workstreams.forEach(w=>{
      if(accessible!==null && !accessible.includes(w.projectId)) return;
      const haystack = [w.title, w.status, w.progress, ...w.taskStatusLines, ...w.blockerLines].join(' ');
      if(matchesAllTerms(haystack, terms)) results.push({kind:'daily', date: summary.date, workstream: w});
    });
  });
  Object.values(state.weeklySummaries).forEach(summary=>{
    summary.workstreams.forEach(w=>{
      if(accessible!==null && !accessible.includes(w.projectId)) return;
      const haystack = [w.title, w.status, w.progress, ...w.taskStatusLines, ...w.blockerLines].join(' ');
      if(matchesAllTerms(haystack, terms)) results.push({kind:'weekly', weekStart: summary.weekStart, workstream: w});
    });
  });
  return results;
}

function renderContentItem(it, headingId){
  if(it.type==='link') return `<div class="content-item"><a href="${it.url}" target="_blank" rel="noopener" class="ci-link">🔗 ${it.title||it.url}</a></div>`;

// A Sub Heading, rendered inline within its ancestor Heading's own page — always

    return `

    <div style="position:relative;">
      ${renderContentItem(it, h.id)}

    </div>`).join('');

    <div class="heading-card" style="margin-left:${depth*20}px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div data-toggle-heading="${h.id}" style="cursor:pointer;display:flex;align-items:center;gap:8px;">

        </div>

function renderFeatureNode(){
  const node = featureNode(ui.featureNodeId);
  if(!node) return `<div class="empty-state"><div class="et">Not found</div></div>`;

  if(node.specialView==='attendance'){
    return renderAttendanceSheet(node);
  }
  if(node.specialView==='appraisal'){
    return renderAppraisalSheet(node);
  }
  if(node.specialView==='summaryCalendar'){
    return renderSummaryCalendar(node);
  }
  if(node.specialView==='reminders'){
    return renderReminders(node);
  }

  if(node.nodeType==='heading' || node.nodeType==='subheading'){
    return `
      <div class="eyebrow">${node.nodeType==='heading'?'Heading':'Sub Heading'}</div>
      <h1 class="page-title" style="display:inline-block;margin-bottom:20px;background:var(--amber);color:#fff;padding:8px 18px;border-radius:9px;font-size:24px;box-shadow:0 2px 8px var(--amber-glow);">${node.name}</h1>
      <div class="card">${renderHeadingPageBody(node)}</div>
    `;
  }

  const children = featureChildren(node.id);
  const subFeatures = children.filter(c=>(c.nodeType==='feature'||c.nodeType==='subfeature') && canSeeNode(c.id));
  const headings = children.filter(c=>c.nodeType==='heading' && canSeeNode(c.id));

  const subFeatureBoxes = subFeatures.map(sf=>{
    const cnt = featureChildren(sf.id).length;
    const subtitle = sf.description ? sf.description : (cnt ? cnt+' item'+(cnt===1?'':'s') : 'No description yet');
    return `
    <div class="card drag-node" style="margin-bottom:14px;border-left:4px solid var(--amber);" ${isAdmin()?`draggable="true" data-drag-node="${sf.id}"`:''}>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div data-open-feature="${sf.id}" style="cursor:pointer;flex:1;display:flex;align-items:center;gap:8px;">
          ${isAdmin() ? `<span class="drag-handle" title="Drag to reorder">⠿</span>` : ''}
          <div>
            <div style="display:inline-block;background:var(--amber);color:#fff;padding:6px 14px;border-radius:8px;font-size:14px;font-weight:700;box-shadow:0 2px 8px var(--amber-glow);">${sf.name}</div>
            <div class="muted" style="font-size:12px;margin-top:6px;">${subtitle}</div>
          </div>
        </div>
        ${isAdmin() ? `<div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-ghost" data-edit-feature-desc="${sf.id}" title="Rename or add a description">✎</button>
          <button class="btn btn-sm btn-danger" data-delete-node="${sf.id}">Delete</button>
        </div>` : ''}
      </div>
    </div>`;

  const headingCards = headings.map(h=>renderHeadingBox(h, true)).join('');

  return `

      <div class="field" style="max-width:420px;">
        <input type="text" id="summarySearchInput" placeholder="Search past summaries — workstream name, status, blocker...">
      </div>
      <div id="summarySearchResults" style="margin-top:10px;"></div>

    ${subFeatureBoxes}
    ${headingCards}
    ${(!subFeatures.length && !headings.length) ? `<div class="empty-state"><div class="et">Nothing here yet</div></div>` : ''}
  `;
}

let dragSourceNodeId = null;
function bindDragReorder(){
  document.querySelectorAll('[data-drag-node]').forEach(el=>{
    el.addEventListener('dragstart', (e)=>{

      e.dataTransfer.effectAllowed = 'move';

    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); });
    el.addEventListener('dragover', (e)=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=>{ el.classList.remove('drag-over'); });
    el.addEventListener('drop', (e)=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      const targetId = el.dataset.dragNode;
      if(dragSourceNodeId && dragSourceNodeId!==targetId){
        const node = featureNode(dragSourceNodeId);
        if(node) reorderSiblings(node.parentId, dragSourceNodeId, targetId);
      }
      dragSourceNodeId = null;
    });
  });
}
// Same pattern as bindDragReorder, but for dashboard widgets specifically — kept
// separate (own attribute, own tracking variable) so the two drag systems never
// interfere with each other, since a widget and a module could in principle both
// be on screen at once.
let dragSourceWidgetId = null;
function bindDashboardWidgetDrag(){
  document.querySelectorAll('[data-widget-drag]').forEach(el=>{
    el.addEventListener('dragstart', (e)=>{
      dragSourceWidgetId = el.dataset.widgetDrag;
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); });
    el.addEventListener('dragover', (e)=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=>{ el.classList.remove('drag-over'); });
    el.addEventListener('drop', (e)=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      const targetId = el.dataset.widgetDrag;
      if(dragSourceWidgetId && dragSourceWidgetId!==targetId){
        reorderDashboardWidgets(dragSourceWidgetId, targetId);
      }
      dragSourceWidgetId = null;
    });
  });
  // Click anywhere on a real widget (not the empty/reserved ones) to open the
  // Module it draws its data from — same dual behavior as module boxes, which
  // are both draggable and clickable at once without conflicting with each other.
  document.querySelectorAll('[data-widget-navigate]').forEach(el=>{
    el.style.cursor = 'pointer';
    el.addEventListener('click', ()=>{
      const node = featureNode(el.dataset.widgetNavigate);
      if(!node) return;
      if(node.systemView){ ui.view = node.systemView; } else { ui.view = 'feature'; ui.featureNodeId = node.id; }
      render();
    });
  });
}
// Moves draggedId to sit where targetId currently is among its siblings, then
// renumbers everyone's order sequentially. Only ever reorders within the same
// parent — Headings reorder among Headings, Features reorder among Features.
function reorderSiblings(parentId, draggedId, targetId){
  const siblings = featureChildren(parentId);
  const draggedIdx = siblings.findIndex(s=>s.id===draggedId);
  const targetIdx = siblings.findIndex(s=>s.id===targetId);
  if(draggedIdx===-1 || targetIdx===-1 || draggedIdx===targetIdx) return;
  const [moved] = siblings.splice(draggedIdx,1);
  siblings.splice(targetIdx,0,moved);
  siblings.forEach((s,i)=>{ s.order = i+1; });
  persist(); render();
}
// Same reordering logic as reorderSiblings, but for Workspace Dashboard widgets —
// these aren't feature nodes, just a plain ordered list of IDs kept on each
// person's own user record, so this works directly on that array instead. Open to
// everyone, not just admins — this is each person's own personal arrangement of
// their own dashboard, never shared with or applied to anyone else.
function reorderDashboardWidgets(draggedId, targetId){
  const cu = currentUser();
  if(!cu || !Array.isArray(cu.dashboardWidgetOrder)) return;
  const order = cu.dashboardWidgetOrder;
  const draggedIdx = order.indexOf(draggedId);
  const targetIdx = order.indexOf(targetId);
  if(draggedIdx===-1 || targetIdx===-1 || draggedIdx===targetIdx) return;
  const [moved] = order.splice(draggedIdx,1);
  order.splice(targetIdx,0,moved);
  persist(); render();
}

// Uploads a File object to Supabase Storage and returns its public URL. Throws if
// Supabase isn't connected — file uploads have nowhere to go without it.
async function uploadFileToStorage(file){
  if(!supaClient) throw new Error('File uploads need Supabase to be connected.');
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${uid('file')}.${ext}`;
  const { error: upErr } = await supaClient.storage.from('content-uploads').upload(path, file, { cacheControl:'3600', upsert:false });
  if(upErr) throw upErr;
  const { data } = supaClient.storage.from('content-uploads').getPublicUrl(path);
  return { url: data.publicUrl, storagePath: path, fileName: file.name, mimeType: file.type, sizeBytes: file.size };
}

function myReminders(){
  const cu = currentUser();
  if(!cu) return [];
  return state.reminders.filter(r=>r.ownerId===cu.id).sort((a,b)=>{
    const da = reminderDueDateObj(a.nextDueISO || a.dateISO, a.nextDueTime || a.time);
    const db = reminderDueDateObj(b.nextDueISO || b.dateISO, b.nextDueTime || b.time);
    return da - db;
  });
}
function deleteReminder(id){
  state.reminders = state.reminders.filter(r=>r.id!==id);
  persist(); render();
}
// Called when a reminder's popup is dismissed (not snoozed) — either retires it
// (Never) or rolls it forward to its next occurrence (everything else), same
// behavior as Apple Reminders: anchored to the original date+time, not "now".
function advanceReminderPastDue(r){
  if(r.repeat==='never'){
    r.active = false;
  } else {
    const next = computeNextOccurrence(r.nextDueISO || r.dateISO, r.nextDueTime || r.time, r.repeat);
    if(next){ r.nextDueISO = next.dateISO; r.nextDueTime = next.time; }
  }
  r.snoozedUntil = null;
  persist();
}
function snoozeReminder(r, minutes){
  const d = nowIST();
  d.setMinutes(d.getMinutes()+minutes);
  r.snoozedUntil = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  persist();
}

// ---- A small popup calendar: month grid, prev/next to browse any distance in
// either direction, no upper or lower bound on how far out you can go. ----
let calendarPickerState = { year:0, month:0, onPick:null };
function openCalendarPicker(anchorId, currentISO, onPick){
  calendarPickerAnchorId = anchorId;
  const base = currentISO ? new Date(currentISO+'T00:00:00') : new Date(todayISO()+'T00:00:00');
  calendarPickerState = { year: base.getFullYear(), month: base.getMonth(), onPick };
  renderCalendarPickerInto(anchorId, currentISO);
}
function renderCalendarPickerInto(anchorId, selectedISO){
  const { year, month } = calendarPickerState;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isSelected = iso===selectedISO;
    cells += `<div data-cal-day="${iso}" style="text-align:center;padding:6px 0;border-radius:6px;cursor:pointer;font-size:12.5px;${isSelected?'background:var(--amber);color:#fff;font-weight:700;':''}">${d}</div>`;
  }
  const html = `
    <div id="calendarPickerPop" style="position:absolute;z-index:60;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:240px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <button type="button" class="btn btn-sm btn-ghost" data-cal-prev>‹</button>
        <div style="font-size:13px;font-weight:600;">${monthLabel}</div>
        <button type="button" class="btn btn-sm btn-ghost" data-cal-next>›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;color:var(--paper-faint);text-align:center;margin-bottom:4px;">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${cells}</div>
    </div>`;
  const anchor = document.getElementById(calendarPickerAnchorId);
  if(!anchor) return;
  let pop = document.getElementById('calendarPickerPop');
  if(pop) pop.remove();
  anchor.insertAdjacentHTML('beforeend', html);
  document.getElementById('calendarPickerPop').querySelector('[data-cal-prev]').addEventListener('click', (e)=>{
    e.stopPropagation();
    calendarPickerState.month--; if(calendarPickerState.month<0){ calendarPickerState.month=11; calendarPickerState.year--; }
    renderCalendarPickerInto(anchorId, selectedISO);
  });
  document.getElementById('calendarPickerPop').querySelector('[data-cal-next]').addEventListener('click', (e)=>{
    e.stopPropagation();
    calendarPickerState.month++; if(calendarPickerState.month>11){ calendarPickerState.month=0; calendarPickerState.year++; }
    renderCalendarPickerInto(anchorId, selectedISO);
  });
  document.getElementById('calendarPickerPop').querySelectorAll('[data-cal-day]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      calendarPickerState.onPick(el.dataset.calDay);
      document.getElementById('calendarPickerPop').remove();
    });
  });
}

    openCalendarPicker('remDateAnchor', pickedDate, (iso)=>{ pickedDate = iso; dateBtn.textContent = fmtDate(iso); });
  });
  timeBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    openTimePicker('remTimeAnchor', pickedTime, (t)=>{ pickedTime = t; timeBtn.textContent = t; });
  });

  const typeSel = document.getElementById('remContentType');
  const textField = document.getElementById('remTextField');
  const urlField = document.getElementById('remUrlField');
  const fileField = document.getElementById('remFileField');
  const fileInput = document.getElementById('remFile');
  const ACCEPT = { image:'image/*' };
  const updateFields = ()=>{
    const t = typeSel.value;
    textField.style.display = t==='text' ? '' : 'none';
    urlField.style.display = t==='link' ? '' : 'none';
    fileField.style.display = (t==='image'||t==='document') ? '' : 'none';
    if(ACCEPT[t]) fileInput.setAttribute('accept', ACCEPT[t]);
  };
  typeSel.addEventListener('change', updateFields);
  updateFields();

  const submitBtn = document.getElementById('remSubmitBtn');
  submitBtn.addEventListener('click', async ()=>{
    const errEl = document.getElementById('remError');
    errEl.textContent = '';
    const title = document.getElementById('remTitle').value.trim();
    if(!title){ errEl.textContent = 'Give this reminder a title.'; return; }
    if(dateBtn.textContent==='Choose date'){ errEl.textContent = 'Pick a date.'; return; }
    if(timeBtn.textContent==='--:--'){ errEl.textContent = 'Pick a time.'; return; }

    const cType = typeSel.value;
    let content = null;
    if(cType==='text'){
      const text = document.getElementById('remText').value.trim();
      if(!text){ errEl.textContent = 'Add some text, or set content to "None".'; return; }
      content = { type:'text', text };
    } else if(cType==='link'){
      const url = document.getElementById('remUrl').value.trim();
      if(!url){ errEl.textContent = 'Add a URL, or set content to "None".'; return; }
      content = { type:'link', url };
    } else if(cType==='image' || cType==='document'){
      const file = fileInput.files[0];
      if(!file){ errEl.textContent = 'Choose a file, or set content to "None".'; return; }
      const limitMB = (state.settings && state.settings.maxUploadMB) || 250;
      if(file.size > limitMB*1024*1024){ errEl.textContent = `That file is too large — the limit is ${limitMB} MB.`; return; }
      submitBtn.disabled = true; submitBtn.textContent = 'Uploading…';
      try{
        const uploaded = await uploadFileToStorage(file);
        content = { type:cType, fileUrl: uploaded.url, fileName: uploaded.fileName };
      }catch(e){
        submitBtn.disabled = false; submitBtn.textContent = 'Create reminder';
        errEl.textContent = describeError(e);
        return;
      }
    }

    const cu = currentUser();
    state.reminders.push({
      id: uid('rem'), ownerId: cu.id, title, content,
      dateISO: pickedDate, time: pickedTime, repeat: document.getElementById('remRepeat').value,
      active: true, nextDueISO: pickedDate, nextDueTime: pickedTime, snoozedUntil: null,
      createdAt: nowDateTimeIST(),
    });
    persist(); closeModal(); render();
  });
}
